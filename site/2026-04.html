, "G/SPS/N/TUR/105/Add.2", "G/TBT/N/IDN/186"]}]}, "top": [], "items": [{"sym": "G/SPS/N/UKR/262", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-01", "member": "우크라이나", "type": "정규통보", "topic": "품질규격", "ko": "우유·유제품·스프레드 요건 명령(제801호)", "orig": "Order of the Ministry of Economy, Environment and Agriculture of Ukraine No. 801 “On Approval of Requirements for Milk, Dairy Products and Spreadable Fats” of 19 January 2026", "products": "Milk and cream, not concentrated nor containing added sugar or other sweetening matter (HS code(s): 0401); Milk and cream, concentrated or containing added sugar or other sweetening matter (HS code(s): 0402); Buttermilk, curdled milk and cream, yogurt, kephir and other fermented or acidified milk and cream, whether or not concentrated or flavoured or containing added sugar or other sweetening matt", "hs": "0401, 0402, 0403, 0404, 0405, 0406, 17021, 350110", "deadline": "2026-05-31", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NUKR262.docx", "note": "같은 명령을 TBT로도 통보(G/TBT/N/UKR/376)", "desc": "The Order provides for approval of Requirements for milk, dairy products and spreadable fats intended for human consumption, produced in Ukraine or imported (shipped) into the customs territory of Ukraine, at all stages of their marketing.The Order establishes detailed requirements regarding:the determination of the list of food products covered by this regulation, specifically raw milk, drinking milk, dairy products and spreadable fats, including butter, margarine, spreads and fat blends;all types of drinking milk;the definition of specific designations for dairy products and spreadable fats used in certain countries and languages;the labeling and presentation of food products. For example, the labeling of spreadable fats must indicate the fat content as a percentage;the procedures for verifying the declared fat content in spreadable fats.This Order also provides that milk, dairy products and spreadable fats that comply with the requirements of the legislation on safety and certain food quality indicators in effect prior to the entry into force of this Order, but do not meet all or specific provisions of the Requirements for milk, dairy products and spreadable fats approved by this Order, may remain in circulation until the end of their minimum shelf life or the expiration date (use-by date).The Order is also notified under the TBT Agreement.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/USA/3566", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-01", "member": "미국", "type": "정규통보", "topic": "농약 등록", "ko": "일부 농약 제품 등록 자진 취소 명령", "orig": "Product Cancellation Order for Certain Pesticide Registrations", "products": "Multiple commodities", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NUSA3566.docx", "note": "", "desc": "This notice announces EPA's order for the cancellations, voluntarily requested by the registrant and accepted by the Agency, of the products listed in Table 1 of Unit II, pursuant to the Federal Insecticide, Fungicide, and Rodenticide Act (FIFRA). This cancellation order follows a 31 July 2025, Federal Register Notice of Receipt of Requests from the registrant listed in Table 2 of Unit II, to voluntarily cancel these product registrations. In the 31 July 2025, notice, EPA indicated that it would issue an order implementing the cancellations, unless the Agency received substantive comments within the 180-day comment period that would merit its further review of these requests, or unless the registrant withdrew their requests. The registrant did not withdraw their requests. Accordingly, EPA hereby issues in this notice a cancellation order granting the requested cancellations. Any distribution, sale, or use of the products subject to this cancellation order is permitted only in accordance with the terms of this order, including any existing stocks provisions.", "adopt": "", "eif": ""}, {"sym": "G/SPS quirements, sampling and test methods for pumpkin seed flour intended for human consumption.", "adopt": "", "eif": "To be determined."}, {"sym": "G/SPS/N/BDI/154", "more": 4, "area": "SPS", "group": "식품안전", "date": "2026-04-02", "member": "동아프리카 5개국 공동", "type": "정규통보", "topic": "품질규격", "ko": "마요네즈 동아프리카 표준안(DEAS 1320)", "orig": "DEAS 1320:2026 Mayonnaise—Specification; (14 page(s), in English)", "products": "Spices and condiments. Food additives (ICS code(s): 67.220)", "hs": "210390", "deadline": "2026-06-01", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NBDI154.docx", "note": "같은 표준안을 TBT로도 통보(G/TBT/N/BDI/730) / 공동 통보 번호: G/SPS/N/BDI/154, G/SPS/N/KEN/363, G/SPS/N/RWA/147, G/SPS/N/TZA/535, G/SPS/N/UGA/475", "desc": "This Draft East African Standard specifies requirements, sampling and test methods for full-fat/regular mayonnaise, reduced-fat/light mayonnaise, and low-fat mayonnaise.This standard does not apply to emulsified sauces covered by RS 586.", "adopt": "", "eif": "To be determined."}, {"sym": "G/SPS/N/KEN/364", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-02", "member": "케냐", "type": "정규통보", "topic": "위생규범", "ko": "식용 식물성 유지 가공 실행규범 케냐 표준안(DKS 3030)", "orig": "DKS 3030:2025 Processing of edible vegetable oil — Code of Practice", "products": "Animal and vegetable fats and oils (ICS code(s): 67.200.10)", "hs": "15", "deadline": "2026-06-01", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NKEN364.docx", "note": "", "desc": "This draft Kenya Code of Practice provides guidelines and best practices for processing of edible vegetable oil from various oil crops (oilseeds, nuts and fruits) to achieve food safety and quality, compliance to standards and regulatory requirements while ensuring industry sustainability and competitiveness. It applies to all players involved in the processing of edible vegetable oil.", "adopt": "", "eif": "To be determined."}, {"sym": "G/SPS/N/KEN/365", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-02", "member": "케냐", "type": "정규통보", "topic": "품질규격", "ko": "정통 차(오소독스 티) 케냐 표준(KS 2744)", "orig": "KS 2744:2025 Orthodox tea – Specification", "products": "Tea (ICS code(s): 67.140.10)", "hs": "0902", "deadline": "2026-06-01", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NKEN365.docx", "note": "", "desc": "This Kenya Standard specifies requirements, sampling and test methods for orthodox teas (non-aerated, aerated, semi aerated) processed from green leaf or purple leaf of the species Camellia sinensis (Linneaus)O. Kuntze. This standard does not apply to flavoured teas and decaffeinated orthodox teas.", "adopt": "June 2026", "eif": "To be determined."}, {"sym": "G/SPS/N/PAN/119", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-02", "member": "파나마", "type": "정규통보", "topic": "먹는물", "ko": "포장 먹는물 일반요건 기술규정", "orig": "Reglamento Técnico - Tecnología de los alimentos. Agua envasada. Requisitos generales (Technical Regulations: Food Technology. Packaged water. General requirements)", "products": "Non-alcoholic beverages (ICS code(s): 67.160.20)", "hs": "2201, 2202", "deadline": "2026-05-11", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NPAN119.docx", "note": "", "desc": "The notified Technical Regulations seek to establish the conformity assessment procedure (CAP) for bottled water that is processed and marketed in, and imported into, the Republic of Panama.", "adopt": "To be determined", "eif": "To be determined"}, {"sym": "G/SPS/N/EGY/60/Add.3", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-07", "member": "이집트", "type": "추가통보", "topic": "품질규격", "ko": "참치·가다랑어 통조림 이집트 표준(ES 804) 추가통보", "orig": "Fish products", "products": "Fish products", "hs": "160414", "deadline": "2026-04-14", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEGY60A3.docx", "note": "같은 표준을 TBT로도 통보(G/TBT/N/EGY/74/Add.3)", "desc": "This addendum concerns the notification of the draft of the Egyptian Standard ES 804 for “canned tuna and bonito” (14 pages, in Arabic).It should be noted that the Ministerial Decree No. 256/2016, which was formally notified G/SPS/N/EGY/60/Add.2 dated 12 August 2016 mandated among others the earlier versions of this Egyptian Standard, and the draft of this Standard was formerly notified in G/SPS/N/EGY/60 dated 3/3/2015.Worth mentioning is that this draft standard is technically identical with Codex Standard CXS 70-1981 adopted in 1981, revised in 1995, amended in 2011, 2013, 2016, 2018 and 2024.Producers and importers are kept informed of any amendments in the Egyptian standards through the publication of administrative orders in the official gazette.Proposed date of adoption: To be determined.Date of entry into force: To be determined.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/EGY/76/Add.1", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-07", "member": "이집트", "type": "추가통보", "topic": "품질규격", "ko": "염장 생선 이집트 표준(ES 1725) 추가통보", "orig": "Salted fish", "products": "Fish and fishery products", "hs": "03", "deadline": "2026-04-14", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEGY76A1.docx", "note": "같은 표준을 TBT로도 통보(G/TBT/N/EGY/1/Add.36)", "desc": "This addendum concerns the notification of the draft of the Egyptian standard ES 1725 for \"Salted fish\" (17 pages, in Arabic).It should be noted that the Ministerial Decree No. 256/2016, which was formerly notified in G/SPS/N/EGY/76 dated 11 August 2016, mandated among others the earlier version of this Egyptian Standard.Worth mentioning is that this draft standard complies with Codex standard CXS 244 \"Salted Atlantic Herring and Salted Sprat\" adopted in 2004, amended in 2011, 2013, 2016, 2018 and 2024. Producers and importers are kept informed of any amendments in the Egyptian Standard through the publication of administrative orders in the official gazetteProposed date of adoption: To be determined.Date of entry into force: To be determined.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/EGY/92/Add.10", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-07", "member": "이집트", "type": "추가통보", "topic": "품질규격", "ko": "탄산음료 일반 이집트 표준(ES 336-1) 추가통보", "orig": "Carbonated Beverages", "products": "Food products", "hs": "", "deadline": "2026-04-14", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEGY92A10.docx", "note": "같은 표준을 TBT로도 통보(G/TBT/N/EGY/1/Add.35)", "desc": "This addendum concerns the notification of the draft Egyptian standard ES 336-1 for \"Carbonated Beverages - part 1: General\" (9 page, in Arabic).It should be noted that the Ministerial Decree No. 100/2019, which was formerly notified in G/SPS/N/EGY/92 dated 8 July 2019, mandated among others the earlier versions and amendments of this standard.Worth mentioning is that the draft of this standard has been formulated according to National studies.Producers and importers are kept informed of any amendments in the Egyptian Standard through the publication of administrative orders in the official gazette.Proposed date of adoption: To be determinedDate of entry into force: To be determined", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/EGY/92/Add.11", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-07", "member": "이집트", "type": "추가통보", "topic": "소비기한", "ko": "식품 소비기한 이집트 표준(ES 2613-2) 부분 개정 추가통보", "orig": "Food products", "products": "Food products", "hs": "", "deadline": "2026-04-14", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEGY92A11.docx", "note": "같은 표준을 TBT로도 통보(G/TBT/N/EGY/212/Add.10)", "desc": "This addendum concerns the notification of the draft of the Egyptian Standard ES 2613-2 for \"shelf life for food products part: 2 - shelf life \" (partial amendment in 1 page, in Arabic).It should be noted that the Ministerial Decree No. 100/2019 which was formerly notified in G/SPS/N/EGY/92/Add.1 dated 3 June 2020, the Ministerial Decree No. 653/2020 which was formerly notified in G/SPS/N/EGY/92/Add.2 dated 15 March 2021, the Ministerial Decree No. 222/2021 which was formerly notified in G/SPS/N/EGY/92/Add.3 dated 20 September 2021, the Ministerial Decree No. 522/2021 which was formerly notified in G/SPS/N/EGY/92/Add.4 dated 18 March 2022, the Ministerial Decree No. 393/2022 which was formerly notified in G/SPS/N/EGY/92/Add.5 dated 25 August 2022, the Ministerial Decree No. 233/2023 which was formerly notified in G/SPS/N/EGY/92/Add.6 dated 21 July 2023, the Ministerial Decree No. 361/2024 which was formerly notified in G/SPS/N/EGY/92/Add.7 dated 12 July 2024, the draft of this standard which was formally notified in G/SPS/N/EGY/92/Add.8 dated 5 August 2024, the Ministerial Decree No. 447 /2024 which was formerly notified in G/SPS/N/EGY/92/Add.9 dated 9 October 2024,mandated among others the earlier versions and amendments of this Standard.Worth mentioning is that this standard has been partially modified in table (2) to be as follows:Product name: Sterilized flavored sweetened milk.Standard No.: ES. 1641/2023.Standard name: Sterilized flavored sweetened milk.Shelf life: 12 months and 9 months.Package type: Metal can.Worth mentioning is that this standard has been formulated according to National Studies and its updates.Producers and importers are kept informed of any amendments in the Egyptian standards through the publication of administrative orders in the official gazette.Date of adoption: To be determined.Date of entry into force: To be determined.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/LKA/38/Add.3", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-07", "member": "스리랑카", "type": "추가통보", "topic": "표시", "ko": "식품 표시·광고 규정안(2015) 추가 개정", "orig": "The Amendment of the Draft Food (Labelling and Advertising) Regulations 2015", "products": "Food", "hs": "", "deadline": "2026-06-06", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NLKA38A3.docx", "note": "", "desc": "Food Authority in Sri Lanka has decided to further amend the Draft (Food Labelling and Advertising) Regulations 2015, dated 4 December 2015, notified as G/SPS/N/LKA/38 by Sri Lanka.2015 draft was amended and later it was published as the Food (Labelling & Advertising) Regulations 2022. The Food (labelling & Advertising) Regulations 2022, published in the Gazette Extraordinary, No.2319/40 of 14 February 2023 and Food (Labelling and Advertising) Regulations 2005 made under the Food Act, No. 26 of 1980 and published in Gazette Extraordinary 1376/9 of 19 January 2005 and all other subsequent Amendments will be rescinded, by the Draft Food (Labelling and Advertising) Regulations 2026. The Draft Food (Labelling and Advertising) Regulations 2026 will enter into force on 1 July 2026.These regulations shall not apply to food products manufactured before 1 July 2026.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/KWT/203", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-08", "member": "쿠웨이트", "type": "정규통보", "topic": "수입조건(BSE)", "ko": "BSE 청정국·지역 유럽산 소 유래 식품 수입 허용 장관결정안", "orig": "Ministerial decision 2165 regarding the draft measure permitting importation of bovine-derived food products from BSE-free countries/zones in accordance with WOAH Terrestrial Code (Chapter 11.4, Article 11.4.2)", "products": "Meat of bovine animals, fresh or chilled (HS code(s): 0201); Meat of bovine animals, frozen (HS code(s): 0202); Meat, meat products and other animal produce (ICS code(s): 67.120)", "hs": "0201, 0202", "deadline": "2026-06-07", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NKWT203.docx", "note": "", "desc": "Draft measure permitting importation of bovine-derived food products from BSE-free countries/zones from European countries, in accordance with WOAH Terrestrial Code (Chapter 11.4, Article 11.4.2).", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/TUR/105/Add.2", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-08", "member": "튀르키예", "type": "추가통보", "topic": "식품용 기구·포장", "ko": "식품접촉 플라스틱 재질·제품 고시 개정 추가통보", "orig": "Turkish Food Codex Communiqué on Amending the Communiqué on Plastic Materials and Articles in Contact with Food", "products": "Plastic materials and articles in contact with food", "hs": "", "deadline": "2026-06-07", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTUR105A2.docx", "note": "", "desc": "Turkish Food Codex Communiqué on Plastic Materials and Articles in Contact with Food was notified to WTO through G/SPS/N/TUR/105 on 15 November 2018.The purpose of this draft Communiqué is to amend the Turkish Food Codex Communiqué on Plastic Materials and Articles in Contact with Food. This amendment repeals entry No 151 concerning BPA from Table 1 of Annex I in the Communiqué because of the use of Bisphenol A (BPA), as well as other hazardous bisphenols and bisphenol derivatives will be regulated with a new Communiqué. Also, a new sentence has been added to the main Communique: “4,4'-isopropylidenediphenol (Bisphenol A, CAS No. 80-05-7) and other hazardous bisphenols and hazardous bisphenol derivatives listed in the Turkish Food Codex Communiqué on Restricting the Use of Bisphenol A, Other Hazardous Bisphenols, and Bisphenol Derivatives in Certain Materials and Articles in Contact with Food, may only be used in the production of plastic materials and articles in accordance with the relevant Communiqué.”This Communiqué enters into force on the date of its publication.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/TUR/156", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-08", "member": "튀르키예", "type": "정규통보", "topic": "식품용 기구·포장", "ko": "식품접촉 재질 중 비스페놀A 등 유해 비스페놀류 사용 제한 고시안", "orig": "Turkish Food Codex Communiqué on Restricting the Use of Bisphenol A, Other Hazardous Bisphenols, and Bisphenol Derivatives in Certain Materials and Articles in Contact with Food", "products": "Food contact materials and articles", "hs": "", "deadline": "2026-06-07", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTUR156.docx", "note": "", "desc": "The purpose of this Communiqué is to establish specific rules for Bisphenol A (BPA) and its salts, as well as other hazardous bisphenols and bisphenol derivatives used in the production of certain materials and articles that come into contact with food.", "adopt": "", "eif": "This Communiqué enters into force on the date of its publication with the transitional period until 31 December 2026 Provisional Article Operators who were conducting activities within the scope of this Communiqué before its publication must comply with the provisions of this Communiqué by 31/12/2026. During the transition periods specified in this Communiqué, the provisions of the legislation that were in force prior to the publication date of this Communiqué shall continue to be applied."}, {"sym": "G/SPS/N/BRA/2483", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-09", "member": "브라질", "type": "정규통보", "topic": "농약(유효성분)", "ko": "구리화합물 모노그래프에 삼염기성 황산구리 추가 결의안(제1390호)", "orig": "Draft Resolution 1390, 23 March 2026", "products": "Environment. Health protection. Safety (ICS code(s): 13)", "hs": "", "deadline": "2026-06-08", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NBRA2483.docx", "note": "", "desc": "This draft resolution proposes the inclusion of subitem C55.7 - TRIBASIC COPPER SULFATE in monograph C55 - COPPER-BASED COMPOUNDS, on the Monograph List of Active Ingredients for Pesticides, Household Cleaning Products and Wood Preservatives, which was published by Normative Instruction 103 on 19 October 2021 in the Brazilian Official Gazette (DOU - Diário Oficial da União).", "adopt": "To be determined after the end of the consultation period.", "eif": "To be determined after the end of the consultation period."}, {"sym": "G/SPS/N/CAN/1632/Corr.1", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-09", "member": "캐나다", "type": "정정통보", "topic": "농약 잔류허용기준", "ko": "이소사이클로세람 잔류허용기준안(PMRL2026-03) 대상 농산물 정정", "orig": "Proposed Maximum Residue Limit for Isocycloseram (PMRL2026-03): Correction", "products": "Pesticide isocycloseram in or on various commodities (ICS codes: 65.020, 65.100, 67.040, 67.060, 67.080, 67.200)", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCAN1632C1.docx", "note": "", "desc": "This corrigendum concerns the raw agricultural commodities indicated in section 6 of the notification G/SPS/N/CAN/1632, in English and French. The notification reports the maximum residue limits (MRLs) proposed by Health Canada's Pest Management Regulatory Agency (PMRA) as:MRL (ppm)1 Raw Agricultural Commodity (RAC) and/or Processed Commodity10 Leafy vegetables (crop group 4-13), except head lettuce 4.0 Brassica head and stem vegetable group (crop group 5-13) 2.0 Dried tomatoes 1.5 Dried prune plums 1.0 Stone fruits (crop group 12-09) 0.6 Fruiting vegetables (crop group 8-09) 0.5 Almond oil 0.4 Pome fruits (crop group 11-09) 0.2 Tree nuts (crop group 14-11) 0.15 Cucurbit vegetables (crop group 9); dry soybeans 0.01 Tuberous and corm vegetables (crop subgroup 1C); dry lentils, head lettuce, peanuts 1 ppm = parts per millionThis corrigendum amends an error in section 6 of the original notification. That document inadvertently omitted to include proposed MRLs for the following raw agricultural commodities:MRL (ppm)1 Raw Agricultural Commodity (RAC) and/or Processed Commodity0.01 Field corn, popcorn grain1 ppm = parts per million", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/SLV/129/Add.2", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-10", "member": "엘살바도르", "type": "추가통보", "topic": "도축 위생", "ko": "도축장 위생요건 기술규정(RTS 65.04.01:26) 재통보 — 60일 의견수렴", "orig": "Salvadoran Technical Regulation RTS 65.04.01:26: Abattoirs. Slaughter and preparation of animals for the market. Sanitary requirementsOn 27 October 2023, the Government of the Republic of El Salvador notified, in document G/SPS/N/SLV/129/Add.1, draft Salvadoran Technical Regulation RTS 65.04.01:23: \"Abattoirs. Slaughter and preparation of animals for the market. Sanitary requirements. First Revision\", which sought to establish the infrastructural and sanitary requirements to be met by abattoirs engaged in the slaughter, preparation and deboning of animals for the market and the storage and tra", "products": "ICS number: 65.040.20", "hs": "", "deadline": "2026-06-09", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NSLV129A2.docx", "note": "", "desc": "Salvadoran Technical Regulation RTS 65.04.01:26: Abattoirs. Slaughter and preparation of animals for the market. Sanitary requirementsOn 27 October 2023, the Government of the Republic of El Salvador notified, in document G/SPS/N/SLV/129/Add.1, draft Salvadoran Technical Regulation RTS 65.04.01:23: \"Abattoirs. Slaughter and preparation of animals for the market. Sanitary requirements. First Revision\", which sought to establish the infrastructural and sanitary requirements to be met by abattoirs engaged in the slaughter, preparation and deboning of animals for the market and the storage and transportation of meat, in order to obtain building and operating authorization.The purpose of the present Addendum is to inform WTO Members that the content of this Salvadoran Technical Regulation has been updated. In the light of foregoing, there will be a period of 60 days for the submission of comments and observations as from the date of notification.https://members.wto.org/crnattachments/2026/SPS/SLV/26_01997_00_s.pdf", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/TUR/157", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-13", "member": "튀르키예", "type": "정규통보", "topic": "품질규격", "ko": "식품코덱스 밀가루 고시 개정안", "orig": "Turkish Food Codex Communiqué on Amending the Communiqué on Wheat Flour", "products": "Wheat Flour", "hs": "110100", "deadline": "2026-06-12", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTUR157.docx", "note": "같은 고시안을 TBT로도 통보(G/TBT/N/TUR/233)", "desc": "The purpose of this draft Communiqué is to amend the Turkish Food Codex Communiqué on Wheat Flour. This amendment prohibits the addition of brown or black colorants - such as roasted malt flour, roasted chickpea flour, and dark malt extract - and similar ingredients to wheat flour for the purpose of imparting color and/or aroma.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/TUR/158", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-13", "member": "튀르키예", "type": "정규통보", "topic": "품질규격", "ko": "식품코덱스 빵·빵류 고시 개정안", "orig": "Turkish Food Codex Communiqué on Amending the Communiqué on Bread and Bread Varieties (2012/2)", "products": "Bread and Bread Varieties", "hs": "1905", "deadline": "2026-06-12", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTUR158.docx", "note": "같은 고시안을 TBT로도 통보(G/TBT/N/TUR/234)", "desc": "The purpose of this draft Communiqué is to amend Turkish Food Codex Communiqué on Bread and Bread Varieties. With the amendment, the use of roasted malt flour, roasted chickpea flour, dark malt extract, and similar ingredients for the purpose of imparting dark colours such as brown/black and/or flavour to the products covered by the Communiqué has been prohibited.", "adopt": "", "eif": "This Communiqué enters into force on the date of its publication with the transitional period until 31 December 2026: “Provisional Article 4 (1) Food business operators operating within the scope of this Communiqué must comply with the provisions introduced by the Communiqué enacting this article by 31/12/2026.”"}, {"sym": "G/SPS/N/UKR/263", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-14", "member": "우크라이나", "type": "정규통보", "topic": "등록·허가", "ko": "관리대상 시설 국가등록 절차 결의안", "orig": "Draft Resolution of Ukraine \"On the Approval of the Procedure for State Registration of Objects\"", "products": "Substances used in the manufacture of materials and articles, including substances incorporated into active and/or intelligent materials and articles, as well as processes for the recycling of plastics that have been previously used and are reused in the manufacture of materials and articles", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NUKR263.docx", "note": "", "desc": "The draft Resolution has been developed to regulate the specific aspects of state registration of substances used in the manufacture of materials and articles, including substances incorporated into active and/or intelligent materials and articles, as well as processes for the recycling of plastics that have been previously used and are reused in the manufacture of materials and articles. The draft Resolution provides for the adoption of the Procedure for state registration of objects, including, in particular, requirements for the scientific assessment of the safety of the object (risk assessment) and the issuance of a scientific opinion on its safety.It further established that the electronic system of the State Register of substances authorized for use in the manufacture of materials and articles, as well as plastic recycling processes, shall become operational on 1 September 2026.The draft Resolution is also notified under the TBT Agreement.", "adopt": "To be determined.", "eif": ""}, {"sym": "G/SPS/N/EU/940", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-15", "member": "유럽연합", "type": "정규통보", "topic": "식품용 기구·포장", "ko": "식품접촉 재생 플라스틱 규정 (EU) 2022/1616 개정안 — 등록·적합성 서류·시험법·수입 시 제출서류", "orig": "Draft Commission Regulation amending Regulation (EU) 2022/1616 as regards the management of the Union register, compliance documentation, test methods, and documents to be presented upon release for free circulation (Text with EEA relevance)", "products": "Plastics and articles thereof (HS code 39); Materials and articles in contact with foodstuffs (ICS code 67.250)", "hs": "39", "deadline": "2026-06-14", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEU940.docx", "note": "같은 개정안을 TBT로도 통보(G/TBT/N/EU/1203)", "desc": "This draft amendment to Regulation (EU) 2022/1616 aims to address current challenges improving the documentation and controls of recycled plastics including those imported to the EU, to provide the legal basis for the creation of the TARIC codes, and to streamline with an interactive digital platform the procedure for registration by industry and the management of the recycling installations by national authorities.", "adopt": "Foreseen 30 September 2026.", "eif": "This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union. The provisions shall apply from entry into force except for those subject to the transitional measures referred to in the Regulation."}, {"sym": "G/SPS/N/EGY/180", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-16", "member": "이집트", "type": "정규통보", "topic": "담배", "ko": "전자담배 액상 일반요건 이집트 표준안(ES 8205-1)", "orig": "Draft of the Egyptian Standard “ES 8205-1 General requirements for traditional cigarette alternatives - Part:1 Electronic Cigarettes – e-Liquid, (partial amendment in 1 page, in Arabic)”", "products": "Tobacco, tobacco products and related equipment (ICS code(s): 65.160)", "hs": "", "deadline": "2026-06-15", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEGY180.docx", "note": "", "desc": "This draft standard includes partial amendment of the Egyptian Standard “ES 8205-1 General requirements for traditional cigarette alternatives - Part:1 Electronic Cigarettes – e-Liquid” (partial amendment in 1 page, in Arabic).Worth mentioning is that this standard has been partially amended as follows:Item No. 3/6 to be (The volume of liquid in the cartridge (clause 2/4) that contains the e-liquid and is intended for single use and to be fitted on its own heating device shall not exceed 20 ml).Item No. 3/7 to be (The capacity of the e-liquid container integrated within the same product shall not exceed 20 ml).Producers and importers are kept informed of any amendments in the Egyptian Standard through the publication of administrative orders in the official gazette.", "adopt": "To be determined.", "eif": "To be determined."}, {"sym": "G/SPS/N/USA/3567", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-16", "member": "미국", "type": "정규통보", "topic": "식품첨가물", "ko": "착색료 규정에서 용매 메틸렌클로라이드·트리클로로에틸렌·에틸렌디클로라이드 삭제 청원 접수", "orig": "Filing of Color Additive Petition From the International Association of Color Manufacturers; Request To Amend the Color Additive Regulations To Remove the Solvents Methylene Chloride, Trichloroethylene, and Ethylene Dichloride; Notification of Petition", "products": "Colouring matter of vegetable or animal origin (including dyeing extracts but excluding animal black), whether or not chemically defined; preparations as specified in Note 3 to this Chapter based on colouring matter of vegetable or animal origin. (HS code(s): 3203); Food technology (ICS code(s): 67)", "hs": "3203", "deadline": "2026-06-01", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NUSA3567.docx", "note": "", "desc": "The Food and Drug Administration (FDA or we) is announcing that we have filed a color additive petition, submitted by the International Association of Color Manufacturers (IACM or petitioner), proposing that we amend the color additive regulations to no longer provide for the use of three specified solvents (methylene chloride, trichloroethylene, and ethylene dichloride) for preparing certain color additives because these uses have been permanently abandoned.The color additive petition was filed on 20 March 2026.", "adopt": "Not applicable", "eif": "Not applicable"}, {"sym": "G/SPS/N/VNM/181", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-16", "member": "베트남", "type": "정규통보", "topic": "농약 등록", "ko": "사용 허용·금지 농약 목록 개정 시행규칙안", "orig": "Draft Circular amending and supplementing Circular No. 75/2025/TT-BNNMT dated 26 December 2025, of the Minister of Agriculture and Environment on promulgating the List of plant protection products permitted for use in Viet Nam and the List of plant protection products banned from use in Viet Nam", "products": "Plant protection products", "hs": "", "deadline": "2026-06-15", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NVNM181.docx", "note": "", "desc": "This Draft Circular is promulgating the amendments and additions to the List of permitted plant protection products and the List of banned plant protection products in Viet Nam published in 2025. Circular including three parts: Circular, Annex 1 (List of plant protection products with changed information related to the trade names and the registrants) and Annex 2 (List of additional products to the List of permitted plant protection products in Viet Nam).This Circular adds three new plant protection active ingredients (Acequinocyl, Resveratrol, Fenhexamid) to Annex 1 at the request of pesticide registration organizations or individuals in 2026. In addition, this Circular includes several new plant protection products containing existing active ingredients and mixtures that are already included in the list.", "adopt": "", "eif": "45 days from date of publication."}, {"sym": "G/SPS/N/CAN/1639", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-17", "member": "캐나다", "type": "정규통보", "topic": "효소", "ko": "허용 식품효소 목록 개정 — 트랜스글루타미나아제", "orig": "Modification to the List of Permitted Food Enzymes (transglutaminase)", "products": "Transglutaminase (ICS Codes: 67.220.20)", "hs": "", "deadline": "2026-06-28", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCAN1639.docx", "note": "", "desc": "Health Canada's Food and Nutrition Directorate completed a premarket safety assessment of a food additive submission seeking authorization for the use of transglutaminase as food enzyme in various foods of plant and animal origin at a maximum level of use of “Good Manufacturing Practice”.The results of the premarket assessment support the safety of transglutaminase for its requested use. Consequently, Health Canada modified the List of Permitted Food Enzymes as described in this notice on 14 April 2026. This modification comes into force on the day it is published in the list.The purpose of the information document is to publicly announce the Department's decision in this regard and to provide the appropriate contact information for those wishing to submit an inquiry or new scientific information relevant to the safety of this food additive.", "adopt": "The modification to the food additive’s permitted use is legally enabled once published in Health Canada's Lists of Permitted Food Additives:( https://www.canada.ca/en/health-canada/services/food-nutrition/food-safety/food-additives/lists-permitted.html ).", "eif": "The food additive modification noted in this document comes into force the day it is made to the Lists of Permitted Food Additives : ( https://www.canada.ca/en/health-canada/services/food-nutrition/food-safety/food-additives/lists-permitted.html )."}, {"sym": "G/SPS/N/JPN/1383/Add.1", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-17", "member": "일본", "type": "추가통보", "topic": "식품첨가물", "ko": "식품첨가물 아황산류·글루콘산아연 규격 개정 시행(2026.4.7)", "orig": "Revision of the Specifications and Standards for Foods, Food Additives, Etc. Under the Food Sanitation Act (final rule)", "products": "Food additives (Potassium Metabisulfite, Sodium Hydrosulfite, Sodium Metabisulfite, Sodium Sulfite, Sulfur Dioxide, and Zinc Gluconate)", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NJPN1383A1.docx", "note": "", "desc": "As notified in G/SPS/N/JPN/1383 (dated 22 January 2026), revision of standards for Potassium Metabisulfite, Sodium Hydrosulfite, Sodium Metabisulfite, Sodium Sulfite, Sulfur Dioxide, and Zinc Gluconate came into force on 7 April 2026.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/UKR/264", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-17", "member": "우크라이나", "type": "정규통보", "topic": "동물용의약품", "ko": "동물용의약품 유효성분 잔류허용기준 설정 절차 결의안", "orig": "Draft Resolution of the Cabinet of Ministers of Ukraine “On the Approval of the Procedure for Establishing Maximum Residue Limits of Active Substances Contained in Veterinary Medicinal Products”", "products": "Veterinary medicinal products", "hs": "", "deadline": "2026-06-16", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NUKR264.docx", "note": "", "desc": "The draft Resolution provides for the approval of the Procedure for establishing maximum residue limits of active substances contained in veterinary medicinal products, in particular: • establishing the procedure for submitting application for the setting of maximum residue limits and the list of documents to be attached thereto; • defining the requirements for the content and structure of the dossier on a pharmacologically active substance, including the scientific data necessary for conducting a safety assessment; • establishing a mechanism for conducting scientific risk assessment for human health, taking into account internationally recognized approaches; • defining the criteria for decision-making on the establishment, amendment, provisional establishment or withdrawal of maximum residue limits; • defining the powers of the competent authority with regard to organizing the expert evaluation of submitted materials, adopting relevant decisions and maintaining a list of established maximum residue limits. This Procedure lays down rules and procedures for establishing:maximum residue limits of active substances that may be permitted in food of animal origin;the level of a residue of a pharmacologically active substance established for control reasons in the case of certain substances for which a maximum residue limit has not been established under this Procedure.This Procedure shall not apply to biologically derived active components intended to induce active or passive immunity or to diagnose the state of immunity, used in immunological veterinary medicinal products, nor to substances unintentionally added to food that are present in such food as a result of the production process.The provisions of this Procedure shall apply in compliance with the legislation prohibiting the use of certain substances having hormonal or thyrostatic effects and beta-agonists.Maximum residue limits shall be established for pharmacologically active substances used or intended for use in veterinary medicinal products prior to their authorization.The draft Procedure also stipulates that it shall be prohibited to impede the import or placing on the market of food products of animal origin on grounds related to maximum residue limits or reference points for action, provided that this Procedure and its implementing measures have been complied with.", "adopt": "To be determined.", "eif": "The Resolution will enter into force on the date of its publication."}, {"sym": "G/SPS/N/UKR/258/Add.1", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-20", "member": "우크라이나", "type": "추가통보", "topic": "수입검사", "ko": "수입 강화검사 대상 비동물성 식품·사료 목록 개정 명령 채택(제3898호)", "orig": "The draft Order of the Ministry of Economy, Environment and Agriculture of Ukraine \"On Amendments to the List of food products of non-animal origin and feedstuffs of non-animal origin, the consignments of which are subject to enhanced state control when imported (sent) into the customs territory of Ukraine\"", "products": "Food and feed of non-animal origin", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NUKR258A1.docx", "note": "", "desc": "Ukraine notifies the adoption of Order of the Ministry of Economy, Environment and Agriculture of Ukraine No. 3898 \"On Amendments to the List of food products of non-animal origin and feedstuffs of non-animal origin, the consignments of which are subject to enhanced state control when imported (sent) into the customs territory of Ukraine\" of 10 March 2026. The Order was registered in the Ministry of Justice of Ukraine on 26 March 2026. It was officially published and entered into force on 14 April 2026.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/GBR/127", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-21", "member": "영국", "type": "정규통보", "topic": "농약 잔류허용기준", "ko": "프로설포카브 잔류허용기준 신설(GB MRL 등록부 개정)", "orig": "New GB MRLs for prosulfocarb amending the GB MRL Statutory Register", "products": "Herbs and edible flowers (0256000) * For reference, the full list of GB commodity codes is set out in Part 1 of the GB pesticides Maximum Residue Level Statutory Register – see link", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NGBR127.docx", "note": "", "desc": "Prosulfocarb is an approved active substance in Great Britain (GB). An application was received by the Health and Safety Executive (HSE) requesting new Maximum Residue Levels (MRLs) for prosulfocarb in or on herbs and edible flowers. Following assessment, new MRLs have been introduced to set import tolerances for: Herbs and edible flowers from 0.05* mg/kg to 20 mg/kg. The Evaluation Report / Reasoned Opinion supporting the new MRLs is available at the following link: The evaluation of new MRLs for prosulfocarb in or on herbs and edible flowersThe residue levels arising in food from the notified uses result in consumer exposures below the toxicological reference values. As the residue levels exceed the current MRLs in force, new MRLs are being adopted. There are currently no CXLs for prosulfocarb.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/KOR/845", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-21", "member": "한국", "type": "정규통보", "topic": "수입검사", "ko": "수입식품안전관리 특별법 시행규칙 개정안 — 재수입 식품 정밀검사 횟수 차등화", "orig": "Proposed amendments of the “Enforcement Rule of the Special Act on Imported Food Safety Control”", "products": "Foods", "hs": "", "deadline": "2026-06-20", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NKOR845.docx", "note": "우리나라 통보", "desc": "This amendment is intended to enhance the safety management of imported foods with potential risk by improving the current system, under which the number of laboratory inspections is uniformly applied to re-imported foods with a history of non compliance, to allow the inspections to be applied differentially depending on the level of risk, up to a maximum of 20 times. It also aims to improve and supplement shortcoming identified in the operation of the current system, including the reasonable adjustment of the frequency of sanitation training that food import business operators are required to provide to their employees.", "adopt": "To be determined.", "eif": "To be determined."}, {"sym": "G/SPS/N/TPKM/656/Add.1", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-21", "member": "대만", "type": "추가통보", "topic": "농약 잔류허용기준", "ko": "식품 중 농약 잔류허용기준 개정 확정", "orig": "Standards for Pesticide Residue Limits in Foods", "products": "Fruits, vegetables, cereal grains, dry beans, tree nuts, herbs, hops, and coffee bean", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTPKM656A1.docx", "note": "", "desc": "The Separate Customs Territory of Taiwan, Penghu, Kinmen, and Matsu proposed to revise the \"Standards for Pesticide Residue Limits in Foods” on 9 January 2026 (G/SPS/N/TPKM/656). The final amendments take effect on 21 April 2026.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/USA/3569", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-21", "member": "미국", "type": "정규통보", "topic": "농약 잔류허용기준", "ko": "메톡시페노자이드 잔류허용기준 최종 규칙", "orig": "Pesticide tolerances for methoxyfenozide. Final Rule", "products": "Multiple Commodities", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NUSA3569.docx", "note": "", "desc": "This regulation establishes tolerances for residues of methoxyfenozide, including its metabolites and degradates, (CASRN 161050-58-4) in or on the food and feed commodities listed under Unit II. Petitioned-For Tolerances. Under the Federal Food, Drug, and Cosmetic Act (FFDCA), The Interregional Research Project Number 4 (IR- 4) submitted a petition to EPA requesting that EPA establish a maximum permissible level for residues of this pesticide in or on the identified commodities.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/VNM/182", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-21", "member": "베트남", "type": "정규통보", "topic": "수입관리", "ko": "농업환경부 중·고위험 관리 품목 목록 시행규칙안", "orig": "Draft Circular Promulgating the List of Products and Goods with Medium Risk Level and High Risk Level under the Management Authority of the Ministry of Agriculture and Environment", "products": "Plant Varieties (Rice seeds, Maize seeds), Fertilizers, Animal Feed, Livestock Waste Treatment Products, Veterinary Drugs, Aquatic Feed, Aquaculture Environmental Treatment Products, Wood Adhesives, Agricultural Machinery and Equipment, Plant Protection products", "hs": "", "deadline": "2026-06-20", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NVNM182.docx", "note": "같은 시행규칙안을 TBT로도 통보(G/TBT/N/VNM/401)", "desc": "The Circular is promulgated to replace Circular No. 16/2021/TT-BNNPTNT dated 20 December 2021 of the Minister of Agriculture and Rural Development promulgating the list of products and goods likely to cause safety risks under the management responsibility of the Ministry of Agriculture and Rural Development, serving as the basis for applying methods of state inspection of product and goods quality.The promulgation of the Circular does not create any new administrative procedures related to state quality inspection of products and goods.The following products: plant varieties (rice seeds and maize seeds), fertilizers, animal feed, livestock waste treatment products, veterinary drugs, aquaculture feed, and aquaculture environmental treatment products are currently classified as products and goods capable of causing safety risks under Circular No. 16/2021/TT-BNNPTNT, and are therefore subject to quality inspection of imported goods prior to customs clearance.Under the draft Circular, the above-mentioned products and goods have been reviewed, assessed, and classified as products and goods with a medium level of risk. Accordingly, enterprises will not be required to undergo quality inspection upon importation, thereby helping to shorten customs clearance time, reduce compliance costs, and facilitate production and business activities.", "adopt": "To be determined.", "eif": ""}, {"sym": "G/SPS/N/VNM/182/Corr.1", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-22", "member": "베트남", "type": "정정통보", "topic": "수입관리", "ko": "중·고위험 관리 품목 목록 시행규칙안 통보 정정", "orig": "Draft Circular Promulgating the List of Products and Goods with Medium Risk Level and High Risk Level under the Management Authority of the Ministry of Agriculture and Environment", "products": "Plant Varieties (Rice seeds, Maize seeds), Fertilizers, Animal Feed, Livestock Waste Treatment Products, Veterinary Drugs, Aquatic Feed, Aquaculture Environmental Treatment Products, Wood Adhesives, Agricultural Machinery and Equipment, Plant Protection products", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NVNM182C1.docx", "note": "", "desc": "Viet Nam would like to advise Members of an error in notification G/SPS/N/VNM/182, \"Draft Circular Promulgating the List of Products and Goods with Medium Risk Level and High Risk Level under the Management Authority of the Ministry of Agriculture and Environment\".This corrigendum amends an error in the original notification. The attachments of the notified document was incorrect in Section 5.To clarify, the correct documents are attached below:", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/USA/3570", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-23", "member": "미국", "type": "정규통보", "topic": "농약 잔류허용기준", "ko": "재등록 평가에 따른 농약 잔류허용기준 일괄 조정 최종 규칙(시안화수소 등)", "orig": "Pesticide Tolerances; Implementing Registration Review Decisions for Certain Pesticides (Hydrogen Cyanide, et al.) Final Rule", "products": "Multiple Commodities", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NUSA3570.docx", "note": "", "desc": "The Environmental Protection Agency (EPA or Agency) is finalizing several tolerance actions under the Federal Food, Drug, and Cosmetic Act (FFDCA) that the Agency previously determined were necessary or appropriate during the registration review conducted under the Federal Insecticide, Fungicide, and Rodenticide Act (FIFRA). During registration review, EPA reviews all aspects of a pesticide case, including existing tolerances, to ensure that the pesticide continues to meet the standard for registration under FIFRA.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/BRA/2461/Add.1", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-27", "member": "브라질", "type": "추가통보", "topic": "농약(유효성분)", "ko": "농약 유효성분 모노그래프 21종 개정 채택 — 규범지침 제437호(2026.4.8)", "orig": "Draft Resolution 1360, 5 December 2025", "products": "Environment. Health protection. Safety (ICS code(s): 13)", "hs": "", "deadline": "2026-06-26", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NBRA2461A1.docx", "note": "", "desc": "Draft Resolution 1360, 5 December 2025 - previously notified through G/SPS/N/BRA/2461 - was adopted as Normative Instruction 437, 8 April 2026. The regulation updates 21 monographs on the list of actives ingredients in the Monograph List of Active Ingredients for Pesticides, Household Cleaning Products and Wood Preservatives, published .org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEU942.docx", "note": "", "desc": "The purpose of this Commission Implementing Regulation is to amend Commission Implementing Regulation (EU) 2021/405 in particular: - to list and delist third countries or regions to enter the Union of goods intended for human consumption, if required;- to update Annex – I to reflect the assessment of the residue control plans provided for third countries for different commodities;- to update the structure of Annex IX.", "adopt": "Third quarter 2026", "eif": "This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union."}, {"sym": "G/SPS/N/EU/713/Add.1", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-28", "member": "유럽연합", "type": "추가통보", "topic": "농약 잔류허용기준", "ko": "사이프로코나졸·스피로디클로펜 잔류허용기준 채택", "orig": "Maximum residue levels for cyproconazole and spirodiclofen in or on certain products", "products": "Cereals (HS codes: 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008), foodstuffs of animal origin (HS codes: 0201, 0202, 0203, 0204, 0205, 0206, 0207, 0208, 0209, 0210) and certain products of plant origin, including fruit and vegetables", "hs": "02, 10, 0201, 0202, 0203, 0204, 0205, 0206, 0207, 0208, 0209, 0210, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEU713A1.docx", "note": "", "desc": "The Draft Commission Regulation amending Annexes II and III to Regulation (EC) No 396/2005 of the European Parliament and of the Council as regards maximum residue levels for cyproconazole and spirodiclofen in or on certain products (text with EEA relevance) notified in G/SPS/N/EU/713 on 24 January 2024 was withdrawn.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/EU/762/Add.1", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-28", "member": "유럽연합", "type": "추가통보", "topic": "농약 잔류허용기준", "ko": "이소피라잠 잔류허용기준 채택", "ori more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-28", "member": "영국", "type": "정규통보", "topic": "농약 잔류허용기준", "ko": "사이안트라닐리프롤 잔류허용기준 신설(GB MRL 등록부 개정)", "orig": "New GB MRLs for cyantraniliprole amending the GB MRL Statutory Register", "products": "Lamb’s lettuce (0251010), Escaroles/broad leaved endives (0251030), Cresses and other sprouts and shoots (0251040), Land cresses (0251050), Roman rocket/rucolas (0251060), Red mustard (0251070), Baby leaf crops (including brassica species) (0251080), Spinaches (0252010), Purslanes (0252020), Chards/beet leaves (0252030), Chervil (0256010), Chives (0256020), Celery leaves (0256030), Parsley (025604", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NGBR128.docx", "note": "", "desc": "Cyantraniliprole is an approved active substance in Great Britain (GB). An application was received by the Health and Safety Executive (HSE) requesting new Maximum Residue Levels (MRLs) for various commodities listed in Section 3. Following assessment, new MRLs have been introduced to support an extension of a plant protection product (PPP) authorization for minor use in GB. The new MRLs are all an increase from those previously in force. The Evaluation Report / Reasoned Opinion supporting the new MRLs is available at the following link:The evaluation of new MRLs for cyantraniliprole in or on various leaf vegetables, herbs and edible flowersThe residue levels arising in food from the notified uses result in consumer exposures below the toxicological reference values. As the residue levels exceed the current MRLs in force, new MRLs are being adopted.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/TZA/182/Add.1", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-28", "member": "탄자니아", "type": "추가통보", "topic": "품질규격", "ko": "가향 맥주 탄자니아 표준 추가통보", "orig": "AFDC 13 (1032) DTZS, Flavoured beer — Specification", "products": "Beer made from malt (HS code(s): 2203); Alcoholic beverages (IC on 31 October 2025 as TZS 3916:2025 Half-cake – Specification.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/CAN/1631/Add.1", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-29", "member": "캐나다", "type": "추가통보", "topic": "농약 잔류허용기준", "ko": "1-메틸사이클로프로펜 잔류허용기준 확정", "orig": "Established Maximum Residue Limits: 1-Methylcyclopropene", "products": "Pesticide 1-methylcyclopropene in or on various commodities (ICS codes: 65.020, 65.100, 67.040, 67.080)", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCAN1631A1.docx", "note": "", "desc": "The proposed maximum residue limit (PMRL) document for 1-methylcyclopropene notified in G/SPS/N/CAN/1631 (dated 28 January 2026) was adopted 26 April 2026. The proposed MRLs were established via entry into the Maximum Residue Limits Database and are provided directly below:MRL (ppm)1 Raw Agricultural Commodity (RAC) and/or Processed Commodity0.01 Avocados, bell peppers, broccoli, cantaloupes, cucumbers, peaches1 ppm = parts per millionMRLs established in Canada may be found using Health Canada’s Maximum Residue Limit Databasehttps://pest-control.canada.ca/pesticide-registry/en/mrl-search.html) on the Maximum residue limits, human health, and food safety webpage (https://www.canada.ca/en/health-canada/services/consumer-product-safety/pesticides-pest-management/public/protecting-your-health-environment/pesticides-food/maximum-residue-limits-pesticides.html). The database allows users to search for pesticides or for food commodities.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/EGY/181", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-29", "member": "이집트", "type": "정규통보", "topic": "품질규격", "ko": "식물성 유지 함유 아이스크림 이집트 표준안(ES 1185-3)", "orig": "Draft of the Egyptian Standard ES 1185-3 for \"Milk and Water Ices Part 3: Milk Ices with Vegetable Fat (ice cream with vegetable fat)\"", "products": "Ice cream and ice confectionery (ICS code(s): 67.100.40)", "hs": "210500", "deadline": "2026-06-28", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEGY181.docx", "note": "같은 표준안을 TBT로도 통보(G/TBT/N/EGY/2/Add.40)", "desc": "This standard specifies the basic requirements and descriptive criteria for milk and water ices milk with vegetables fat (ice cream with vegetable fat). Worth mentioning is that this standard has been formulated according to national studies.Producers and importers are kept informed of any amendments in the Egyptian Standards through the publication of administrative orders in the official gazette.", "adopt": "To be determined.", "eif": "To be determined."}, {"sym": "G/SPS/N/EGY/182", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-29", "member": "이집트", "type": "정규통보", "topic": "품질규격", "ko": "탈지 무가당연유·식물성 유지 혼합제품 이집트 표준안", "orig": "Draft of the Egyptian standard for “A blend of evaporated skimmed milk and vegetable fat”", "products": "Milk and processed milk products (ICS code(s): 67.100.10)", "hs": "04", "deadline": "2026-06-28", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEGY182.docx", "note": "같은 표준안을 TBT로도 통보(G/TBT/N/EGY/577)", "desc": "This draft standard applies to a blend of evaporated skimmed milk and vegetable fat, also known as a blend of unsweetened condensed skimmed milk and vegetable fat, which is intended for direct consumption, or further processing, in conformity with the description in Section 2 of this Standard.", "adopt": "To be determined.", "eif": "To be determined."}, {"sym": "G/SPS/N/EGY/183", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-29", "member": "이집트", "type": "정규통보", "topic": "품질규격", "ko": "탈지 가당연유·식물성 유지 혼합제품 이집트 표준안", "orig": "Draft of the Egyptian standard for “A blend of sweetened condensed skimmed milk and vegetable fat\"", "products": "Milk and processed milk products (ICS code(s): 67.100.10)", "hs": "04", "deadline": "2026-06-28", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEGY183.docx", "note": "같은 표준안을 TBT로도 통보(G/TBT/N/EGY/578)", "desc": "This draft standard applies to a blend of sweetened condensed skimmed milk and vegetable fat, intended for direct consumption, or further processing, in conformity with the description in Section 2 of this Standard.", "adopt": "To be determined.", "eif": "To be determined."}, {"sym": "G/SPS/N/THA/223/Rev.1", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-30", "member": "태국", "type": "개정통보", "topic": "위생규범", "ko": "신선 과일 이산화황 훈증 실행규범 태국 농산물표준 개정안", "orig": "Draft Thai Agricultural Standard entitled \"Code of Practice for Sulfur Dioxide Fumigation of Fresh Fruits\"", "products": "Fruits and derived products (ICS code: 67.080.10)", "hs": "08", "deadline": "2026-06-29", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTHA223R1.docx", "note": "", "desc": "This mandatory standard is a revision of the Thai Agricultural Standard (TAS) 1004–2014: Code of Practice for Sulphur Dioxide Fumigation of Fresh Fruits. The standard covers requirements related to establishment, training and competency of personnel, waste management, control of operation, documentation and records. The objectives are to ensure that fresh fruits fumigated with sulfur dioxide are safe for consumption, and are of appropriate product quality, and that the fumigation process does not adversely affect the environment. This Thai Agricultural Standard does not cover the fumigation of fresh fruits with sulfur dioxide other than in fumigation chamber. The revised standard includes amendments to the following key aspects: Revision of the scope of the standard to establish the code of practice for sulfur dioxide fumigation of fresh fruits intended for export; Revision of requirements for establishment, training and competency of personnel, control of operation, documentation and records; Addition of requirements regarding monitoring of the operation; Addition of clearer requirements for receiving and preparation of fresh fruit raw materials;Revision of requirements for documentation and records, requiring records to be maintained at all stages of the production process to support production improvement and enable traceability in case of product issues.", "adopt": "To be determined.", "eif": "A transition period of 180 days from the date of publication of the Ministerial Notification in the Royal Gazette shall be granted."}, {"sym": "G/SPS/N/THA/241/Rev.1", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-04-30", "member": "태국", "type": "개정통보", "topic": "위생규범", "ko": "냉동 두리안 우수제조기준 태국 농산물표준 개정안(의무)", "orig": "Draft Thai Agricultural Standard entitled “Good Manufacturing Practices for Frozen Durian”", "products": "Frozen durian (HS code: 0811.9000.002)", "hs": "081190", "deadline": "2026-06-29", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTHA241R1.docx", "note": "", "desc": "Thismandatory standard is a revision of the Thai Agricultural Standard (TAS) 9046–2017: Good Manufacturing Practices for Frozen Durian.It covers good practice requirements for the production of frozen durian at all stages, starting from raw material receiving, preparing, freezing, handling, storing to transporting in order to obtain products that are safe and suitable for consumption.The revised standard includes amendments to the following key aspects:Revision of the scope of the standard to apply to the production, importation, and exportation of frozen durian;Revision of the definition of “frozen durian”;Addition of requirements regarding management commitment to food safety;Revision of requirements for receiving, inspection, and storage of durian raw materials;Addition of clearer requirements for the preparation of raw materials begore freezing, packing and storage of frozen durian;Revision of transportation requirements; andRevision of requirements for documentation and records, requiring records to be maintained at all stages of the production process to support production improvement and enable traceability in case of product issues.", "adopt": "To be determined.", "eif": "A transition period of 180 days from the date of publication of the Ministerial Notification in the Royal Gazette shall be granted."}, {"sym": "G/TBT/N/RWA/1378", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-04-01", "member": "르완다", "type": "정규통보", "topic": "영양강화", "ko": "영양강화 포장 조리 콩 르완다 표준안(DRS 636)", "orig": "DRS 636: 2026, Fortified pre-packaged cooked beans—Specification", "products": "Prepackaged and prepared foods (ICS code(s): 67.230)", "hs": "", "deadline": "2026-05-31", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/RWA1378.docx", "note": "", "desc": "This Draft Rwanda Standard specifies requirements, sampling and test methods for fortified pre-packaged cooked beans obtained from different varieties of Phaseolus spp. intended for human consumption", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/RWA/1379", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-04-01", "member": "르완다", "type": "정규통보", "topic": "위생관리", "ko": "고구마 집하장 기본요건 르완다 표준안(DRS 637)", "orig": "DRS 637: 2026, Sweetpotato collection centre — Basic requirements", "products": "Storing. Warehousing (ICS code(s): 55.220)", "hs": "", "deadline": "2026-05-31", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/RWA1379.docx", "note": "", "desc": "This Committee Draft standard covers the location, structural, facility, safety and handling requirements for a Sweetpotato collection centre.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/ZAF/271", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-04-01", "member": "남아프리카공화국", "type": "정규통보", "topic": "품질·표시", "ko": "루이보스·그린 루이보스 제품 판매 규정 개정안 — 최소 기준·표시", "orig": "Regulations relating to rooibos and green Rooibos products intended for sale in the Republic of South Africa: Amendment", "products": "Rooibos and Green Rooibos products", "hs": "0602", "deadline": "2026-05-31", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/ZAF271.docx", "note": "", "desc": "The proposed regulations set minimum standards for the Rooibos and Green Rooibos products and prescribe the labelling of such products when presented for sale as well as the control systems to ensure compliance with the standards. Food safety issues are excluded from the proposed regulations.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/USA/1879/Rev.1/Corr.1", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-04-07", "member": "미국", "type": "정정통보", "topic": "품질규격", "ko": "캘리포니아산·수입 키위 취급규정 개정안 통보 정정(문서 주소)", "orig": "Kiwifruit Grown in California and Imported Kiwifruit; Modification of Handling Regulations", "products": "Kiwifruit; Fresh kiwifruit (HS code(s): 081050); Fruits. Vegetables (ICS code(s): 67.080)", "hs": "081050", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN22/USA1879R1C1.docx", "note": "", "desc": "This corrigendum corrects the URL to the docket folder given in the relevant documents section of G/TBT/N/USA/1879/Rev.1This proposed rule is identified by Docket Number AMS-SC-24-0044. The Docket Folder is available from Regulations.gov at https://www.regulations.gov/docket/AMS-SC-24-0044/document and provides access to primary documents as well as comments received. Documents are also accessible from Regulations.gov by searching the Docket Number.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/BRA/1620/Add.1", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-04-08", "member": "브라질", "type": "추가통보", "topic": "도축·가공 위생", "ko": "돼지고기·가공품 산업·위생 검사 규정안 의견수렴 30일 연장", "orig": "SDA/MAPA Ordinance No. 1.582, 31 March 2026", "products": "Meat of swine, fresh, chilled or frozen (HS code(s): 0203); Meat, meat products and other animal produce (ICS code(s): 67.120)", "hs": "0203", "deadline": "2026-05-06", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/BRA1620A1.docx", "note": "", "desc": "Ministry of Agriculture and Livestock extends for another 30 (thirty) days the deadline of Ordinance SDA/MAPA No. 1.559, 19 February 2026, which submits to Public Consultation the proposed ordinance aimed at establishing the regulation of industrial and sanitary inspection of pork and its derivatives.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/BRA/1621/Add.1", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-04-08", "member": "브라질", "type": "추가통보", "topic": "도축·가공 위생", "ko": "가금육·가공품 산업·위생 검사 규정안 의견수렴 15일 연장", "orig": "SDA/MAPA Ordinance No. 1.581, 31 March 2026", "products": "Meat and edible offal of fowls of the species Gallus domesticus, ducks, geese, turkeys and guinea fowls, fresh, chilled or frozen (HS code(s): 0207); Meat, meat products and other animal produce (ICS code(s): 67.120)", "hs": "0207", "deadline": "2026-04-20", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/BRA1621A1.docx", "note": "", "desc": "Ministry of Agriculture and Livestock extends for another 15 (fifteen) days the deadline of Ordinance SDA/MAPA No. 1.560, of February 19, 2026, which submits to Public Consultation the proposed ordinance aimed at establishing the regulation of industrial and sanitary inspection of poultry meat and its derivatives.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/CAN/177/Rev.2/Add.7", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-04-09", "member": "캐나다", "type": "추가통보", "topic": "유기식품", "ko": "캐나다 유기생산 표준(CAN/CGSB 32.310·32.311) 개정판 발간", "orig": "The new editions of CAN/CGSB 32.310: Organic Production Systems - General Principles and Management Standards and CAN/CGSB 32.311: Organic Production Systems - Permitted Substances Lists are now published", "products": "Agricultural products labelled as organic and marketed in inter-provincial and international trade", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN06/CAN177R2A7.docx", "note": "", "desc": "The purpose of this notification is to inform Members that CAN/CGSB 32.310: Organic Production Systems - General Principles and Management Standards and CAN/CGSB 32.311: Organic Production Systems - Permitted Substances Lists (PSL), which are incorporated by reference into the Safe Foods for Canadian Regulations, 2018 (Part 13 - Organic Products) have been amended. New editions of the standards were published on 27 March 2026.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/IDN/186", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-04-09", "member": "인도네시아", "type": "정규통보", "topic": "식품용 기구·포장", "ko": "스테인리스 다칸 식판 국가표준(SNI) 의무적용 산업부 규정(2026년 제1호)", "orig": "Regulation of The Minister of Industry Number 1 of 2026 Concerning the Mandatory Implementation of Indonesian National Standard for Multi-Compartment Stainless Steel Food Tray", "products": "Ex. 7323.93.10 and Ex.7323.93.90 Multi-compartment stainless steel food trayshall be made of stainless steel of grades 304, 304H, 304L, 310S, 316, and 316L, and shall be in the form of: a. rectangular, with and/or without a lid; b. round, with and/or without a lid; c. oval, with and/or without a lid; and d. square, with and/or without a lid.", "hs": "732393", "deadline": "2026-06-08", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/IDN186.docx", "note": "", "desc": "The Ministry of Industry has stipulated the mandatory implementation of SNI for Multi-Compartment Stainless Steel Food Tray. Business actors that produce, import, and/or distribute for Multi-Compartment Stainless Steel Food Tray in Indonesia are required to comply with the provisions of SNI 9369:2025 for Multi-Compartment Stainless Steel Food Tray.The conformity assessment process is conducted through the type 5 and type 1 n certification system implemented through audits of the production process and the application of a quality management system, such as ISO 9001:2015 along with quality conformity testing based on SNI requirements.Conformity assessment is carried out by a Conformity Assessment Body (LSPro) and testing laboratories that is accredited by Komite Akreditasi Nasional (KAN) in accordance with the scope of the applicable SNI for Multi-Compartment Stainless Steel Food Tray, and appointed by the Minister of Industry. SNI certificates may only be held by domestic industrial companies or overseas manufacturers that are registered electronically through the SIINas platform.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/USA/2269", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-04-13", "member": "미국", "type": "정규통보", "topic": "등급", "ko": "미국 냉동 아스파라거스 등급 기준 개정안", "orig": "United States Standards for Grades of Frozen Asparagus", "products": "Frozen asparagus; Fresh or chilled asparagus (HS code(s): 070920); Quality in general (ICS code(s): 03.120.01); Quality management and quality assurance (ICS code(s): 03.120.10); Vegetables and derived products (ICS code(s): 67.080.20); Prepackaged and prepared foods (ICS code(s): 67.230)", "hs": "070920", "deadline": "2026-06-09", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/USA2269.docx", "note": "", "desc": "Notice and request for comments - The Agricultural Marketing Service (AMS) of the Department of Agriculture (USDA) is proposing to revise the United States Standards for Grades of Frozen Asparagus by updating and defining new style requirements related to percent head material for the “cut spears or cuts and tips” style of frozen asparagus. In addition, AMS proposes to change the definition of a head when it applies to the “cut spears or cuts and tips” style. These changes would align the grade standards with modern harvesting practices and provide guidance for the effective utilization of this commodity. Copies of the current United States Standards for Grades of Frozen Asparagus are available at https://www.ams.usda.gov/grades-standards/frozen-asparagus-grades-and-standards", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/USA/2270", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-04-13", "member": "미국", "type": "정규통보", "topic": "등급", "ko": "미국 버섯 등급 기준 개정안", "orig": "Revising U.S. Standards for Grades of Mushrooms", "products": "Mushrooms and truffles: (HS code(s): 07095); Quality in general (ICS code(s): 03.120.01); Quality management and quality assurance (ICS code(s): 03.120.10); Vegetables and derived products (ICS code(s): 67.080.20)", "hs": "07095", "deadline": "2026-06-09", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/USA2270.docx", "note": "", "desc": "Notice and request for comments - The Agricultural Marketing Service (AMS) of the Department of Agriculture (USDA) proposes to revise the U.S. Standards for Grades of Mushrooms. The proposed changes would add a grade for portabella mushrooms, remove size from the criteria for each grade and create a separate section for size, and revise the tolerances for defects, consistent with modern production and handling practices. In addition, AMS proposes to update terminology, definitions, and defect scoring guides. Copies of the current U.S. Standards for Grades of Mushrooms are available at https://www.ams.usda.gov/grades-standards/vegetables", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/ARE/700", "more": 6, "area": "TBT", "group": "식품 TBT", "date": "2026-04-14", "member": "걸프 7개국 공동", "type": "정규통보", "topic": "품질규격", "ko": "건조 상어지느러미 걸프 기술규정안", "orig": "GCC Technical Regulations for Dried shark fins", "products": "Fish and fishery products (ICS code(s): 67.120.30)", "hs": "", "deadline": "2026-06-13", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/ARE700.docx", "note": "공동 통보 번호: G/TBT/N/ARE/700, G/TBT/N/BHR/778, G/TBT/N/KWT/762, G/TBT/N/OMN/601, G/TBT/N/QAT/752, G/TBT/N/SAU/1435, G/TBT/N/YEM/349", "desc": "This Gulf technical regulation is concerned with dried shark fins intended for further processing.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/CAN/177/Rev.2/Add.7/Corr.1", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-04-14", "member": "캐나다", "type": "정정통보", "topic": "유기식품", "ko": "캐나다 유기생산 표준 개정판 발간 통보 정정", "orig": "The new editions of CAN/CGSB 32.310: Organic Production Systems - General Principles and Management Standards and CAN/CGSB 32.311: Organic Production Systems - Permitted Substances Lists are now published : Correction", "products": "Agricultural products labelled as organic and marketed in inter-provincial and international trade", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN06/CAN177R2A7C1.docx", "note": "", "desc": "This corrigendum is to inform the WTO Members that notification G/TBT/N/CAN/177/Rev.2/Add.7 has been corrected. Please note that CAN/CGSB 32.310: Organic Production Systems - General Principles and Management Standards and CAN/CGSB 32.311: Organic Production Systems - Permitted Substances Lists were published on 27 March 2026.Reason for Addendum: [ ] Comment period changed - date: [X] Notified measure adopted - date: 27 March 2026[X] Notified measure published - date: 27 March 2026[X] Notified measure enters into force - date: 27 March 2026CAN/CGSB‑32.310-2026English: https://www.publications.gc.ca/site/eng/9.960491/publication.htmlFrench: https://www.publications.gc.ca/site/fra/9.960492/publication.htmlCAN/CGSB‑32.311-2026:English: https://www.publications.gc.ca/site/eng/9.960350/publication.htmlFrench: https://www.publications.gc.ca/site/fra/9.960351/publication.html", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/USA/2236/Add.1", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-04-14", "member": "미국", "type": "추가통보", "topic": "등급", "ko": "미국 레몬 등급 기준 개정", "orig": "Revising U.S. Standards for Grades of Lemons", "products": "Lemons; Quality (ICS code(s): 03.120); Fruits. Vegetables (ICS code(s): 67.080)", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN25/USA2236A1.docx", "note": "", "desc": "The Agricultural Marketing Service (AMS) of the Department of Agriculture (USDA) is revising the United States (U.S.) Standards for Grades of Lemons (or Standards) by adding the term \"seedless lemons.'' In addition, AMS is incorporating marking requirements for lemons meeting the seedless definition.U.S. Standards for Grades of Lemons are available at https://www.ams.usda.gov/grades-standards/fruitsApplicable 13 May 2026.91 Federal Register (FR) 18810, 13 April 2026; Title 7 Code of Federal Regulations (CFR) Part 51 https://www.govinfo.gov/content/pkg/FR-2026-04-13/html/2026-07060.htm https://www.govinfo.gov/content/pkg/FR-2026-04-13/pdf/2026-07060.pdf This final notice and previous actions notified under the symbol G/TBT/N/USA/2236 are identified by Docket Number AMS-SC-24-0068. The Docket Folder is available from Regulations.gov at https://www.regulations.gov/docket/AMS-SC-24-0068/document and provides access to primary documents as well as comments received. Documents are also accessible from Regulations.gov by searching the Docket Number.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/BRA/1524/Add.1", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-04-15", "member": "브라질", "type": "추가통보", "topic": "식품용 기구·포장", "ko": "식품접촉용 실리콘 재질 위생요건 결의 채택", "orig": "Draft resolution 1236, 26 February 2024", "products": "Food technology (ICS code(s): 67)", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN24/BRA1524A1.docx", "note": "", "desc": "The Draft Resolution number 1236, 26 February 2024 - previously notified through G/TBT/N/BRA/1524 - which contains provisions on sanitary requirements applicable to silicones used in materials, packaging, coatings and equipment intended to come into contact with food, was adopted as Normative Instruction Nº. 435, 02 April 2026. The final text is available only in Portuguese and can be downloaded at: https://anvisalegis.datalegis.net/action/UrlPublicasAction.php?acao=abrirAtoPu

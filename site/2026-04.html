 April 15, 2026", "products": "Apples, fresh (HS 080810400100); apples, fresh, organic (080810400000); apricots, fresh (HS 080910402000); apricots, fresh, organic (HS 080910402002); asparagus, fresh (HS 070920000000); asparagus, fresh, organic (HS 070920000200); grapes, fresh (HS 080610000000); grapes, fresh, organic (HS 080610405000); peaches, fresh (HS 080930000000); pears, fresh (HS 080830400300); pears, fresh, organic (HS 0", "hs": "070920, 080610, 080810, 080830, 080910, 080930, 080940", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN21/CAN657A2.docx", "note": "", "desc": "Certain fresh fruit or vegetables (FFV) must be graded in order to be marketed in import or interprovincial trade in Canada. Grades and requirements for apples are maintained and enforced by the Canadian Food Inspection Agency (CFIA) in an incorporated by reference (IbR) document titled \"Canadian Grade Compendium: Volume 2 – Fresh Fruit or Vegetables\", incorporated into the Safe Food for Canadians Regulations (SFCR).On April 15, 2026, changes to grades and requirements for apples in the Canadian Grade Compendium: Volume 2 – Fresh Fruit or Vegetables were published. As of April 15, 2026, the previous grade requirements for apples will cease to apply, and all regulated parties must comply with the new requirements.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/ALB/101", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-04-24", "member": "알바니아", "type": "정규통보", "topic": "유기식품", "ko": "유기 생산 인증기관 승인·활동 신고 추가 요건 각료회의 결정안", "orig": "Draft –Decision of the Council of Ministers “On additional conditions and procedures for the approval of control bodies and the notification of activities by control bodies operating in Albania under other standards for organic production”", "products": "Agriculture (ICS code(s): 65); Animal produce in general (ICS code(s): 67.120.01)", "hs": "", "deadline": "2026-06-23", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/ALB101.docx", "note": "", "desc": "This Draft-Decision of the Council of Ministers “On additional conditions and procedures for the approval of control bodies and the notification of activities by control bodies operating in Albania under other standards for organic production” aims to establish additional conditions, beyond those set out in point 3 of Article 45 of Law No. 104/2024 “On organic production, labelling of organic products and their control”, as well as the procedures for the approval, renewal, and modification of the scope of approval of control bodies operating under the law, and the procedures for the notification of activities by control bodies carrying out their activity within the territory of the Republic of Albania in accordance with other international standards for organic production.”", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/ARE/701", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-04-24", "member": "아랍에미리트", "type": "정규통보", "topic": "영양(나트륨·열량)", "ko": "외식업소 판매 일부 식품의 나트륨·열량 최대한도 내각결정안(아랍에미리트)", "orig": "Draft Cabinet Decision on Reorganizing Nutritional Composition Limits for Certain Food Products Offered by Food Establishments in the UAE", "products": "Processes in the food industry (ICS code(s): 67.020); Food products in general (ICS code(s): 67.040)", "hs": "", "deadline": "2026-06-23", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/ARE701.docx", "note": "", "desc": "The notified draft Cabinet Decision on Reorganizing Nutritional Composition Limits for Certain Food Products Offered by Food Establishments in the UAE introduces mandatory maximum limits for sodium and calorie content (per 100 grams) for selected categories of food products offered by food establishments operating in the UAE.The measure applies to food establishments with 20 or more branches, including restaurants, cafés, cloud kitchens, and digital food platforms.The regulation:Defines targeted food categories (burgers, pizza, chicken products, potato products, sandwiches) Establishes maximum limits for sodium and calorie content per 100g Requires compliance across all components of the food item (including bread, sauces, and additives) Assigns enforcement responsibilities to national and local health authorities Establishes administrative penalties for non-compliance The measure aims to improve the nutritional profile of widely consumed foods and support national public health objectives.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/ARE/625/Rev.1", "more": 6, "area": "TBT", "group": "식품 TBT", "date": "2026-04-27", "member": "걸프 7개국 공동", "type": "개정통보", "topic": "품질규격", "ko": "그릭요거트 걸프 기술규정 개정안", "orig": "Greek Style Yoghurt", "products": "Food products in general (ICS code(s): 67.040)", "hs": "040320", "deadline": "2026-06-26", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN24/ARE625R1.docx", "note": "공동 통보 번호: G/TBT/N/ARE/625/Rev.1, G/TBT/N/BHR/710/Rev.1, G/TBT/N/KWT/689/Rev.1, G/TBT/N/OMN/534/Rev.1, G/TBT/N/QAT/685/Rev.1, G/TBT/N/SAU/1353/Rev.1, G/TBT/N/YEM/291/Rev.1", "desc": "This draft technical regulation is concernedwith requirements to be met in Greek-Style Yogurt. This draft technical regulation does not apply to sweetened or flavored yogurt.", "adopt": "", "eif": "Six (6) months from the date of publication in the Official Gazette"}, {"sym": "G/TBT/N/ARE/702", "more": 6, "area": "TBT", "group": "식품 TBT", "date": "2026-04-27", "member": "걸프 7개국 공동", "type": "정규통보", "topic": "품질규격", "ko": "가향·가당 그릭요거트 걸프 기술규정안", "orig": "Flavored and Sweetened Greek-Style Yogurt", "products": "Food products in general (ICS code(s): 67.040)", "hs": "040320", "deadline": "2026-06-26", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/ARE702.docx", "note": "공동 통보 번호: G/TBT/N/ARE/702, G/TBT/N/BHR/779, G/TBT/N/KWT/763, G/TBT/N/OMN/602, G/TBT/N/QAT/753, G/TBT/N/SAU/1436, G/TBT/N/YEM/350", "desc": "This draft technical regulation concernedwit //docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEU939.docx", "note": "", "desc": "The substance covered by the Act was authorised as a feed additive for all animal species. An application was submitted for the reauthorisation of this substance in accordance with article 10 of Regulation (EC) No 1831/2003. Based on the favourable conclusions of a scientific assessment of the dossier submitted by the applicant, conducted by the European Food Safety Authority (EFSA), this substance is reauthorised as a feed additive for all animal species other than cats, dogs and aquatic species in the additive category ‘technological additives’ and in the functional groups ‘stabilisers’ and ‘thickeners’, under certain conditions detailed in the Annex to the Act. A transitional period is included for the interested parties to meet the new authorisation’s requirements. As regards the use of the additive for cats, dogs and aquatic species, it remains authorised pursuant to Directive 70/524/EEC pending the adoption of a measure on its reauthorisation in accordance with Regulation (EC) No 1831/2003.", "adopt": "", "eif": "This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union."}, {"sym": "G/SPS/N/PER/1113", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-01", "member": "페루", "type": "긴급통보", "topic": "가금 수입제한(HPAI)", "ko": "아르헨티나산 가금 유래 축산물 수입 90일 중단(긴급)", "orig": "RESOLUCIÓN DIRECTORAL N° D000008-2026-MIDAGRI-SENASA-DSA (Directorial Resolution No. D000008-2026-MIDAGRI-SENASA-DSA)", "products": "Livestock products of avian origin from the Argentine Republic that are able to transmit or serve as a vehicle for the virus responsible for highly pathogenic avian influenza.", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NPER1113.docx", "note": "", "desc": "The notified Directorial Resolution suspends, for a period of 90 (90) calendar days following publication in the Official Journal, El Peruano, the importation of livestock products of avian origin from the Argentine Republic that are able to transmit or serve as a vehicle for the virus responsible for highly pathogenic avian influenza, and introduces other provisions.", "adopt": "", "eif": "26 February 2026"}, {"sym": "G/SPS/N/PER/1114", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-01", "member": "페루", "type": "정규통보", "topic": "가금 수입제한(HPAI)", "ko": "칠레산 가금 유래 축산물 수입 90일 중단", "orig": "RESOLUCION DIRECTORAL N° D000014-2026-MIDAGRI-SENASA-DSA (Directorial Resolution No. D000014-2026-MIDAGRI-SENASA-DSA)", "products": "Livestock products of avian origin from the Republic of Chile that are able to transmit or serve as a vehicle for the virus responsible for highly pathogenic avian influenza.", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NPER1114.docx", "note": "", "desc": "The notified Directorial Resolution suspends, for a period of 90 (90) calendar days following publication in the Official Journal, El Peruano, the importation of livestock products of avian origin from the Republic of Chile that are able to transmit or serve as a vehicle for the virus responsible for highly pathogenic avian influenza, and introduces other provisions.", "adopt": "30 March 2026", "eif": "30 March 2026"}, {"sym": "G/SPS/N/PER/1115", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-01", "member": "페루", "type": "정규통보", "topic": "수입위생요건", "ko": "아르헨티나산 상업용 뒤영벌 벌통 수입위생요건", "orig": "RESOLUCIÓN DIRECTORAL N° D000004-2026-MIDAGRI-SENASA-DSA (Directorial Resolution No. D000004-2026-MIDAGRI-SENASA-DSA)", "products": "Commercial bumblebee (Bombus atratus) hives from the Argentine Republic", "hs": "010641", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NPER1115.docx", "note": "", "desc": "The notified Directorial Resolution approves sanitary requirements for the importation of commercial bumblebee hives from the Argentine Republic.", "adopt": "21 January 2026", "eif": "21 January 2026"}, {"sym": "G/SPS/N/THA/790/Add.1", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-01", "member": "태국", "type": "추가통보(긴급)", "topic": "가금 수입제한(HPAI)", "ko": "폴란드산 가금 수입·경유 중단 명령 개정 — 위험평가로 질병 위험이 없다고 판단되면 허가하는 조항 추가", "orig": "The DLD order on temporary suspension of importation or transit of live poultry and poultry carcasses from Poland to prevent the spread of High Pathogenicity Avian Influenza", "products": "Live poultry and poultry carcasses under Animal Epidemics Act B.E. 2558 (2015)", "hs": "0105, 0207", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTHA790A1.docx", "note": "", "desc": "Thailand proposes an amendment to the Department of Livestock Development (DLD) Order on temporary suspension of importation or transit of live poultry and poultry carcasses from Poland to prevent the spread of High Pathogenicity Avian Influenza by adding paragraph (2) as follow:The WOAH has reported an outbreak of High Pathogenicity Avian Influenza (Subtype H5N1) in the area of Poland. Therefore, it is necessary for Thailand to prevent the entry of High Pathogenicity Avian Influenza (Subtype H5N1) into the country. By the virtue of the Animal Epidemics Act B.E. 2558 (2015), the importation or transit of live poultry and poultry carcasses from Poland has been temporarily suspended. 2. Where live poultry and poultry carcasses from Poland have undergone a risk assessment and have been determined to be free from epidemic diseases or vectors thereof, and where the measures prescribed by the DLD of Thailand have been duly complied with, the Director-General of the DLD will grant permission for the importation or transit of such live poultry or poultry carcasses into or through Thailand.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/THA/801/Add.1", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-01", "member": "태국", "type": "추가통보(긴급)", "topic": "가금 수입제한(HPAI)", "ko": "벨기에산 가금 수입·경유 중단 명령 개정 — 위험평가로 질병 위험이 없다고 판단되면 허가하는 조항 추가", "orig": "The DLD order on temporary suspension of importation or transit of live poultry and poultry carcasses from Belgium to prevent the spread of High Pathogenicity Avian Influenza", "products": "Live poultry and poultry carcasses under Animal Epidemics Act B.E. 2558 (2015)", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTHA801A1.docx", "note": "", "desc": "Thailand proposes an amendment to the Department of Livestock Development (DLD) Order on temporary suspension of importation or transit of live poultry and poultry carcasses from Belgium to prevent the spread of High Pathogenicity Avian Influenza by adding paragraph (2) as follow:The WOAH has reported an outbreak of High Pathogenicity Avian Influenza (Subtype H5N1) in the area of Belgium. Therefore, it is necessary for Thailand to prevent the entry of High Pathogenicity Avian Influenza (Subtype H5N1) into the country. By the virtue of the Animal Epidemics Act B.E. 2558 (2015), the importation or transit of live poultry and poultry carcasses from Belgium has been temporarily suspended. 2. Where live poultry and poultry carcasses from Belgium have undergone a risk assessment and have been determined to be free from epidemic diseases or vectors thereof, and where the measures prescribed by the DLD of Thailand have been duly complied with, the Director-General of the DLD will grant permission for the importation or transit of such live poultry or poultry carcasses into or through Thailand.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/THA/802/Add.1", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-01", "member": "태국", "type": "추가통보(긴급)", "topic": "아프리카돼지열병", "ko": "스페인산 돼지 수입·경유 중단 명령 개정 — 위험평가로 질병 위험이 없다고 판단되면 허가하는 조항 추가", "orig": "The DLD order on temporary suspension of the importation or transit of live domestic pigs and wild pigs and their carcasses from Spain to prevent the spread of African Swine Fever", "products": "Live domestic pigs, wild pigs, and their carcasses under Animal Epidemics Act B.E. 2558 (2015)", "hs": "0103, 020311, 020321", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTHA802A1.docx", "note": "", "desc": "Thailand proposes an amendment to the Department of Livestock Development (DLD) Order on temporary suspension of the importation or transit of live domestic pigs and wild pigs and their carcasses from Spain to prevent the spread of African Swine Fever by adding paragraph (2) as follow:The WOAH has reported an outbreak of African Swine Fever (ASF) in the area of Spain. Therefore, it is necessary for Thailand to prevent the entry of African Swine Fever disease into the country. By the virtue of the Animal Epidemics Act B.E. 2558 (2015), the importation or transit of live domestic pigs, wild pigs, and their carcasses from Spain has been temporarily suspended. 2. Where live domestic pigs and wild pigs and their carcasses from Spain have undergone a risk assessment and have been determined to be free from epidemic diseases or vectors thereof, and where the measures prescribed by the DLD of Thailand have been duly complied with, the Director-General of the DLD will grant permission for the importation or transit of such live domestic pigs and wild pigs and their carcasses into or through Thailand.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/PER/1116", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-02", "member": "페루", "type": "긴급통보", "topic": "가금 수입제한(HPAI)", "ko": "칠레산 가금 유래 축산물 수입 90일 중단(긴급)", "orig": "RESOLUCIÓN DIRECTORAL N° D000014-2026-MIDAGRI-SENASA-DSA (Directorial Resolution No. D000014-2026-MIDAGRI-SENASA-DSA)", "products": "Livestock products of avian origin from the Republic of Chile that are able to transmit or serve as a vehicle for the high pathogenicity avian influenza virus.", "hs": "", "dea ry requirements governing the importation from the Argentine Republic of whole raw hides and skins of equine animals (salted, dried or otherwise preserved, but not tanned, parchment-dressed, or further prepared), whether or not dehaired or split.", "adopt": "18 March 2026", "eif": "18 March 2026"}, {"sym": "G/SPS/N/PER/1119", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-02", "member": "페루", "type": "정규통보", "topic": "수입위생요건", "ko": "캐나다산 산 양·염소 수입위생요건", "orig": "RESOLUCIÓN DIRECTORAL Nº D000012-2026-MIDAGRI-SENASA-DSA (Directorial Resolution No. D000012-2026-MIDAGRI-SENASA-DSA).", "products": "Sheep and goats from Canada.", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NPER1119.docx", "note": "", "desc": "The notified Directorial Resolution approves sanitary requirements for the importation of live sheep and goats from Canada.", "adopt": "20 March 2026", "eif": "20 March 2026"}, {"sym": "G/SPS/N/PER/1120", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-02", "member": "페루", "type": "정규통보", "topic": "수입위생요건", "ko": "소 고기·내장·혈액 조제품·저장품 수입 동물위생요건", "orig": "Resolución Directoral Nº D000013-2026-MIDAGRI-SENASA-DSA (Directorial Resolution No. D000013-2026-MIDAGRI-SENASA-DSA)", "products": "Preparations and preserves of meat (except those from primary processing), offal or blood of bovine animals, including those containing additives (except tinned products), from the Argentine Republic.", "hs": "02", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NPER1120.docx", "note": "", "desc": "The notified Directorial Resolution approves animal health requirements for the importation of preparations and preserves of meat (except those from primary processing), offal or blood of bovine animals, including those containing additives (except tinned products), from the Argentine Republic.", "adopt": "20 March 2026", "eif": "20 March 2026"}, {"sym": "G/SPS/N/SAU/582/Add.1", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-02", "member": "사우디아라비아", "type": "추가통보(긴급)", "topic": "가금 수입제한 해제", "ko": "폴란드 포들라스키에주산 가금육·계란 수입 금지 해제(2026.4.1)", "orig": "Notice of Administration Order of Saudi Food and Drug Authority Ref. No. 17740 dated 22 October 2025 entitled “Temporary ban on importation of poultry meat, eggs and their products originating from Podlaskie in Poland”", "products": "Poultry meat, eggs and their products", "hs": "0207, 0407", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NSAU582A1.docx", "note": "", "desc": "The Saudi Food and Drug Authority (SFDA) issued the Notice of Administration Order of Saudi Food and Drug Authority Ref. No. 17740 dated 22 October 2025 entitled “Temporary ban on importation of poultry meat, eggs and their products originating from Podlaskie in Poland”. The Saudi Food and Drug Authority (SFDA) has subsequently issued the Notice Administrative Order No. 40675 dated 1 April 2026, lifting the temporary ban on the importation of poultry meat, eggs and their products originating from Podlaskie in Poland, based on the WOAH report dated 17 March 2026, indicating that Podlaskie in Poland are free of Newcastle virus.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/SAU/615", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-02", "member": "사우디아라비아", "type": "긴급통보", "topic": "가금 수입제한(HPAI)", "ko": "아르헨티나 부에노스아이레스주산 가금육·계란 수입 일시 금지(긴급)", "orig": "Notice of Administration Order of Saudi Food and Drug Authority Ref. No. 38527 dated 12 March 2026 entitled “Temporary ban on importation of poultry meat, eggs and their products originating from Buenos Aires in Argentina”", "products": "Poultry meat, eggs and their products", "hs": "0207, 0407", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NSAU615.docx", "note": "", "desc": "Following the WOAH report dated 23 February 2026, a Highly pathogenic avian influenza (HPAI) virus outbreak has occurred in Buenos Aires in Argentina. In compliance with the World Organization for Animal Health (WOAH), Terrestrial Animal Health Code Chapter 10.4, it is deemed necessary for the Kingdom of Saudi Arabia to prevent the entry of the HPAI virus into the country. Therefore, the import of poultry meat, eggs and their products from Buenos Aires in Argentina to the Kingdom of Saudi Arabia is temporarily suspended (with the exception of processed poultry meat and egg products exposed to either heat or other treatments that ensure deactivation of the HPAI virus, as long as it conforms with the approved health requirements, and standards, with a health certificate issued by the official bodies in Argentina prove that the product is free from the virus).", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/SAU/616", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-02", "member": "사우디아라비아", "type": "긴급통보", "topic": "가금 수입제한(HPAI)", "ko": "아르헨티나 코르도바주산 가금육·계란 수입 일시 금지(긴급)", "orig": "Notice of Administration Order of Saudi Food and Drug Authority Ref. No. 40691 dated 1 April 2026 entitled “Temporary ban on importation of poultry meat, eggs and their products originating from Cordoba in Argentina”", "products": "Poultry meat, eggs and their products", "hs": "0207, 0407", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NSAU616.docx", "note": "", "desc": "Following the WOAH report dated 25 March 2026, a Highly pathogenic avian influenza (HPAI) virus outbreak has occurred in Cordoba in Argentina. In compliance with the World Organization for Animal Health (WOAH), Terrestrial Animal Health Code Chapter 10.4, it is deemed necessary for the Kingdom of Saudi Arabia to prevent the entry of the HPAI virus into the country. Therefore, the import of poultry meat, eggs and their products from Cordoba in Argentina to the Kingdom of Saudi Arabia is temporarily suspended (with the exception of processed poultry meat and egg products exposed to either heat or other treatments that ensure deactivation of the HPAI virus, as long as it conforms with the approved health requirements, and standards, with a health certificate issued by the official bodies in Argentina prove that the product is free from the virus).", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/AUS/630/Add.1", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-07", "member": "호주", "type": "추가통보", "topic": "수출증명", "ko": "호주 수출 식용 식육·식육제품 위생·할랄 증명서 양식 행정 개정(수출서류 시스템 교체)", "orig": "Administrative updates to Australian Government edible meat and meat product sanitary and halal certificate templates used for exports from Australia", "products": "Edible meat and meat products derived from cattle, buffalo, camels, goats, deer, sheep, pigs, horses and donkeys; wild game; rabbit; poultry and ratite (emu, ostrich).", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NAUS630A1.docx", "note": "", "desc": "Australia is replacing its current export documentation system, known as the Export Documentation System (EXDOC), with a new version called the Next Export Documentation System (NEXDOC). The change of system from EXDOC to NEXDOC will result in changes to official Australian Government export certificate templates for Australian agricultural goods.Australia’s export certification for edible meat and meat products such as meat, offal and meat products derived from cattle, buffalo, camels, goats, deer, sheep, pigs, horses and donkeys; wild game; rabbit; poultry and ratite (emu, ostrich) will soon transition to the NEXDOC system. This includes, where relevant, halal certification issued for halal meat and meat products.Australia has already transitioned a range of commodity specific export certification to the NEXDOC system including inedible animal products (October 2025), low-risk food items (May 2025), wool, skins and hides (November 2024), fish (September 2024), eggs (December 2023), honey (2022-2023), and dairy (May 2021).The planned changes do not affect bilaterally agreed information, conditions or attestations required by importing countries or the department’s regulatory controls over exports. However, there are minor changes to formatting and the location of some of this information on the export certificate template. Electronic certification (eCert) is not affected by the planned changes.The NEXDOC export certificate templates have unique Quick Response (QR) codes that provide consignment specific information border officials can use to confirm authenticity of the certificate in real-time. To verify the QR code, border officials scan the code through the official’s smart phone camera.Australia proposes NEXDOC export certificate and, where relevant, halal certificate templates will be issued for edible meat and meat products from 15 June 2026. The change in proposed date of adoption is to allow additional time for implementation.There will be a transition period where both the EXDOC and NEXDOC certificate templates will be in use to allow for transit time (air and sea freight) to the port of destination.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/KOR/842", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-07", "member": "한국", "type": "정규통보", "topic": "수입위생요건", "ko": "짚·건초류 수입위생조건 일부개정안", "orig": "Partial amendment notice(Draft) of Import Health Requirements for straws and forages", "products": "Straws and Forages for feeding (straw and forage for feeding refer to grass, silage crop, hay, root vegetable for feeding, wild grass, straws and forage and they shall be as they are naturally or dried or cut or finely cut)", "hs": "1213, 1214, 2309", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NKOR842.docx", "note": "우리나라 통보", "desc": "Amendment of import health requirement that stipulates quarantine details for the import of straws and forages - Addition of a requirement under the import conditions for forage that it be stored in a storage facility in the exporting country for at least four months prior to export, in isolation without contact with other forage, so as to prevent contamination by pathogens of contagious animal diseases.", "adopt": "To be determined.", "eif": "To be determined."}, {"sym": "G/SPS/N/SAU/583/Add.1", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-07", "member": "사우디아라비아", "type": "추가통보(긴급)", "topic": "가금 수입제한 해제", "ko": "프랑스 루아르아틀랑티크주산 가금육·계란 수입 금지 해제(2026.4.5)", "orig": "Notice of Administration Order of Saudi Food and Drug Authority Ref. No. 17741 dated 20 October 2025 entitled “Temporary ban on importation of poultry meat, eggs and their products originating from Loire-Atlantique in France”", "products": "Poultry meat, eggs and their products", "hs": "0207, 0407", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NSAU583A1.docx", "note": "", "desc": "The Saudi Food and Drug Authority (SFDA) issued the Notice of Administration Order of Saudi Food and Drug Authority Ref. No. 17741 dated 20 October 2025 entitled “Temporary ban on importation of poultry meat, eggs and their products originating from Loire-Atlantique in France”. The Saudi Food and Drug Authority (SFDA) has subsequently issued the Notice Administrative Order No. 40965 dated 5 April 2026, lifting the temporary ban on the importation of poultry meat, eggs and their products originating from Loire-Atlantique in France, based on the WOAH report dated 27 March 2026, indicating that Loire-Atlantique in France is free of Highly Pathogenic Avian Influenza Virus (HPAI).", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/SAU/600/Add.1", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-07", "member": "사우디아라비아", "type": "추가통보(긴급)", "topic": "가금 수입제한 해제", "ko": "프랑스 방데주산 가금육·계란 수입 금지 해제(2026.4.5)", "orig": "Notice of Administration Order of Saudi Food and Drug Authority Ref. No. 20499 dated 5 November 2025 entitled \"Temporary ban o 0, 051199, 2309, 430180, 430190, 430390, 843680, 970529", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NRUS357.docx", "note": "", "desc": "This letter introduces temporary restrictions on the imports of certain animals susceptible to foot-and-mouth disease and products derived thereof, as well as on the transit of animals susceptible to foot-and-mouth disease from Côte d'Ivoire to the territory of the Russian Federation due to the deterioration of foot-and-mouth disease epizootic situation in the country indicated.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/RUS/358", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-08", "member": "러시아", "type": "긴급통보", "topic": "구제역", "ko": "차드산 구제역 감수성 동물·제품 수입·경유 일시 제한(긴급)", "orig": "Letter of the Federal Service for Veterinary and Phytosanitary Surveillance as of 3 April 2026 No. FS-ARe-7/7120-3", "products": "Animals susceptible to foot-and-mouth disease and products derived thereof, including products in packaging transported in hand luggage and luggage for personal use (HS code(s): 0102; 0103; 010613; 0201; 0202; 0203; 0204; 0205; 0206; 0209; 0210; 04; 051110; 051199; 2309; 430180; 430190; 430390; 843680; 970529)", "hs": "0102, 0103, 010613, 0201, 0202, 0203, 0204, 0205, 0206, 0209, 0210, 04, 051110, 051199, 2309, 430180, 430190, 430390, 843680, 970529", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NRUS358.docx", "note": "", "desc": "This letter introduces temporary restrictions on the imports of certain animals susceptible to foot-and-mouth disease and products derived thereof, as well as on the transit of animals susceptible to foot-and-mouth disease from Chad to the territory of the Russian Federation due to the deterioration of foot-and-mouth disease epizootic situation in the country indicated.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/THA/768/Add.1", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-08", "member": "태국", "type": "추가통보(긴급)", "topic": "가금 수입제한(HPAI)", "ko": "인도산 가금 수입·경유 중단 명령 개정 — 위험평가로 질병 위험이 없다고 판단되면 허가하는 조항 추가", "orig": "The DLD order on temporary suspension of importation or transit of live poultry and poultry carcasses from India to prevent the spread of High Pathogenicity Avian Influenza.", "products": "Live poultry and poultry carcasses under Animal Epidemics Act B.E. 2558 (2015)", "hs": "0105, 0207", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTHA768A1.docx", "note": "", "desc": "Thailand proposes an amendment to the Department of Livestock Development (DLD) Order on temporary suspension of importation or transit of live poultry and poultry carcasses from India to prevent the spread of High Pathogenicity Avian Influenza by adding paragraph (2) as follow:The WOAH has reported an outbreak of High Pathogenicity Avian Influenza (Subtype H5N1) in the area of India. Therefore, it is necessary for Thailand to prevent the entry of High Pathogenicity Avian Influenza (Subtype H5N1) into the country. By the virtue of the Animal Epidemics Act B.E. 2558 (2015), the importation or transit of live poultry and poultry carcasses from India has been temporarily suspended. 2. Where live poultry and poultry carcasses from India have undergone a risk assessment and have been determined to be free from epidemic diseases or vectors thereof, and where the measures prescribed by the DLD of Thailand have been duly complied with, the Director-General of the DLD will grant permission for the importation or transit of such live poultry or poultry carcasses into or through Thailand.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/THA/771/Add.1", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-08", "member": "태국", "type": "추가통보(긴급)", "topic": "가금 수입제한(HPAI)", "ko": "필리핀산 가금 수입·경유 중단 명령 개정 — 위험평가로 질병 위험이 없다고 판단되면 허가하는 조항 추가", "orig": "The DLD order on temporary suspension of importation or transit of live poultry and poultry carcasses from the Philippines to prevent the spread of High Pathogenicity Avian Influenza.", "products": "Live poultry and poultry carcasses under Animal Epidemics Act B.E. 2558 (2015)", "hs": "0105, 0207", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTHA771A1.docx", "note": "", "desc": "Thailand proposes an amendment to the Department of Livestock Development (DLD) Order on temporary suspension of importation or transit of live poultry and poultry carcasses from the Philippines to prevent the spread of High Pathogenicity Avian Influenza by adding paragraph (2) as follow:The WOAH has reported an outbreak of High Pathogenicity Avian Influenza (Subtype H5N1) in the area of the Philippines. Therefore, it is necessary for Thailand to prevent the entry of High Pathogenicity Avian Influenza (Subtype H5N1) into the country. By the virtue of the Animal Epidemics Act B.E. 2558 (2015), the importation or transit of live poultry and poultry carcasses from the Philippines has been temporarily suspended. Where live poultry and poultry carcasses from the Philippines have undergone a risk assessment and have been determined to be free from epidemic diseases or vectors thereof, and where the measures prescribed by the DLD of Thailand have been duly complied with, the Director-General of the DLD will grant permission for the importation or transit of such live poultry or poultry carcasses into or through Thailand.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/THA/778/Add.7", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-08", "member": "태국", "type": "추가통보(긴급)", "topic": "가금 수입제한(HPAI)", "ko": "영국 일부 지역산 가금 수입·경유 중단 — 위험평가 후 허가 조항 포함", "orig": "The DLD order on temporary suspension of importation or transit of live poultry and poultry carcasses from The United Kingdom to prevent the spread of High Pathogenicity Avian Influenza.", "products": "Live poultry and poultry carcasses under Animal Epidemics Act B.E. 2558 (2015)", "hs": "0105, 0207", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTHA778A7.docx", "note": "", "desc": "The WOAH has reported an outbreak of Highly Pathogenic Avian Influenza in the area of the United Kingdom. Therefore, it is necessary for Thailand to prevent the entry of Highly Pathogenic Avian Influenza into the country. By the virtue of the Animal Epidemics Act B.E. 2558 (2015), the importation or transit of live poultry and poultry carcasses from certain areas of the United Kingdom has been temporarily suspended. Where live poultry and poultry carcasses from certain areas of The United Kingdom have undergone a risk assessment and have been determined to be free from epidemic diseases or vectors thereof, and where the measures prescribed by the DLD of Thailand have been duly complied with, the Director-General of the DLD will grant permission for the importation or transit of such live poultry or poultry carcasses into or through Thailand.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/KOR/844", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-09", "member": "한국", "type": "정규통보", "topic": "수입위생요건", "ko": "가공동물성단백질 사료 수입위생조건 일부개정안", "orig": "Partial amendment notice (Draft) of Import Health Requirements for processed animal protein feed", "products": "processed animal protein feed derived from poultry (poultry by product meal, feather meal etc.,)", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NKOR844.docx", "note": "우리나라 통보", "desc": "Partial amendment of import health requirement that stipulate quarantine details for the import of processed animal protein feed - Limited to poultry-derived products, allowing importation in accordance with prescribed procedures where such products have been rendered using methods approved by the government of the exporting country", "adopt": "To be determined.", "eif": "To be determined."}, {"sym": "G/SPS/N/SGP/90", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-10", "member": "싱가포르", "type": "정규통보", "topic": "수입위생요건", "ko": "가금 외 조류 수입 시 수출 전 검사기간 개정", "orig": "Revised Pre-Export Inspection Period under the Veterinary Conditions for the Importation of Animals – Birds (Other than Domestic Birds)", "products": "HS Codes: 01063100, 01063200, 01063900", "hs": "010631, 010632, 010639", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NSGP90.docx", "note": "", "desc": "The National Parks Board is proposing to revise the Veterinary Conditions for the Importation of Animals – Birds (Other than Domestic Birds) to amend the requirements to the veterinary inspection period by the official government veterinarian or government approved veterinarian (see Note) before export for birds from same day inspection to not more than seven (7) days prior to export and found to be free from any clinical signs of infectious or contagious diseases. Note: \"government-approved veterinarian” refers to a veterinarian who is licensed/registered to practice in the state or country. Each consignment of birds shall continue to be accompanied by a veterinary certificate dated within seven (7) days of import signed by a government veterinary authority or government approved veterinarian of the country of export and endorsed by the government veterinary authority, giving details of the consignment (consignor, consignee, quantity and species or breed of birds) and certifying to the effect of conditions listed under Section IV “Veterinary Certification”.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/SGP/91", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-10", "member": "싱가포르", "type": "정규통보", "topic": "수입위생요건", "ko": "가금 외 조류 수입 수의조건 개정", "orig": "Revised Veterinary Conditions for the Importation of Animals – Birds (Other than Domestic Birds)", "products": "HS Codes: 01063100, 01063200, 01063900", "hs": "010631, 010632, 010639", "deadline": "2026-06-09", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NSGP91.docx", "note": "", "desc": "The National Parks Board is proposing to revise the Veterinary Conditions for the Importation of Animals – Birds (Other than Domestic Birds) to include the requirement that the import of certain species of ornamental birds must be microchipped/tagged with closed leg rings (with unique serial numbers). The list of certain species of ornamental birds is appended: S/NOrnamental Bird SpeciesCommon NameScientific Name1China Thrush (Hwamei) (CITES)Garrulax canorus2Oriental Magpie-robinCopsychus solaris3Red-whiskered BulbulPycnonotus jocosus4Straw-headed Bulbul (CITES)Pycnonotus zeylanicus5Spotted DoveSpilopelia chinensis6White-eye (Swinhoe’s / Japanese white-eye)Zosterops simplex / Zosterops japonicus7White-rumped Shama (CITES)Copsychus malabaricus8Zebra DoveGeopelia striata9Munias of the genus Lonchura and SpermestesLonchura and Spermestes spp.", "adopt": "Anticipated mid-June 2026.", "eif": ""}, {"sym": "G/SPS/N/THA/419/Rev.1", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-10", "member": "태국", "type": "개정통보", "topic": "축산", "ko": "양돈농장 우수농업관행 태국 농산물표준 개정안", "orig": "Draft Thai Agricultural Standard entitled “Good Agricultural Practices for Pig Farms”", "products": "Pigs (Sus Scrofa) (ICS Code:65.020)", "hs": "0103", "deadline": "2026-06-09", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTHA419R1.docx", "note": "", "desc": "This standard is a revision of the Thai Agricultural Standard (TAS) 6403–2022: Good Agricultural Practices for Pig Farms.It establishes the requirements for good agricultural practices in pig farming, covering farm components, farm management, personnel, animal health, animal welfare, environmental management, and record-keeping. These requirements aim to ensure that pigs produced by farms are suitable for further rearing or for consumption as food, while giving due consideration to food safety, animal health, animal welfare, and environment.This standard applies to farms raising pigs (scientific name: Sus scrofa), including both domesticated and wild subspecies.", "adopt": "To be determined.", "eif": "This standard shall be mandatory for pig farms raising more than 500 fattening pigs or more than 95 sows. A transition period of 90 days from the date of publication of the Ministerial Notification in the Royal Gazette shall be granted."}, {"sym": "G/SPS/N/COL/419", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-13", "member": "콜롬비아", "type": "정규통보", "topic": "사료", "ko": "한국산 고양이용 보충사료(참치·연어·프로바이오틱스) 수입위생요건 결의안", "orig": "Proyecto de Resolución \"Por medio de la cual se establecen los requisitos sanitarios para la importación a Colombia de suplemento alimenticio para gatos de todas las razas, elaborado a base de atún, salmón y prebióticos, originario de Corea del Sur y procedente de Ecuador, para consumo animal\" (Draft Resolution \"Establishing the phytosanitary requirements for the importation of Colombia of dietary supplement for cats of all breeds, made from tuna, salmon and probiotics, for animal consumption, originating in South Korea and coming from Ecuador\")", "products": "Dietary supplement for cats of all breeds, made from tuna, salmon and probiotics (HS code(s): 2309)", "hs": "2309", "deadline": "2026-06-12", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCOL419.docx", "note": "한국산 제품 관련", "desc": "The notified draft Resolution establishes the sanitary requirements for the importation into Colombia of dietary supplement for cats of all breeds, made from tuna, salmon and probiotics, for animal consumption, originating in South Korea and coming from Ecuador. The provisions will apply to all natural or legal persons that import this product into Colombia.", "adopt": "Enters into force upon publication in the Official Journal", "eif": "Enters into force upon publication in the Official Journal"}, {"sym": "G/SPS/N/JPN/1404", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-13", "member": "일본", "type": "긴급통보", "topic": "가금 수입제한(HPAI)", "ko": "브라질·헝가리·리투아니아·영국·미국 일부 지역산 가금·가금육·계란 수입 중단(긴급)", "orig": "Import suspension of live poultry, poultry meat or egg products from part of Brazil; live poultry, poultry meat and egg products from part of Hungary; poultry meat and egg products from part of Lithuania; live poultry, poultry meat and egg products from part of the United Kingdom; live poultry, poultry meat and egg products from part of the United States of America", "products": "Live poultry, poultry meat or egg products", "hs": "0105, 0207, 0407", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NJPN1404.docx", "note": "", "desc": "In order to prevent the introduction of High Pathogenicity Avian Influenza (HPAI) virus into Japan, MAFF has taken import suspension measures based on Articles 37 and 44 of the \"Act on Domestic Animal Infectious Disease Control\" and other relevant requirements.", "adopt": "", "eif": "See No. 11 in the attachment for more information."}, {"sym": "G/SPS/N/PER/1121", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-13", "member": "페루", "type": "정규통보", "topic": "수입위생요건", "ko": "브라질산 승마대회 참가 말 일시 반입 위생요건", "orig": "RESOLUCIÓN DIRECTORAL N° D000015-2026-MIDAGRI-SENASA-DSA (Directorial Resolution No. D000015-2026-MIDAGRI-SENASA-DSA)", "products": "Equines participating in equestrian events or competitions, coming from the Federative Republic of Brazil", "hs": "0101", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NPER1121.docx", "note": "", "desc": "The notified Directorial Resolution approves sanitary requirements for the temporary entry of equines participating in equestrian events or competitions, coming from the Federative Republic of Brazil.", "adopt": "10 April 2026", "eif": "10 April 2026"}, {"sym": "G/SPS/N/PER/1122", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-14", "member": "페루", "type": "정규통보", "topic": "수입위생요건", "ko": "2026 라틴아메리카 그랑프리 참가 말 일시 반입 위생요건", "orig": "RESOLUCIÓN DIRECTORAL N° D000016-2026-MIDAGRI-SENASA-DSA (Directorial Resolution No. D000016-2026-MIDAGRI-SENASA-DSA)", "products": "Horses that will participate in the Gran Premio Latinoamericano Perú 2026, coming from the Eastern Republic of Uruguay, the Republic of Chile and the Argentine Republic.", "hs": "0101", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NPER1122.docx", "note": "", "desc": "The notified Directorial Resolution approves sanitary requirements governing the temporary entry of horses that will participate in the Gran Premio Latinoamericano Perú 2026, coming from the Eastern Republic of Uruguay, the Republic of Chile and the Argentine Republic.", "adopt": "11 April 2026", "eif": "11 April 2026"}, {"sym": "G/SPS/N/URY/107", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-15", "member": "우루과이", "type": "긴급통보", "topic": "가금 수입제한(HPAI)", "ko": "칠레 전역산 조류·가금육·계란 등 수입 일시 중단(긴급)", "orig": "Resolución de la Dirección General de Servicios Ganaderos del Ministerio de Ganadería, Agricultura y Pesca N° 090/2026, del 13 de abril de 2026 - Medidas sanitarias aplicadas a la República de Chile en todo su territorio, por brote de influenza aviar de alta patogenicidad (Resolution of the Directorate-General of Livestock Services of the Ministry of Livestock, Agriculture and Fisheries No. 090/2026 of 13 April 2026 - Sanitary measures applied to the entire territory of the Republic of Chile, following an outbreak of highly pathogenic avian influenza)", "products": "Live birds, including day-old chicks; hatching eggs; eggs for human consumption; semen; fresh poultry meat; meat products of avian origin; egg products; and non-treated feathers and down.", "hs": "01063, 0207, 0407, 0408, 0505, 0511", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NURY107.docx", "note": "", "desc": "The notified Resolution establishes the temporary suspension of imports from Chile of live birds, including day-old chicks, hatching eggs, eggs for human consumption, semen, fresh poultry meat, meat products of avian origin, egg products and non-treated feathers and down. Moreover, the measure provides as follows:• The suspension will remain in force until such time that an updated sanitary risk assessment has been carried out by the Directorate-General of Livestock Services, in accordance with established international protocols.• This prohibition does not apply to safe commodities, or to meat products of avian origin and egg products that have undergone heat treatment ensuring the inactivation of the virus, as provided for in Chapter 10.4, \"Infection with high pathogenicity avian influenza viruses\", of the WOAH Terrestrial Animal Health Code.• The entry of fresh meat will be authorized only when products have a production date before 24 February 2026 and have been kept separate from other batches that do not have the same sanitary status.G/SPS/N/URY/107- 2 - • Imports of poultry genetics from compartments authorized by the Agriculture and Livestock Service (SAG) will be permitted, provided that the additional measures required by the DGSG are met, in order to mitigate the risk of introducing the virus into Uruguayan territory.Further details can be found in the document attached to this notification.", "adopt": "", "eif": "13 April 2026"}, {"sym": "G/SPS/N/USA/3568", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-16", "member": "미국", "type": "정규통보", "topic": "검역증명", "ko": "말 수입 표준 위생증명서 신규 시행(USDA)", "orig": "Stakeholder Alert: USDA Implements New Equine Import Model Health Certificate", "products": "Live equines and equine germplasm", "hs": "0101", "deadline": "2026-06-14", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NUSA3568.docx", "note": "", "desc": "From 13 April through 14 June 2026, the US Department of Agriculture (USDA) will be transitioning to a new, comprehensive equine import model health certificate. The new certificate incorporates all information, data, and health attestations required for importing eligible equines into the United States and streamlines and reduces existing import documentation requirements.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/COL/402/Add.1", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-17", "member": "콜롬비아", "type": "추가통보", "topic": "사료", "ko": "연어과 어류용 배합사료 수입위생요건 결의 공포", "orig": "Resolución No. 00004797 del 20 de marzo de 2026 del Instituto Colombiano Agropecuario - ICA \"Por medio de la cual se establecen los requisitos sanitarios para la importación a Colombia de alimento balanceado para salmónidos, de origen y procedencia España, para consumo animal\" (Colombian Agricultural Institute (ICA) Resolution No. 00004797 of 20 March 2026 \"establishing sanitary requirements for the importation into Colombia of balanced animal feed for salmonidae, originating in and coming from Spain\")The Republic of Colombia hereby notifies the issuance of Colombian Agricultural Institute (IC", "products": "Balanced animal feed for salmonidae, originating in and coming from Spain", "hs": "230990", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCOL402A1.docx", "note": "", "desc": "Resolución No. 00004797 del 20 de marzo de 2026 del Instituto Colombiano Agropecuario - ICA \"Por medio de la cual se establecen los requisitos sanitarios para la importación a Colombia de alimento balanceado para salmónidos, de origen y procedencia España, para consumo animal\" (Colombian Agricultural Institute (ICA) Resolution No. 00004797 of 20 March 2026 \"establishing sanitary requirements for the importation into Colombia of balanced animal feed for salmonidae, originating in and coming from Spain\")The Republic of Colombia hereby notifies the issuance of Colombian Agricultural Institute (ICA) Resolution No. 00004797 of 20 March 2026 \"establishing sanitary requirements for the importation into Colombia of balanced animal feed for salmonidae, originating in and coming from Spain\". The Resolution establishes sanitary requirements for the importation into Colombia of balanced animal feed for salmonidae, originating in and coming from Spain, and applies to all natural or legal persons importing these products into the country.The Resolution was published in Official Journal No. 53.460 of 15 April 2026 and entered into force the same day.https://www.ica.gov.co/getattachment/81800394-8cb1-41ee-9e17-28f4069aeacf/2026R00004797.aspxhttps://members.wto.org/crnattachments/2026/SPS/COL/26_02119_00_s.pdf", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/JPN/1405", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-21", "member": "일본", "type": "정규통보", "topic": "사료첨가물", "ko": "사료첨가물 아세틸시스테인 지정·규격 설정 성령 개정안", "orig": "Proposed revision of Ministerial Ordinance on the Specifications and Standards of Feeds and Feed Additives.", "products": "Acetylcysteine as a feed additive.", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NJPN1405.docx", "note": "", "desc": "MAFF will designate Acetylcysteine as a feed additive and set the standards and specifications for feed and feed additives to \"Ministerial Ordinance on the Specifications and Standards of Feeds and Feed Additives\" (Ordinance No. 35 of 24 July 1976 of the Ministry of Agriculture and Forestry).With this amendment, under the “Ministerial Ordinance on the Specifications and Standards of Feeds and Feed Additives”, Acetylcysteine that meets the specifications and standards as a feed additive will become eligible for import into Japan.", "adopt": "May 2026", "eif": "May 2026"}, {"sym": "G/SPS/N/IND/333/Add.2", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-22", "member": "인도", "type": "추가통보", "topic": "검역증명", "ko": "소 혈청 수입 수의위생증명서 추가통보", "orig": "Veterinary Health Certificate for Import of Bovine Serum Into India", "products": "Bovine serum and products thereof", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NIND333A2.docx", "note": "", "desc": "The draft veterinary health certificate for regulating the import of Bovine serum into India was notified to WTO as document G/SPS/N/IND/333 dated 4 September 2025. Subsequently, the final veterinary health certificate was notified to WTO as document G/SPS/N/IND/333/Add.1 dated 27 February 2026. Considering the comments of stakeholders and in order to facilitate the trade the content or scope of notified measures, \"Veterinary Health Certificate for Import of Bovine Serum into India\" has been further reviewed. The revised measure adopted and published on 2 April 2026. The notified measure enters into force after transaction/migration period of six months from the date of circulation of the G/SPS/N/IND/333/Add.2 notification. Text of final measure available from:https://www.dahd.gov.in/sites/default/files/2026-04/OMDated2April2026VHCForImportOfBovineSerumIntoIndia.pdf", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/URY/108", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-22", "member": "우루과이", "type": "긴급통보", "topic": "스크래피", "ko": "아르헨티나산 양·염소, 유전물질, 사료, 양·염소 유제품 수입 일시 중단(긴급)", "orig": "Resolución de la Dirección General de Servicios Ganaderos del Ministerio de Ganadería, Agricultura y Pesca N° 093/2026, del 15 de abril de 2026 - Medidas sanitarias aplicadas a la República Argentina en todo su territorio, por brote Prurigo Lumbar (Scrapie) en granjas de ovinos de Argentina (Resolution of the Directorate-General of Livestock Services of the Ministry of Livestock, Agriculture and Fisheries No. 093/2026 of 15 April 2026 - Sanitary measures applied to the entire territory of the Argentine Republic, following an outbreak of scrapie in sheep farms in Argentina)", "products": "Live sheep and goats; genetic material (semen and in vitro embryos); animal feed derived from these species; and milk and dairy products obtained from sheep and goats or which contain by-products thereof.", "hs": "0104, 051199, 2309, 2301, 0401, 0402, 0403, 0404, 0405, 0406", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NURY108.docx", "note": "", "desc": "The notified Resolution temporarily suspends imports from Argentina of live sheep and goats; genetic material (semen and in vitro embryos); animal feed derived from these species; and milk and dairy products obtained from sheep and goats or which contain by-products thereof.The measure will remain in force until a new risk assessment has been carried out by the Directorate-General of Livestock Services, in accordance with established international recommendations.The prohibition does not apply to safe commodities, as provided for in Article 14.8.1, \"Scrapie\", of the WOAH Terrestrial Animal Health Code.", "adopt": "", "eif": "15 April 2026"}, {"sym": "G/SPS/N/EU/941", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-23", "member": "유럽연합", "type": "정규통보", "topic": "사료첨가물", "ko": "사료첨가물 라벤더 팅크 허가안", "orig": "Draft Commission Implementing Regulation concerning the authorisation of lavender tincture from Lavandula angustifolia Mill. as a feed additive for all animal species and the withdrawal of lavender tincture from Lavandula angustifoliaL. latifolia as a feed additive for all animal species. (Text with EEA relevance)", "products": "Preparations of a kind used in animal feeding (HS code(s): 2309)", "hs": "2309", "deadline": "2026-06-22", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEU941.docx", "note": "", "desc": "The draft act concerns the authorisation as “flavouring compound” of a tincture from the plant Lavandula angustifolia Mill. within the scope of the EU legislation on feed additives, i.e. Regulation (EC) No. 1831/2003. The measure aims at authorising this additive for all animal species. In addition, the draft act concerns the withdrawal from the EU market of a tincture from the plant Lavandula angustifoliaL. latifolia for all animal species, due to the withdrawal by the applicant of a submitted application for re-authorisation. This measure is required by the regime set out in Article 10 of Regulation (EC) No 1831/2003 with regard to the status of 'existing products', i.e. additives which were allowed under the previous Directive 70/524/EEC. Transitional periods are laid down for the interested parties to prepare themselves to meet the requirement concerning the new authorisation and withdrawal from the market of the products concerned.", "adopt": "September 2026", "eif": "This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union."}, {"sym": "G/SPS/N/COL/420", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-24", "member": "콜롬비아", "type": "긴급통보", "topic": "가금 수입제한(HPAI)", "ko": "칠레산 조류·가금 관련 제품 수입위생서류 발급 일시 중단(긴급)", "orig": "Resolución No.00007227 del 22 de abril 2026 \"Por la cual se suspende temporalmente la emisión de Documentos Zoosanitarios de Importación (DZI) para aves vivas, material genético, productos y subproductos de riesgo susceptibles de transmitir la Influenza Aviar de Alta Patogenicidad (IAAP), procedentes de la República de Chile y se dictan otras disposiciones\" (Resolution No. 00007227, of 22 April 2026, temporarily suspending the issuance of animal health import documents for live birds, genetic material, products and by-products at risk of transmitting high pathogenicity avian influenza, coming ", "products": "Live birds, genetic material, products and by-products at risk of transmitting high pathogenicity avian influenza (HPAI)", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCOL420.docx", "note": "", "desc": "The notified Resolution temporarily suspends the issuance of animal health import documents for live birds, genetic material, products and by-products at risk of transmitting high pathogenicity avian influenza, coming from the Republic of Chile, and introduces other provisions.", "adopt": "", "eif": "22 April 2026. The notified Resolution shall enter into force on the date of its publication in the Official Journal. The notified Resolution was published in Official Journal No. 53.468.The measures established in this Resolution shall remain in effect until the event is reported as \"closed\" in the WOAH World Animal Health Information System (WAHIS) and pending compliance with the provisions of a supranational nature established by the Andean Community."}, {"sym": "G/SPS/N/THA/763/Add.1", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-24", "member": "태국", "type": "추가통보(긴급)", "topic": "아프리카돼지열병", "ko": "한국산 돼지·멧돼지 및 도체 수입·경유 중단 명령 개정 — 위험평가로 질병 위험이 없다고 판단되면 허가하는 조항 추가", "orig": "The DLD order on temporary suspension of the importation or transit of live domestic pigs and wild pigs and their carcasses from the Republic of Korea to prevent the spread of African Swine Fever", "products": "Live domestic pigs and wild pigs and their carcasses under Animal Epidemics Act B.E. 2558 (2015)", "hs": "0103, 020311, 020321", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTHA763A1.docx", "note": "한국산 관련", "desc": "Thailand proposes an amendment to the Department of Livestock Development (DLD) Order on temporary suspension of the importation or transit of live domestic pigs and wild pigs and their carcasses from the Republic of Korea to prevent the spread of African Swine Fever by adding paragraph (2) as follows: (1) The WOAH has reported an outbreak of African Swine Fever (ASF) in the area of the Republic of Korea. Therefore, it is necessary for Thailand to prevent the entry of African Swine Fever disease into the country. By the virtue of the Animal Epidemics Act B.E. 2558 (2015), the importation or transit of live domestic pigs, wild pigs, and their carcasses from the Republic of Korea has been temporarily suspended. (2) Where live domestic pigs and wild pigs and their carcasses from the Republic of Korea have undergone a risk assessment and have been determined to be free from epidemic diseases or vectors thereof, and where the measures prescribed by the DLD of Thailand have been duly complied with, the Director-General of the DLD will grant permission for the importation or transit of such live domestic pigs and wild pigs and their carcasses into or through Thailand.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/THA/764/Add.1", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-24", "member": "태국", "type": "추가통보(긴급)", "topic": "아프리카돼지열병", "ko": "인도네시아산 돼지 수입·경유 중단 명령 개정 — 위험평가로 질병 위험이 없다고 판단되면 허가하는 조항 추가", "orig": "The DLD order on temporary suspension of the importation or transit of live domestic pigs and wild pigs and their carcasses from Indonesia to prevent the spread of African Swine Fever", "products": "Live domestic pigs and wild pigs and their carcasses under Animal Epidemics Act B.E. 2558 (2015)", "hs": "0103, 020311, 020321", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTHA764A1.docx", "note": "", "desc": "Thailand proposes an amendment to the Department of Livestock Development (DLD) Order on temporary suspension of the importation or transit of live domestic pigs and wild pigs and their carcasses from Indonesia to prevent the spread of African Swine Fever by adding paragraph (2) as follows: (1) The WOAH has reported an outbreak of African Swine Fever (ASF) in the area of Indonesia. Therefore, it is necessary for Thailand to prevent the entry of African Swine Fever disease into the country. By the virtue of the Animal Epidemics Act B.E. 2558 (2015), the importation or transit of live domestic pigs, wild pigs, and their carcasses from Indonesia has been temporarily suspended. (2) Where live domestic pigs a h live domestic pigs and wild pigs and their carcasses into or through Thailand.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/THA/772/Add.1", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-24", "member": "태국", "type": "추가통보(긴급)", "topic": "아프리카돼지열병", "ko": "필리핀산 돼지 수입·경유 중단 명령 개정 — 위험평가로 질병 위험이 없다고 판단되면 허가하는 조항 추가", "orig": "The DLD order on temporary suspension of the importation or transit of live domestic pigs and wild pigs and their carcasses from the Philippines to prevent the spread of African Swine Fever", "products": "Live domestic pigs and wild pigs and their carcasses under Animal Epidemics Act B.E. 2558 (2015)", "hs": "0103, 020311, 020321", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTHA772A1.docx", "note": "", "desc": "Thailand proposes an amendment to the Department of Livestock Development (DLD) Order on temporary suspension of the importation or transit of live domestic pigs and wild pigs and their carcasses from the Philippines to prevent the spread of African Swine Fever by adding paragraph (2) as follows: (1) The WOAH has reported an outbreak of African Swine Fever (ASF) in the area of the Philippines. Therefore, it is necessary for Thailand to prevent the entry of African Swine Fever disease into the country. By the virtue of the Animal Epidemics Act B.E. 2558 (2015), the importation or transit of live domestic pigs, wild pigs, and their carcasses from the Philippines has been temporarily suspended. (2) Where live domestic pigs and wild pigs and their carcasses from the Philippines have undergone a risk assessment and have been determined to be free from epidemic diseases or vectors thereof, and where the measures prescribed by the DLD of Thailand have been duly complied with, the Director-General of the DLD will grant permission for the importation or transit of such live domestic pigs and wild pigs and their carcasses into or through Thailand.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/THA/775/Add.1", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-24", "member": "태국", "type": "추가통보(긴급)", "topic": "가금 수입제한(HPAI)", "ko": "대만산 가금 수입·경유 중단 명령 개정 — 위험평가로 질병 위험이 없다고 판단되면 허가하는 조항 추가", "orig": "The DLD order on temporary suspension of importation or transit of live poultry and poultry carcasses from Chinese Taipei to prevent the spread of High Pathogenicity Avian Influenza", "products": "Live poultry and poultry carcasses under Animal Epidemics Act B.E. 2558 (2015)", "hs": "0105, 0207", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTHA775A1.docx", "note": "", "desc": "Thailand proposes an amendment to the Department of Livestock Development (DLD) Order on temporary suspension of importation or transit of live poultry and poultry carcasses from Chinese Taipei to prevent the spread of High Pathogenicity Avian Influenza by adding paragraph (2) as follows: (1) The WOAH has reported an outbreak of High Pathogenicity Avian Influenza (Subtype H5N1) in the area of Chinese Taipei. Therefore, it is necessary for Thailand to prevent the entry of High Pathogenicity Avian Influenza (Subtype H5N1) into the country. By the virtue of the Animal Epidemics Act B.E. 2558 (2015), the importation or transit of live poultry and poultry carcasses from Chinese Taipei has been temporarily suspended. Except the feathers and down of poultry that have been processed in the approved establishment by the DLD and these commodities that have been processed to ensure the destruction of avian influenza virus recommended by WOAH terrestrial Animal Health code topics 10.4.22 and 10.4.23 which use one of the following methods:- washed and steam-dried at 100ºC for 30 minutes;- fumigation with formalin (10% formaldehyde) for 8 hours;- irradiation with a dose of 20 kilograys. (2) Where live poultry and poultry carcasses from Chinese Taipei have undergone a risk assessment and have been determined to be free from epidemic diseases or vectors thereof, and where the measures prescribed by the DLD of Thailand have been duly complied with, the Director-General of the DLD will grant permission for the importation or transit of such live poultry or poultry carcasses into or through Thailand.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/THA/776/Add.1", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-24", "member": "태국", "type": "추가통보(긴급)", "topic": "가금 수입제한(HPAI)", "ko": "나이지리아산 가금 수입·경유 중단 명령 개정 — 위험평가로 질병 위험이 없다고 판단되면 허가하는 조항 추가", "orig": "The DLD order on temporary suspension of importation or transit of live poultry and poultry carcasses from Nigeria to prevent the spread of High Pathogenicity Avian Influenza", "products": "Live poultry and poultry carcasses under Animal Epidemics Act B.E. 2558 (2015)", "hs": "0105, 0207", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTHA776A1.docx", "note": "", "desc": "Thailand proposes an amendment to the Department of Livestock Development (DLD) Order on temporary suspension of importation or transit of live poultry and poultry carcasses from Nigeria to prevent the spread of High Pathogenicity Avian Influenza by adding paragraph (2) as follows: (1) The WOAH has reported an outbreak of High Pathogenicity Avian Influenza (Subtype H5N1) in the area of Nigeria. Therefore, it is necessary for Thailand to prevent the entry of High Pathogenicity Avian Influenza (Subtype H5N1) into the country. By the virtue of the Animal Epidemics Act B.E. 2558 (2015), the importation or transit of live poultry and poultry carcasses from Nigeria has been temporarily suspended. (2) Where live poultry and poultry carcasses from Nigeria have undergone a risk assessment and have been determined to be free from epidemic diseases or vectors thereof, and where the measures prescribed by the DLD of Thailand have been duly complied with, the Director-General of the DLD will grant permission for the importation or transit of such live poultry or poultry carcasses into or through Thailand.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/IND/337/Add.2", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-28", "member": "인도", "type": "추가통보", "topic": "검역증명", "ko": "양고기·양고기 제품 수입 수의위생증명서 추가통보", "orig": "Veterinary Health Certificate for Import of Ovine Meat and Ovine Meat Products into India", "products": "Lamb meat and lamb meat products thereof", "hs": "0204", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NIND337A2.docx", "note": "", "desc": "The draft veterinary health certificate for regulating the import of Ovine Meat and Ovine Meat Products into India was notified to WTO in document G/SPS/N/IND/337, dated 14 October 2025. Subsequently, the final veterinary health certificate for import of Ovine Meat and Ovine Meat Products into India was notified to WTO in document G/SPS/N/IND/337/Add.1, dated 18 February 2026.Considering the comments of stakeholders, the content and scope of notified measures \"Veterinary Health Certificate for Import of Ovine Meat and Ovine Meat Products into India\" has been further reviewed. The revised measure was adopted and published on 6 April 2026. The notified measure will enter into force after transaction/migration period of six months from the date of circulation of the G/SPS/N/IND/337/Add.2 notification. Text is available on the website.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/JPN/1406", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-28", "member": "일본", "type": "정규통보", "topic": "수입검역", "ko": "수입 사전신고 대상 동물에 토끼·꿀벌 추가 성령 개정안", "orig": "Planned Revision of the Ministerial Ordinance for Enforcement of the Act on Domestic Animal Infectious Disease Control (Prior Notification Concerning the Importation of Animals)", "products": "Live rabbits (Leporidae), live honeybees (Apis spp.)", "hs": "010614, 010641", "deadline": "2026-06-27", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NJPN1406.docx", "note": "", "desc": "MAFF is proposing a revision to Article 47-2 of the Ministerial Ordinance for Enforcement of the Act on Domestic Animal Infectious Diseases Control to add live rabbits (Leporidae) and live honeybees (Apis spp.) to the animals subject to the prior Notification Concerning the Importation of Animals before arrival in Japan, in order to ensure smooth animal quarantine procedures.", "adopt": "July 2026", "eif": "January 2027"}, {"sym": "G/SPS/N/JPN/1407", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-28", "member": "일본", "type": "정규통보", "topic": "수입검역", "ko": "지정검역물에 이빨·엄니 추가 성령 개정안", "orig": "Planned Revision of the Ministerial Ordinance for Enforcement of the Act on Domestic Animal Infectious Disease Control (Addition to Designated Quarantine Items)", "products": "Teeth, tusks", "hs": "", "deadline": "2026-06-27", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NJPN1407.docx", "note": "", "desc": "MAFF is proposing to revise Article 45-3 of the Ministerial Ordinance for Enforcement of the Act on Domestic Animal Infectious Diseases Control to add teeth and tusks as designated quarantine items. As a result, the import of the said items will not be permitted without an appropriate health certificate issued by the animal health authority of the exporting country, and importers of the said items, would be required to notify the Animal Quarantine Service without delay.", "adopt": "July 2026", "eif": "January 2027"}, {"sym": "G/SPS/N/COL/421", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-29", "member": "콜롬비아", "type": "정규통보", "topic": "동물용의약품", "ko": "동물용 제품 제조·보관업체 우수제조·보관기준 결의안", "orig": "Proyecto de Resolución \"Por medio de la cual se reglamenta la aplicación de las Buenas Prácticas en las Empresas fabricantes o elaboradoras, fabricantes o elaboradoras por contrato, semielaboradoras y/o almacenadoras de productos Veterinarios\" (Draft Resolution regulating the implementation of good practices in enterprises that manufacture or process, contract manufacture or process, semi-process and/or store veterinary products)", "products": "Pharmacological, biological, phytotherapeutic and homeopathic products; ectoparasiticides, insecticides and repellents; antiseptics, disinfectants, sanitizers and detergents for veterinary use (HS code(s): 3003; 3004; 3402; 3808)", "hs": "3003, 3004, 3808, 3402", "deadline": "2026-06-28", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCOL421.docx", "note": "", "desc": "The notified measure establishes requirements for the implementation of good manufacturing practices and good storage practices in enterprises that manufacture, process, semi-process or store products for veterinary use, including pharmacological, biological, phytotherapeutic and homeopathic products, ectoparasiticides, disinfectants and other related products. Its purpose is to prevent and control biological and chemical risks that could affect animal health and safety in agricultural and livestock production by ensuring that these products are manufactured, handled and stored under conditions that minimize contamination, the spread of disease and other health risks.", "adopt": "2 October 2026", "eif": "2 October 2026"}, {"sym": "G/SPS/N/CHL/854/Add.1", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-04-30", "member": "칠레", "type": "추가통보", "topic": "반려동물", "ko": "개·고양이·페럿 반입 위생요건 결의 공포(공포 60일 후 시행)", "orig": "Resolución Exenta No 3.343/2026, Fija exigencias sanitarias para la internación a Chile de perros, gatos y hurones y deroga Resolución Exenta No 6508/2021 (Exempt Resolution No. 3.343/2026 establishing sanitary requirements for the entry into Chile of dogs, cats and ferrets, and repealing Exempt Resolution No. 6508/2021)Chile hereby advises that Exempt Resolution No. 3.343 of 2026, establishing sanitary requirements for the entry into Chile of dogs, cats and ferrets, and repealing Exempt Resolution No. 6508/2021, was published in the Official Journal on 28 April 2026 and will enter into force ", "products": "Dogs (Canis lupus familiaris), cats (Felis catus) and ferrets (Mustela putorius furo)", "hs": "010619", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCHL854A1.docx", "note": "", "desc": "Resolución Exenta No 3.343/2026, Fija exigencias sanitarias para la internación a Chile de perros, gatos y hurones y deroga Resolución Exenta No 6508/2021 (Exempt Resolution No. 3.343/2026 establishing sanitary requirements for the entry into Chile of dogs, cats and ferrets, and repealing Exempt Resolution No. 6508/2021)Chile hereby advises that Exempt Resolution No. 3.343 of 2026, establishing sanitary requirements for the entry into Chile of dogs, cats and ferrets, and repealing Exempt Resolution No. 6508/2021, was published in the Official Journal on 28 April 2026 and will enter into force 60 days after that date.https://members.wto.org/crnattachments/2026/SPS/CHL/26_02310_00_s.pdf", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/ARG/278", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-04-01", "member": "아르헨티나", "type": "정규통보", "topic": "종자 검역", "ko": "벨기에산 번식용 옥수수 종자 수입 식물검역요건", "orig": "Requisitos fitosanitarios para la importación de semillas de maíz (Zea mays) destino propagación, provenientes de Bélgica, hacia la República Argentina (Phytosanitary requirements for the importation into the Argentine Republic of maize (Zea mays) seeds for propagation from Belgium)", "products": "Maize (Zea mays) seeds for propagation", "hs": "100510", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NARG278.docx", "note": "", "desc": "The Argentine Republic hereby establishes specific phytosanitary requirements for the importation of maize (Zea mays) seeds for propagation from Belgium.The shipment must be accompanied by an official phytosanitary certificate.", "adopt": "27 March 2026", "eif": "27 March 2026"}, {"sym": "G/SPS/N/BRA/2358/ orocco, Peru and United States of America.Further details can be found at our consultation webpage", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/AUS/502/Add.25", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-04-02", "member": "호주", "type": "추가통보(긴급)", "topic": "병해충(긴급)", "ko": "카프라곡물좀 위험국 목록 개정 — 8개국을 위험국으로 재분류(긴급조치 추가통보)", "orig": "Notification of emergency measures for Khapra beetle.", "products": "The following goods (in various raw and processed forms): Rice (Oryza sativa) [Tariff 1209, 1006] Chickpeas (Cicer arietinum) [Tariff 1209, 07131106] Cucurbit seed (Cucurbita spp.) [Tariff 1209, 1207] Cumin seed (Cuminum cyminum) [Tariff 1209, 0909] Safflower seed (Carthamus tinctorius) [Tariff 1209, 1207] Bean seed (Phaseolus) [Tariff 1209, 0713, 1106] Soybean (Glycine max) [Tariff 1209, 1201] Mu", "hs": "0713, 071310, 0904, 0909, 1001, 1101, 1103, 1104, 1106, 1201, 1202, 1207, 1209", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NAUS502A25.docx", "note": "", "desc": "Amendments to Australia’s List of Target-risk khapra beetle countries and List of Trogoderma Species of Biosecurity Concern As notified in G/SPS/N/AUS/502/Add.24, in November 2025 the Australian Department of Agriculture, Fisheries and Forestry (the department) published the Draft Pest Risk Analysis (PRA) for khapra beetle (Trogoderma granarium) Part 1 for plant products, for public consultation. The consultation period closed on 27 February 2026. This addendum notifies trading partners that Australia will implement the following two changes recommended in the Draft PRA, effective from 30 April 2026Change 1: Updating Australia’s List of ‘target-risk khapra beetle countries’ to include 8 additional countries: Angola, Chad, Guinea, Jordan, Kazakhstan, Tajikistan, Tanzania and Turkmenistan (Available at: https://www.agriculture.gov.au/biosecurity-trade/policy/legislation/list-target-risk-countries-host-khapra-beetleChange 2: Removing Trogoderma serraticorne from Australia’s ‘List of Trogoderma Species of Biosecurity Concern’. (Available at https://www.agriculture.gov.au/biosecurity-trade/policy/legislation/list-trogoderma-speciesThese Lists are referenced under the Biosecurity Act 2015. The updated versions of the lists (and previous versions to support consignments shipped under earlier requirements) will be published on the above webpages on 30 April 2026. Goods in-transitConsignments shipped up to and including 29 April 2026 will be assessed against the previous versions of the relevant Lists in force at the time of export.Consignments shipped on or after 30 April 2026 will be required to meet the updated import conditions, applying the new versions of the relevant lists (which take effect on implementation).The shipped-on-board date recorded on consignment documents will be used to determine the applicable requirements. Summary of Change 1: Addition of countries to the ‘List of Target-risk khapra beetle countries’Based on information considered in the Draft PRA, there are references suggesting that khapra beetle may be present in Angola, Chad, Guinea, Jordan, Kazakhstan, Tajikistan, Tanzania and Turkmenistan. Australia engaged with the National Plant Protection Organisations of these countries however insufficient evidence was provided to support the ‘absence’ status. These countries will be added to Australia’s List of Khapra beetle target-risk countries, effective from 30 April 2026.Consignments exported from these countries will now be subject to addit", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/MEX/466", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-04-02", "member": "멕시코", "type": "정규통보", "topic": "종자 검역", "ko": "과테말라산 파종용 유스토마 종자 수입 식물검역요건안", "orig": "Propuesta de requisitos fitosanitarios para la importación a México de semilla de eustoma (Eustoma grandiflorum) para siembra, originaria de Guatemala y procedente de Estados Unidos de América (Draft phytosanitary requirements governing the importatio

tion of yellow chilli pepper (Capsicum baccatum) seeds originating in and coming from BrazilThe National Agrarian Health Service (SENASA) of Peru hereby notifies the publication in the Official Journal, El Peruano, on 31 March 2026, of Directorial Resolution No. D000013-2026-MIDAGRI-SENASA-DSV, which establishes the phytosanitary requirements governing the importation of yellow chilli pepper (Capsicum baccatum) seeds originating in and coming from Brazil.https://members.wto.org/crnattachments/2026/SPS/PER/26_01930_00_s.pdf", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/AUS/614/Add.1", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-04-10", "member": "호주", "type": "추가통보", "topic": "수입요건", "ko": "베트남산 포멜로 생과 수입 위생요건 최종보고서·수입조건 공표", "orig": "Pomelo fruit from Viet Nam: Biosecurity import requirements final report", "products": "Fresh pomelo fruit", "hs": "080540", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NAUS614A1.docx", "note": "", "desc": "Import conditions for Viet Nam pomelos published on BICONImport conditions to import fresh pomelo fruit from Viet Nam, for human consumption, are now published on Australia’s Biosecurity Import Conditions database (BICON).To achieve the appropriate level of protection for Australia, fresh pomelos from Viet Nam must: be produced under a systems approach at approved and registered orchards and packing houses to manage Asian citrus psyllid and citrus canker, and undergo pre-export irradiation treatment at an approved facility to manage quarantine fruit flies, mealybugs, scale insects and false spider mite.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/JPN/1403", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-04-10", "member": "일본", "type": "긴급통보", "topic": "병해충(긴급)", "ko": "네팔산 코들링나방 기주식물 수입 금지(긴급)", "orig": "Emergency measures to mitigate the risk of introducing Cydia pomonella (Codling moth)", "products": "Fresh fruits of the following plants apricot (Prunus armeniaca), cherry (inlcuding Prunus aviumPrunus cerasus, others), plum (including Prunus domesticaPrunus salicina), quince (Cydonia oblonga), peach (Prunus persicaPyrusMalus.Fresh fruits and nuts in shell of the following plants: Juglans (fruits and nuts in shell).", "hs": "08, 080840, 080910, 08092, 080930, 080940", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NJPN1403.docx", "note": "", "desc": "To prevent the introduction of Cydia pomonella into Japan, MAFF has taken emergency measures to prohibit the import of host plants of C. pomonella (specified in Item 3 of this notification) originated in Nepal based on examination of the relevant documents listed in Item 10.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/COL/411/Add.1", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-04-13", "member": "콜롬비아", "type": "추가통보", "topic": "수입요건", "ko": "알스트로메리아 기내 묘 수입 식물검역요건 결의 공포", "orig": "Resolución No. 00005794 del 8 de abril de 2026 del Instituto Colombiano Agropecuario \"Por medio de la cual se establecen los requisitos fitosanitarios para la importación a Colombia de plantas in vitro de Alstroemeria (Alstroemeria spp.) de origen y procedencia Kenia, para uso comercial, ensayo y/o siembra\" (Colombian Agricultural Institute Resolution No. 00005794 of 8 April 2026 establishing the phytosanitary requirements for the importation into Colombia of in vitro alstroemeria (Alstroemeria spp.) plants originating in and coming from Kenya, for commercial use, testing and/or planting)The R", "products": "In vitro alstroemeria (Alstroemeria spp.) plants (HS code: 060290)", "hs": "060290", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCOL411A1.docx", "note": "", "desc": "Resolución No. 00005794 del 8 de abril de 2026 del Instituto Colombiano Agropecuario \"Por medio de la cual se establecen los requisitos fitosanitarios para la importación a Colombia de plantas in vitro de Alstroemeria (Alstroemeria spp.) de origen y procedencia Kenia, para uso comercial, ensayo y/o siembra\" (Colombian Agricultural Institute Resolution No. 00005794 of 8 April 2026 establishing the phytosanitary requirements for the importation into Colombia of in vitro alstroemeria (Alstroemeria spp.) plants originating in and coming from Kenya, for commercial use, testing and/or planting)The Republic of Colombia hereby notifies the issuance of Colombian Agricultural Institute Resolution No. 00005794 of 8 April 2026 establishing the phytosanitary requirements for the importation into Colombia of in vitro alstroemeria (Alstroemeria spp.) plants originating in and coming from Kenya, for commercial use, testing and/or planting. The Resolution establishes phytosanitary requirements for the importation into Colombia of in vitro alstroemeria (Alstroemeria spp.) plants originating in and coming from Kenya, for commercial use, testing and/or planting, and applies to all natural or legal persons importing these products.The Resolution was published in Official Journal No. 53.453 of 9 April 2026 and entered into force the same day.https://www.ica.gov.co/getattachment/a277398d-7548-42cc-9dd6-6d1de4371330/2026R00005794.aspxhttps://members.wto.org/crnattachments/2026/SPS/COL/26_02020_00_s.pdf", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/VNM/180", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-04-13", "member": "베트남", "type": "정규통보", "topic": "검역절차", "ko": "규제물품 수입·수출·경유·격리 식물검역 절차 시행규칙안", "orig": "Draft Circular on procedures for plant quarantine inspection for import, export, transit and post-entry quarantine of regulated articles", "products": "Plants and plant products", "hs": "", "deadline": "2026-06-12", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NVNM180.docx", "note": "", "desc": "The circular stipulates the procedures for plant quarantine inspection for import, export, transit and post-entry quarantine of regulated articles.This Circular replaces Circular No. 33/2014, dated 30 October 2014, issued by the Minister of Agriculture and Rural Development.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/CHL/808/Rev.1/Add.1", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-04-14", "member": "칠레", "type": "추가통보", "topic": "종자 검역", "ko": "모든 원산지 옥수수 종자 수입 식물검역요건 결의 공포", "orig": "Resolución Exenta N° 2.554/ 2026 que \"Establece requisitos fitosanitarios de importación para el ingreso de semillas de maíz (Zea mays L.) procedentes de todo origen y modifica resolución N° 1.187 exenta, de 2022\" (Exempt Resolution No. 2.554/2026 establishing phytosanitary requirements for the importation into Chile of maize (Zea mays L.) seeds, of any origin, and amending Exempt Resolution No. 1.187 of 2022)Chile hereby advises that Exempt Resolution No. 2554/2026 establishing phytosanitary requirements for the importation into Chile of maize (Zea mays L.) seeds, of any origin, and amending ", "products": "Maize (Zea mays L.) seeds", "hs": "100510", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCHL808R1A1.docx", "note": "", "desc": "Resolución Exenta N° 2.554/ 2026 que \"Establece requisitos fitosanitarios de importación para el ingreso de semillas de maíz (Zea mays L.) procedentes de todo origen y modifica resolución N° 1.187 exenta, de 2022\" (Exempt Resolution No. 2.554/2026 establishing phytosanitary requirements for the importation into Chile of maize (Zea mays L.) seeds, of any origin, and amending Exempt Resolution No. 1.187 of 2022)Chile hereby advises that Exempt Resolution No. 2554/2026 establishing phytosanitary requirements for the importation into Chile of maize (Zea mays L.) seeds, of any origin, and amending Exempt Resolution No. 1.187 of 2022, was published in the Official Journal on 10 April 2026, and will enter into force on 1 December 2026.https://members.wto.org/crnattachments/2026/SPS/CHL/26_02031_00_s.pdf", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/TUR/159", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-04-14", "member": "튀르키예", "type": "긴급통보", "topic": "병해충(긴급)", "ko": "감귤그린병 유입 방지를 위한 오렌지재스민 수입 금지(긴급)", "orig": "Import Ban on Orange Jasmine (Murraya paniculata", "products": "Orange Jasmine (Murraya paniculata", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTUR159.docx", "note": "", "desc": "The presence of Citrus Greening Disease (Candidatus Liberibacter spp.), which can cause severe damage in citrus production areas and reduce yields by up to 40%, and its vector, the Asian Citrus Psyllid (Diaphorina citri), has not been reported in our country. These pests are listed under the Plant Quarantine Regulation and on the EPPO A1 quarantine list.Given Türkiye’s significant role in global citrus production, it is of utmost importance to prevent the introduction, establishment, and spread of Candidatus Liberibacter spp. and Diaphorina citri into the country’s agricultural areas in order to protect national territory.Therefore, the import of Murraya paniculata, which is among the main hosts of Diaphorina citri, into Türkiye is prohibited from 15 May 2026 onwards (except for shipments accompanied by Phytosanitary Certificates issued before 15 May 2026) from all countries.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/BRA/2484", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-04-15", "member": "브라질", "type": "정규통보", "topic": "수입요건", "ko": "페루산 아보카도 생과 수입 식물검역요건 개정안", "orig": "Draft. Updates the phytosanitary requirements for the importation of fresh avocado fruit (Persea americana) produced in Peru", "products": "Persea americana", "hs": "080440", "deadline": "2026-06-14", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NBRA2484.docx", "note": "", "desc": "Draft Ordinance aiming to update the phytosanitary requirements for the importation into Brazil of fresh avocado fruit (Persea americana) produced in Peru.", "adopt": "To be determined.", "eif": "To be determined."}, {"s cimiento de Requisitos Fitosanitarios para la Importación de canela en raja (Cinnamomum verum) origen Indonesia (Resolution No. 139-2026-IPSA establishing phytosanitary requirements for the importation of cinnamon sticks (Cinnamomum verum) originating in Indonesia)", "products": "Cinnamon sticks (Cinnamomum verum)", "hs": "0906", "deadline": "2026-06-14", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NNIC294.docx", "note": "", "desc": "The notified text establishes phytosanitary requirements for the importation of cinnamon sticks originating in Indonesia.1. The shipment must be accompanied by an official phytosanitary certificate, which certifies that the plant product has been inspected by the national plant protection organization (NPPO) of the country of origin.2. The shipment will be subject to a phytosanitary inspection and sampling for phytosanitary diagnosis at the agricultural quarantine post upon entry into the country.Shipments will be subject to phytosanitary checks by plant quarantine inspectors from the Institute for Agricultural and Livestock Protection and Health, who will verify compliance with the phytosanitary requirements and decide whether or not to authorize importation, on the basis of the accompanying documents.", "adopt": "To be determined", "eif": "To be determined"}, {"sym": "G/SPS/N/PER/1123", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-04-15", "member": "페루", "type": "정규통보", "topic": "수입요건", "ko": "퇴비(유기질비료) 수입 식물검역요건안", "orig": "Proyecto de Resolución Directoral para el establecimiento de requisitos fitosanitarios de necesario cumplimiento en la importación de compost (abono orgánico) de todos los orígenes (Draft Directorial Resolution establishing mandatory phytosanitary requirements governing the importation of compost (organic fertilizer) originating in any country)", "products": "Compost (organic fertilizer), national subheading (SPN): 3101.00.90.00", "hs": "3101", "deadline": "2026-06-14", "link" //docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCHL873A1.docx", "note": "", "desc": "Resolución Exenta No 2.656/2026 que \"Modifica Resolución No 1.295 de 2014, que establece requisitos fitosanitarios de importación para material de propagación de las especies que indica, procedentes de Australia\" (Exempt Resolution No. 2.656/2026 amending Resolution No. 1.295 of 2014, which establishes phytosanitary requirements for imports from Australia of propagation material of the indicated species)Chile hereby advises that Exempt Resolution No. 2.656 of 2026 \"amending Resolution No. 1.295 of 2014, which establishes phytosanitary requirements for imports from Australia of propagation material of the indicated species\", was published in the Official Journal on 14 April 2026 and entered into force on that date.https://members.wto.org/crnattachments/2026/SPS/CHL/26_02091_00_s.pdf", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/CHL/879", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-04-16", "member": "칠레", "type": "정규통보", "topic": "수입요건", "ko": "미국 캘리포니아산 피스타치오 묘목 수입 식물검역요건 개정안 — 추가 요건 삭제", "orig": "Modifica resolución No 6.114 de 2021 que establece requisitos fitosanitarios de importación para Plantas, Estacas y Ramillas de pistacho (pistacia spp.), procedentes del Estado de California de Estados Unidos de Norteamérica (Amendment to Resolution No. 6.114 of 2021 establishing phytosanitary requirements governing the importation of pistachio (Pistacia spp.) plants, cuttings and twigs from the state of California, United States of America)", "products": "Pistachio (Pistacia spp.) plants, cuttings and twigs", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCHL879.docx", "note": "", "desc": "The notified Amendment updates the phytosanitary requirements governing the importation of pistachio (Pistacia spp.) plants, cuttings and twigs from the state of California in the United States, removing the requirement for additional declarations for the pests Brevipalpus lewisi and Rhodococcus fascians, both present in Chile, and introducing a simplified alternative to post-entry quarantine or exemption from quarantine when the material comes from production centres recognized by the SAG.Further details can be found in the document attached to this notification.", "adopt": "Upon publication in the Official Journal.", "eif": "Upon publication in the Official Journal."}, {"sym": "G/SPS/N/BRA/2485", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-04-17", "member": "브라질", "type": "정규통보", "topic": "수입요건", "ko": "페루산 블루베리 묘목 수입 식물검역요건안", "orig": "Draft. Establishes the phytosanitary requirements for the importation of blueberry seedlings (Vaccinium corymbosum) produced in the Republic of Peru", "products": "Blueberry (Vaccinium corymbosum", "hs": "060220", "deadline": "2026-06-16", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NBRA2485.docx", "note": "", "desc": "Draft Ordinance aiming to establish the phytosanitary requirements for the importation into Brazil of blueberry seedlings (Vaccinium corymbosum, category 4) produced in the Republic of Peru.", "adopt": "To be determined.", "eif": "To be determined."}, {"sym": "G/SPS/N/EU/900/Add.1", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-04-17", "member": "유럽연합", "type": "추가통보", "topic": "병해충", "ko": "병해충 목록·반입 규칙 개정 채택 — 시행규정 (EU) 2026/826", "orig": "Amendment of Implementing Regulation (EU) 2019/2072 as regards the listing of pests and rules on the introduction into, and movement within, the Union territory of plants, plant products and other objects", "products": "Plants, plant products and other objects (HS chapters: 01 (beehives), 06 (live plants), 07 (vegetables), 08 (fruits), 09 (Spices), 12 (seeds), 14 (vegetable products), 44 (wood), 46 (beehives), 84 (machinery), 87 (vehicles), 94 (prefabricated buildings of wood))", "hs": "01, 06, 07, 08, 09, 12, 14, 44, 46, 84, 87, 94", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEU900A1.docx", "note": "", "desc": "The proposal notified in G/SPS/N/EU/900 (8 December 2025) is now adopted: Commission Implementing Regulation (EU) 2026/826 of 14 April 2026 amending Implementing Regulation (EU) 2019/2072 as regards the listing of pests and rules on the introduction into, and movement within, the Union territory of plants, plant products and other objects.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/MEX/469", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-04-20", "member": "멕시코", "type": "정규통보", "topic": "종자 검역", "ko": "페루산 파종용 오이 종자 수입 식물검역요건안", "orig": "Propuesta de fitosanitarios para la importación a México de semilla de pepino (Cucumis sativus) para siembra, originaria y procedente de Perú (Draft phytosanitary requirements for the importation into Mexico of cucumber (Cucumis sativus) seeds for sowing, originating in and coming from Peru)", "products": "Cucumber (Cucumis sativus L.) seeds for sowing", "hs": "", "deadline": "2026-06-19", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NMEX469.docx", "note": "", "desc": "The notified draft phytosanitary requirements governing the importation into Mexico of cucumber (Cucumis sativus) seeds for sowing, originating in and coming from Peru, were determined by SENASICA, pursuant to the Agreement on the Application of Sanitary and Phytosanitary Measures.", "adopt": "To be determined", "eif": "To be determined"}, {"sym": "G/SPS/N/AUS/502/Add.26", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-04-21", "member": "호주", "type": "추가통보(긴급)", "topic": "병해충(긴급)", "ko": "카프라곡물좀 위험국 재분류 수정 — 투르크메니스탄 제외, 나머지 7개국은 4.30 적용", "orig": "Update to SPS Notification G/SPS/N/AUS/502/Add.25 – Khapra beetle target-risk country status for Turkmenistan", "products": "The following goods (in various raw and processed forms): Rice (Oryza sativa) [Tariff 1209, 1006] Chickpeas (Cicer arietinum) [Tariff 1209, 07131106] Cucurbit seed (Cucurbita spp.) [Tariff 1209, 1207] Cumin seed (Cuminum cyminum) [Tariff 1209, 0909] Safflower seed (Carthamus tinctorius) [Tariff 1209, 1207] Bean seed (Phaseolus) [Tariff 1209, 0713, 1106] Soybean (Glycine max) [Tariff 1209, 1201] Mu", "hs": "0713, 071310, 0904, 0909, 1001, 1101, 1103, 1104, 1106, 1201, 1202, 1207, 1209", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NAUS502A26.docx", "note": "", "desc": "In G/SPS/N/AUS/502/Add.25, Australia notified trading partners of the re-classification of eight countries as khapra beetle target-risk countries effective 30 April 2026, including TurkmenistanAfter consideration of additional information provided by Turkmenistan, Australia has determined that Turkmenistan does not meet the criteria for designation as a khapra beetle target-risk country. Turkmenistan will therefore remain as a non-target risk khapra beetle country, and the existing emergency measures for non-target risk khapra beetle countries will continue to apply to plant products exported from Turkmenistan to Australia.The following seven remaining countries will be re-classified as target-risk countries on 30 April 2026 as originally notified: Angola, Chad, Guinea, Jordan, Kazakhstan, Tajikistan and Tanzania.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/CHL/880", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-04-21", "member": "칠레", "type": "정규통보", "topic": "수입요건", "ko": "미국산 딸기 묘 수입 식물검역요건 개정안", "orig": "Modifica Resolución No. 6.293 de 2024 que Establece requisitos fitosanitarios de importación para plantas de frutilla (Fragaria × ananassa) procedentes de Estados Unidos de Norteamérica (Amendment to Resolution No. 6.293 of 2024 establishing phytosanitary requirements for the importation of Fragaria × ananassa plants from the United States of America).", "products": "Strawberry (Fragaria × ananassa) plants", "hs": "060220", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCHL880.docx", "note": "", "desc": "The notified Amendment updates the phytosanitary requirements governing the importation of strawberry (Fragaria × ananassa) plants coming from the United States of America, in accordance with the current phytosanitary situation in Chile and the SAG's official list of quarantine pests. In particular, it removes from the list the pest Aphelenchoides fragariae, which is present in Chile, and replaces Colletotrichum acutatum complex with Colletotrichum acutatum.Further details can be found in the document attached to this notification.", "adopt": "Upon publication in the Official Journal.", "eif": "Upon publication in the Official Journal."}, {"sym": "G/SPS/N/CHN/1359", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-04-23", "member": "중국", "type": "정규통보", "topic": "외래종", "ko": "항만 관리 대상 주요 외래종 목록 공고(해관총서 등 2026년 제39호)", "orig": "Announcement No. 39 of 2026 issued by the General Administration of Customs of the People's Republic of China, Ministry of Agriculture and Rural Affairs of the People's Republic of China, Ministry of Natural Resources of the People's Republic of China, Ministry of Ecology and Environment of the People's Republic of China, Ministry of Housing and Urban-Rural Development of the People's Republic of China, National Forestry and Grassland Administration (on the Release of the \"List of Key Alien Species Subject to Port Control\")", "products": "Alien Species", "hs": "01, 06", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCHN1359.docx", "note": "", "desc": "According to the Biosecurity Law of the People's Republic of China and the Measures for the Administration of Invasive Alien Species, the General Administration of Customs, together with the Ministry of Agriculture and Rural Affairs, the Ministry of Natural Resources, the Ministry of Ecology and Environment, the Ministry of Housing and Urban-Rural Development, and the National Forestry and Grassland Administration, has formulated the List of Key Alien Species Subject to Port Control.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/BRA/2486", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-04-27", "member": "브라질", "type": "정규통보", "topic": "수입요건", "ko": "콜롬비아산 블루베리 생과 수입 식물검역요건안", "orig": "Draft - Establishes the phytosanitary requirements for the importation of blueberry fruit (Vaccinium corymbosum) produced in the Republic of Colombia", "products": "Blueberry fruitVaccinium corymbosum", "hs": "081040", "deadline": "2026-06-26", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NBRA2486.docx", "note": "", "desc": "Draft Ordinance aiming to establish the phytosanitary requirements for the importation into Brazil of blueberry fruit (Vaccinium corymbosum, category 3) produced in Colombia.", "adopt": "To be determined.", "eif": "To be determined."}, {"sym": "G/SPS/N/ECU/393", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-04-27", "member": "에콰도르", "type": "정규통보", "topic": "종자 검역", "ko": "네덜란드산 파종용 스토크 종자 수입 식물검역요건안", "orig": "Propuesta de requisitos fitosanitarios para la importación de semillas de alhelí para la siembra originarias de Países Bajos (Draft phytosanitary requirements for the importation of hoary stock seeds for sowing, originating in the Netherlands)", "products": "Hoary stock seeds", "hs": "0601", "deadline": "2026-06-26", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NECU393.docx", "note": "", "desc": "The notified document sets out the phytosanitary requirements for the importation of hoary stock seeds for sowing, originating in the Netherlands.", "adopt": "To be determined", "eif": "To be determined"}, {"sym": "G/SPS/N/PER/1104/Add.1", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-04-27", "member": "페루", "type": "추가통보", "topic": "수입요건", "ko": "브라질산 연구용 감자 화분 수입 식물검역요건 공포", "orig": "Establecen requisitos fitosanitarios para la importación de polen de papa (Solanum tuberosum L.) con fines de investigación, de origen y procedencia de la República Federativa de Brasil (Phytosanitary requirements for the importation of potato (Solanum tuberosum L.) pollen for research purposes originating in and coming from the Federative Republic of Brazil)The National Agrarian Health Service (SENASA) hereby notifies that Directorial Resolution No. D000016-2026-MIDAGRI-SENASA-DSV establishing mandatory phytosanitary requirements for the importation of potato (Solanum tuberosum L.) pollen for", "products": "Potato (Solanum tuberosum L.) pollen (HS code: 140490)", "hs": "140490", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NPER1104A1.docx", "note": "", "desc": "Establecen requisitos fitosanitarios para la importación de polen de papa (Solanum tuberosum L.) con fines de investigación, de origen y procedencia de la República Federativa de Brasil (Phytosanitary requirements for the importation of potato (Solanum tuberosum L.) pollen for research purposes originating in and coming from the Federative Republic of Brazil)The National Agrarian Health Service (SENASA) hereby notifies that Directorial Resolution No. D000016-2026-MIDAGRI-SENASA-DSV establishing mandatory phytosanitary requirements for the importation of potato (Solanum tuberosum L.) pollen for research purposes originating in and coming from the Federative Republic of Brazil, was published in the Official Journal El Peruano on 22 April 2026. The draft version of this Directorial Resolution was notified in document G/SPS/N/PER/1104 of 7 January 2026.https://members.wto.org/crnattachments/2026/SPS/PER/26_02215_00_s.pdf", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/CHL/881", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-04-28", "member": "칠레", "type": "정규통보", "topic": "수입요건", "ko": "한국산 온실재배 파프리카 생과 수입 식물검역요건안", "orig": "Establece requisitos fitosanitarios para la importación de frutos frescos de pimentón o paprika (Capsicum annuum L.) para consumo, producidos bajo invernadero y procedentes de la República de Corea (Establishing phytosanitary requirements for the importation of fresh bell or paprika peppers (Capsicum annuum L.) for consumption, cultivated in greenhouses and originating in the Republic of Korea)", "products": "Bell or paprika peppers (Capsicum annuum L.)", "hs": "0904", "deadline": "2026-06-27", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCHL881.docx", "note": "한국산 농산물 관련", "desc": "The notified draft text establishes phytosanitary requirements for the importation into Chile of fresh bell or paprika peppers (Capsicum annuum), cultivated in greenhouses and originating in the Republic of Korea:• To enter the country, consignments must be covered by an official phytosanitary certificate, issued by the plant health authority of the Republic of Korea, including the additional declarations established in the notified draft resolution;• Consignments must come from production sites (greenhouses) and packing facilities registered by the NPPO of the Republic of Korea, and authorized through the assignment of unique identification codes, in accordance with the guidelines of its certification programme;• Consignments must come from production sites that are monitored for Helicoverpa armigera and Helicoverpa assulta.Further details can be found in the document attached to this notification.", "adopt": "Upon publication in the Official Journal.", "eif": "Upon publication in the Official Journal."}, {"sym": "G/SPS/N/CHL/882", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-04-28", "member": "칠레", "type": "정규통보", "topic": "수입요건", "ko": "미국산 핵과류 묘목·삽수 수입 식물검역요건 개정안", "orig": "Establece requisitos fitosanitarios para la importación de plantas y ramillas de especies de Carozo procedentes de Estados Unidos de Norteamérica, modifica Resolución No 5.073 de 2012 y deroga Resolución No 136 de 2021 (Establishing phytosanitary measures for the importation of plants and slips of stone f       </div>`;
    const bind = (id, key, ev = 'change', val = (e) => e.target.value) => $(id).addEventListener(ev, (e) => { F[key] = val(e); renderFeed(); });
    let t = null; $('f-q').addEventListener('input', (e) => { clearTimeout(t); t = setTimeout(() => { F.q = e.target.value; renderFeed(); }, 120); });
    bind('f-group', 'group'); bind('f-member', 'member');
    $('f-scope').addEventListener('change', (e) => { F.scope = e.target.value; F.member = ''; renderHome(); syncBm(); $('feed-top')?.scrollIntoView({ block: 'start' }); });
    bind('f-open', 'open', 'change', e => e.target.checked); bind('f-marked', 'marked', 'change', e => e.target.checked);
    $('f-clear').onclick = () => { F = { q: '', group: '', member: '', open: false, marked: false, scope: F.scope }; renderHome(); syncBm(); };
    renderFeed();
  }

  function renderFeed() {
    const q = F.q.trim().toLowerCase();
    const base = F.scope === 'all' ? UNIQ : scopeItems().map(x => ({ ...x, issue: ISSUES.find(i => i.id === F.scope) }));
    const rows = base.filter(x => (!F.group || x.group === F.group) && (!F.member || x.member === F.member) &&
      (!F.open || (x.deadline && left(x.deadline) >= 0)) && (!F.marked || marks.has(x.sym)) &&
      (!q || [x.sym, x.member, x.topic, x.ko, x.orig, x.products, x.hs, x.desc].join(' ').toLowerCase().includes(q)))
      .sort((a, b) => (a.deadline && left(a.deadline) >= 0 ? 0 : 1) - (b.deadline && left(b.deadline) >= 0 ? 0 : 1) || GROUPS.indexOf(a.group) - GROUPS.indexOf(b.group) || b.date.localeCompare(a.date));
    const active = F.q || F.group || F.member || F.open || F.marked;
    $('f-count').textContent = `${rows.length}건`;
    $('f-clear').hidden = !active;
    $('feed').innerHTML = rows.length ? rows.map(card).join('') :
      `<li class="empty"><b>${F.marked && !marks.size ? '아직 북마크한 통보가 없습니다' : '조건에 맞는 통보가 없습니다'}</b><span>${F.marked && !marks.size ? '카드의 북마크를 누르면 여기에 모입니다.' : '검색어나 필터를 바꿔 보세요.'}</span></li>`;
    $('feed').querySelectorAll('[data-mark]').forEach(b => b.onclick = () => { toggleMark(b.dataset.mark); renderFeed(); });
  }

  function ref(x) {
    const d = x.deadline && left(x.deadline) >= 0 ? ` · 의견 ${md(x.deadline)}까지` : '';
    return `<li><a href="#${itemId(x.sym)}">${esc(x.member)} — ${esc(x.ko)}</a><small><span class="sym">${esc(x.sym)}</span>${d}</small></li>`;
  }

  function renderPost(x) {
    const map = Object.fromEntries(x.items.map(i => [i.sym, i])), r = x.raw;
    const open = x.items.filter(i => i.deadline && left(i.deadline) >= 0).length;
    const due = x.items.filter(i => i.deadline && left(i.deadline) >= 0 && left(i.deadline) <= 21).sort((a, b) => a.deadline.localeCompare(b.deadline));
    $('v-post').innerHTML = `
      <header class="post-head">
        <a class="back" href="#home">← WTO 식품 통보 브리프</a>
        <span class="kicker">${esc(x.badge)} · ${esc(x.label)}${x.edition ? ' · ' + esc(x.edition) : ''}</span>
        <h1>${esc(x.note.headline)}</h1>
        <p class="subtitle">${esc(x.note.subtitle)}</p>
        <div class="byline"><span class="avatar" aria-hidden="true">글</span><div><b>글로벌정보부</b><span class="num">${fd(x.published)} · ${readMin(x)}분 읽기</span></div></div>
      </header>
      <div class="prose">
        <p>${span(x)} WTO에 배포된 통보는 공동 통보를 하나로 셈하면 ${r.spsUnique + r.tbtUnique}건이었습니다. 이 가운데 SPS 통보 전부와 식품 관련 TBT 통보를 더해 <b>${x.items.length}건</b>을 살펴봤고, ${open ? `${open}건은 아직 의견을 낼 수 있습니다` : '의견 제출 기한이 남은 통보는 없습니다'}. 그중 눈여겨볼 흐름은 ${NUM[x.note.themes.length] || x.note.themes.length} 가지입니다.</p>
        ${x.note.themes.map(t => `<h2>${esc(t.title)}</h2><p>${esc(t.text)}</p><ul class="refs">${t.syms.map(s => map[s]).filter(Boolean).map(ref).join('')}</ul>`).join('')}
        ${due.length ? `<h2>의견 제출 기한이 다가오는 통보</h2><p>앞으로 3주 안에 마감되는 통보는 ${due.length}건이고, 가장 빠른 마감은 ${md(due[0].deadline)}입니다.</p><ul class="refs">${due.map(ref).join('')}</ul>` : ''}
        <p>나머지 통보는 <a href="#home" id="to-feed">이 호의 통보 목록</a>에서 분야·통보국별로 찾아볼 수 있습니다.</p>
      </div>
      <nav class="pager" aria-label="다른 호">
        ${(() => { const k = ISSUES.indexOf(x), older = ISSUES[k + 1], newer = ISSUES[k - 1];
          return (older ? `<a href="#${postId(older)}"><span>← 이전 호 · ${esc(older.badge)}</span><b>${esc(older.note.headline)}</b></a>` : '<span></span>') +
                 (newer ? `<a class="next" href="#${postId(newer)}"><span>다음 호 · ${esc(newer.badge)} →</span><b>${esc(newer.note.headline)}</b></a>` : '<span></span>'); })()}
      </nav>
      <p class="fine">국문 제목은 원제를 바탕으로 짧게 옮긴 참고용입니다. 규정의 법적 의미와 세부 기준은 원문으로 확인하세요. 출처: WTO ePing 통보 데이터(WTO API, ${fd(x.fetched)} 조회).</p>`;
    $('to-feed').onclick = () => { F = { q: '', group: '', member: '', open: false, marked: false, scope: x.id }; setTimeout(() => $('feed-top')?.scrollIntoView({ block: 'start' }), 40); };
  }

  function renderItem(x) {
    const home = x.issue, list = home.items, i = list.findIndex(y => y.sym === x.sym);
    const ins = issuesOf(x.sym);
    const prev = list[i - 1], next = list[i + 1];
    const fact = (k, v, full) => v ? `<div class="${full ? 'full' : ''}"><dt>${k}</dt><dd>${v}</dd></div>` : '';
    $('v-item').innerHTML = `
      <header class="post-head">
        <a class="back" href="#${postId(home)}">← ${esc(home.badge)}</a>
        <span class="kicker">${esc(x.member)} · ${esc(x.group)} · ${esc(x.topic)}</span>
        <h1 style="font-size:clamp(24px,5vw,32px)">${esc(x.ko)}</h1>
        <p class="subtitle" lang="en" style="font-size:15.5px">${esc(x.orig)}</p>
        <div class="byline"><span class="avatar" aria-hidden="true">${esc(x.area)}</span><div><b class="sym" style="font-size:13.5px">${esc(x.sym)}${x.more ? ' 외 ' + x.more + '건' : ''}</b><span class="num">배포 ${fd(x.date)} · ${esc(x.type)}</span></div><span class="sp"></span>
          <button type="button" class="ghost" id="it-mark" aria-pressed="${marks.has(x.sym)}">${BM_ICON}<span>${marks.has(x.sym) ? '저장됨' : '북마크'}</span></button></div>
      </header>
      <dl class="facts">
        ${fact('의견 제출 기한', x.deadline ? `${fd(x.deadline)}${left(x.deadline) >= 0 ? ` <span style="color:var(--${left(x.deadline) <= 14 ? 'warn' : 'ink-3'});font-size:13px">D-${left(x.deadline)}</span>` : ' (마감)'}` : '기재 없음')}
        ${fact('통보 유형', esc(x.type))}
        ${fact('실린 호', ins.map(j => `<a href="#${postId(j)}">${esc(j.badge)}</a>`).join(' · '))}
        ${fact('채택 예정', esc(x.adopt) || '기재 없음')}
        ${fact('시행 예정', esc(x.eif) || '기재 없음')}
        ${fact('대상 품목', esc(x.products) || '기재 없음', true)}
        ${x.hs ? fact('HS 코드', `<span class="num">${esc(x.hs)}</span>`, true) : ''}
        ${x.note ? fact('비고', esc(x.note), true) : ''}
      </dl>
      <section class="srcbox" aria-labelledby="h-src">
        <h2 id="h-src">통보 내용</h2>
        <span class="label">WTO ePing에 등록된 설명을 원문 그대로 옮겼습니다.</span>
        <blockquote lang="en">${esc(x.desc) || '설명이 등록되지 않았습니다.'}</blockquote>
      </section>
      <div class="actions"><a class="btn" href="${esc(x.link)}" target="_blank" rel="noopener">WTO 원문 열기</a></div>
      <nav class="pager" aria-label="다른 통보">
        ${prev ? `<a href="#${itemId(prev.sym)}"><span>← 이전 통보</span><b>${esc(prev.ko)}</b></a>` : '<span></span>'}
        ${next ? `<a class="next" href="#${itemId(next.sym)}"><span>다음 통보 →</span><b>${esc(next.ko)}</b></a>` : '<span></span>'}
      </nav>
      <p class="fine">국문 제목은 참고용입니다. 법적 의미와 세부 기준은 원문으로 확인하세요.</p>`;
    $('it-mark').onclick = () => { toggleMark(x.sym); renderItem(x); };
  }

  function syncBm() { $('bm-count').textContent = marks.size; $('bm-btn').setAttribute('aria-pressed', String(F.marked)); }
  $('bm-btn').onclick = () => { F.marked = !F.marked; if (location.hash && location.hash !== '#home') location.hash = 'home'; else { renderHome(); } syncBm(); setTimeout(() => $('feed')?.scrollIntoView({ block: 'start' }), 30); };

  function route() {
    const h = location.hash.slice(1);
    const post = ISSUES.find(i => postId(i) === h);
    const item = UNIQ.find(x => itemId(x.sym) === h);
    $('v-home').hidden = !!(post || item); $('v-post').hidden = !post; $('v-item').hidden = !item;
    if (post) { renderPost(post); document.title = post.note.headline + ' · WTO 식품 통보 브리프'; }
    else if (item) { renderItem(item); document.title = item.ko + ' · WTO 식품 통보 브리프'; }
    else { renderHome(); document.title = 'WTO 식품 통보 브리프'; if (F.scope !== ISSUE.id || F.q || F.group || F.member || F.open || F.marked) setTimeout(() => $('feed-top')?.scrollIntoView({ block: 'start' }), 30); }
    syncBm(); if (!(!post && !item && (F.scope !== ISSUE.id))) window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>

ic acids with 15 to 21 carbon atoms.5) Substances, articles and preparations containing medium-chain chlorinated paraffins6) Substances, articles and preparations containing chlorpyrifos7) Certain products containing mercury8) Plant protection products and9) FertilizerThe new regulations on firefighting foam concentrates, the regulation on packaging and labelling for partially halogenated unsaturated hydrofluorocarbons and the regulation on substances, articles and preparations containing perfluorooctane sulfonic acid and its derivatives are harmonizations with EU law. The regulation of substances, articles and preparations containing perfluorocarboxylic acids with 15 to 21 carbon atoms, the regulation of substances, articles and preparations containing medium-chain chlorinated paraffins and the regulation of substances, articles and preparations containing chlorpyrifos are based on a decision of the twelfth Conference of the Parties of the Stockholm Convention. The regulation on mercury is amended due to adjustments made in Annex A of the Minamata Convention on Mercury.The rules concerning fertilisers and plant protection products are only intended to permit the use of certain products and do not contain any trade restrictions. The proposed entry into force is the 1st of December 2026. However, depending on the product, different transition periods apply.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/CHL/572/Add.3", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-03-09", "member": "칠레", "type": "추가통보", "topic": "영양강화", "ko": "식품위생규칙 개정(유제품·밀가루·음료 등 비타민 D 강화) 공포 — 보건부령 29호", "orig": "MODIFICACIÓN DEL DECRETO SUPREMO N°977/96, MINISTERIO DE SALUD, REGLAMENTO SANITARIO DE LOS ALIMENTOS, TÍTULO VIII DE LAS LECHES Y PRODUCTOS LÁCTEOS, ARTÍCULO 203, TÍTULO XV DE LOS ALIMENTOS FARINÁCEOS PÁRRAFO II DE LAS HARINAS ARTÍCULO 350, TÍTULO XXVII DE LAS BEBIDAS ANALCOHÓLICAS, JUGOS DE FRUTA Y HORTALIZAS Y AGUAS ENVASADAS, PÁRRAFO I DE LAS BEBIDAS ANALCOHOLICAS ARTÍCULO 481 BIS (Amendment to Supreme Decree No. 977/96, Ministry of Health, Food Health Regulations, Section VIII Milk and milk products, Article 203; Section XV Farinaceous foods, Paragraph II Flours, Article 350; Section XXVI", "products": "Food fortification with vitamin D", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN21/CHL572A3.docx", "note": "", "desc": "The Republic of Chile hereby advises that Ministry of Health Decree No. 29, issued on 1 September 2023, superseding Ministry of Health Decree No. 48, issued on 11 May 2022, has been published.__________", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/EU/1196", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-03-09", "member": "유럽연합", "type": "정규통보", "topic": "식품안전 일반", "ko": "식품·사료 법령 간소화 규정안 — GM 미생물 이용 식품 법적 지위 명확화, 사료첨가물 허가 기간 무기한 등", "orig": "Proposal for a Regulation of the European Parliament and of the Council amending Regulations (EC) No 999/2001, (EC) No 1829/2003, (EC) No 1831/2003, (EC) No 852/2004, (EC) No 853/2004, (EC) No 396/2005, (EC) No 1099/2009, (EC) No 1107/2009, (EU) No 528/2012, (EU) 2017/625 as regards the simplification and strengthening of food and feed safety requirements (Text with EEA relevance) (COM(2025) 1030 finalProposal for a Regulation of the European Parliament and of the Council amending Regulation (EU) No 528/2012 as regards the extension of certain data protection periods (COM/2025/1020 final", "products": "This proposal amends a broad range of legislations with their various product coverages, as indicatively listed below:Food and feed obtained using genetically modified organisms, as covered by Regulation (EC) No 1829/2003.Preparations of a kind used in animal feeding, as covered by Regulation (EC) No 1831/2003.Live animals as covered by Regulation (EC) No 1099/2009.Live animals and certain commodi", "hs": "", "deadline": "2026-05-08", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/EU1196.docx", "note": "", "desc": "Regulation (EC) No 1829/2003: clarification of legal status of food and feed obtained using genetically modified microorganisms.Amendments to Regulation (EC) No 1831/2003: the draft act provides for 1) unlimited duration of authorisation of feed additives (except coccidiostats and histomonostats) accompanied by safety safeguards, 2) simplification and clarification of procedures for modification of feed additives authorisations and 3) allowing digital labelling of feed additives and premixtures for certain non-safety information.Regulation (EC) No 1099/2009: this part of the proposal removes the obligation in Article 18(4) of Regulation (EC) No 1099/2009 for Member States to submit a separate annual report on depopulation operations. Information on compliance with animal welfare requirements during depopulation activities will instead continue to be reported through the existing annual reports under Regulation (EU) 2017/625 on official controls.Amendment to Regulation (EC) No 999/2001: the proposal will make more flexible Regulation (EC) No 999/2001 to ensure that the control measures of that disease can be updated in a swifter and more proportionate manner to enable that it becomes more science-based and more aligned with the relevant Chapter 11.4 of the WOAH Terrestrial Code.Amendment to Regulation (EU) No 528/2012: The draft Proposal for a Regulation of the European Parliament and of the Council amending Regulation (EU) No 528/2012 proposes to extend the data protection of data of existing active substances still under evaluation in the review programme due to delays in the completion of the review programme, and also proposes a number of changes to lower administrative burden, including the possibility for certain active substances to have unlimited approval.Amendment to Regulation (EC) No 1107/2009: The draft Proposal for a Regulation of the European Parliament and of the Council amending Regulation (EC) No 1107/2009 proposes a number of changes to lower administrative burden and allow for faster market access, without reducing the existing protection standards for health and the environment. The proposal aims to accelerate access to innovative biocontrol solutions. This will be achieved by, among others, tackling procedural inefficiencies, defining biocontrol substances, allowing provisional authorisations of products containing biocontrol substances, and reallocating or increasing resources in Member State authorities and the European Food Safety Au", "adopt": "To be determined", "eif": "20 days from publication in the Official Journal of the EU"}, {"sym": "G/TBT/N/IDN/184/Add.1", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-03-09", "member": "인도네시아", "type": "추가통보", "topic": "할랄·표시", "ko": "비할랄 정보 표시 형식·절차 규정안 의견수렴 연장(2026.4.13까지)", "orig": "BPJPH Extends Comment for The Draft Regulation of the Halal Product Assurance Organizing Agency of the Republic of Indonesia Number … of … concerning the Form and Procedures for the Labelling of Non-Halal Information", "products": "Food, beverages, medicines, cosmetics, chemical products, biological products, genetically engineered products, as well as consumer goods that are worn, used, or otherwise utilized by the public and are subject to mandatory halal certification", "hs": "", "deadline": "2026-04-13", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/IDN184A1.docx", "note": "", "desc": "WTO Members and their stakeholders are asked to submit comments to Indonesia WTO TBT Enquiry Point by or before 4pm Jakarta Time (UTC+7) on 13 April 2026. Comments will be responded to if submitted prior to the final comment deadline.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/USA/922/Rev.2/Add.1", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-03-10", "member": "미국", "type": "추가통보", "topic": "품질규격", "ko": "남부 플로리다산·수입 아보카도 성숙도 요건 변경 최종규칙", "orig": "Avocados Grown in South Florida and Imported Avocados; Change in Maturity Requirements", "products": "Avocados; Fresh or dried avocados (HS code(s): 080440); Quality (ICS code(s): 03.120); Fruits. Vegetables (ICS code(s): 67.080)", "hs": "080440", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN14/USA922R2A1.docx", "note": "", "desc": "This final rule implements a recommendation from the Avocado Administrative Committee (Committee) to change the maturity requirements under the marketing order for avocados grown in South Florida. This action updates the avocado maturity shipping schedule to allow certain sizes and weights of the Beta avocado variety to be shipped earlier than is currently allowed. This action also makes a corresponding change to the avocado import regulation, as required under the Agricultural Marketing Agreement Act of 1937Effective 8 April 202691 Federal Register (FR) 11131, 9 March 2026; Title 7 Code of Federal Regulations (CFR) Parts 915 and 944 https://www.govinfo.gov/content/pkg/FR-2026-03-09/html/2026-04584.htm https://www.govinfo.gov/content/pkg/FR-2026-03-09/pdf/2026-04584.pdfThis final rule and the proposed rule notified as G/TBT/N/USA/922/Rev.2 are identified by Docket Number AMS-SC-23-0084. The Docket Folder is available on Regulations.gov at https://www.regulations.gov/docket/AMS-SC-23-0084/document and provides access to primary and supporting documents as well as comments received. Documents are also accessible from Regulations.gov by searching the Docket Number.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/TZA/1540", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-03-13", "member": "탄자니아", "type": "정규통보", "topic": "품질규격", "ko": "카리시 치즈 아프리카 지역표준(DARS 1038) 탄자니아 채택안", "orig": "DARS 1038:2025,Karish cheese — Specification, First edition", "products": "Cheese and curd (HS code(s): 0406); Cheese (ICS code(s): 67.100.30)", "hs": "0406", "deadline": "2026-05-12", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/TZA1540.docx", "note": "", "desc": "This Tanzania standard specifies requirements, sampling and test methods for cheeses in brine intended for direct consumption or for further processingNote: This Draft Tanzania Standard was also notified under SPS committee.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/USA/510/Add.3", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-03-13", "member": "미국", "type": "추가통보", "topic": "영양표시", "ko": "생육·가금육 주요 부위 영양표시 정보수집 승인 갱신 공고(FSIS)", "orig": "Notice of Request To Renew an Approved Information Collection: Nutrition Labeling of Major Cuts of Single-Ingredient Raw Meat or Poultry Products and Ground or Chopped Meat and Poultry Products>", "products": "Meat and poultry products, labeling (ICS: 67.120)", "hs": "020711, 020713, 020714, 020727", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN10/USA510A3.docx", "note": "", "desc": "In accordance with the Paperwork Reduction Act of 1995 and Office of Management and Budget (OMB) regulations, the Food Safety and Inspection Service (FSIS) is announcing its intention to request renewal of the approved information collection regarding nutrition labeling of the major cuts of single-ingredient raw meat or poultry products and ground or chopped meat and poultry products. There are no changes to the existing information collection. The approval for this information collection will expire on 31 July 2026.Submit comments on or before 11 May 2026.91 Federal Register (FR) 12133, 12 March 2026: https://www.govinfo.gov/content/pkg/FR-2026-03-12/html/2026-04820.htmhttps://www.govinfo.gov/content/pkg/FR-2026-03-12/pdf/2026-04820.pdfThis notice; request for comments is identified by Docket Number FSIS-2025-0344. The Docket Folder is available on Regulations.gov at https://www.regulations.gov/docket/FSIS-2025-0344/document and provides access to primary and supporting documents as well as comments received. Documents are also accessible from Regulations.gov by searching the Docket Number. WTO Members and their stakeholders are asked to submit comments to the USA TBT Enquiry Point. Comments received by the USA TBT Enquiry Point from WTO Members and their stakeholders by 4pmEastern Time on 11 May 2026 will be shared with CPSC and will also be submitted to the Docket on Regulations.gov if received within the comment period.Previous actions notified under the symbol G/TBT/N/USA/510 are identified by Docket Number FSIS-2005-0018; access to primary and supporting documents as well as comments received are available via this link. Documents are also accessible from Regulations.gov by searching the Docket Number.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/MMR/13", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-03-16", "member": "미얀마", "type": "정규통보", "topic": "등록·신고", "ko": "식품 제조업 전자신청 시스템 시행에 따른 권고", "orig": "Recommendation for Food Manufacturing", "products": "All pre-packaged food products (HS Code – 15 to 22)", "hs": "15, 16, 17, 18, 19, 20, 21, 22", "deadline": "2026-06-30", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/MMR13.docx", "note": "", "desc": "This notification is to inform WTO Members that, pursuant to Directive (1/2026) and in accordance with the implementation of the e-submission system under the Department of Food and Drug Administration of the Ministry of Health, food business operators are required to display the Food Product Code on the labels of all pre-packaged food products (HS Code 15–22). The Food Product Code shall be obtained through the online Food Product Notification system and may be presented on the product label by direct printing, sticker application, or QR code. This measure is introduced to enhance consumer verification, strengthen traceability and risk-based control, and facilitate market access and international trade. Non-compliance after the prescribed grace period of one year and six months will be subject to action in accordance with Section 31 of the National Food Law.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/IDN/185", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-03-18", "member": "인도네시아", "type": "정규통보", "topic": "수입식품 관리", "ko": "수출국 수산물 수출업자 등록 절차 고시(수산검역 차관 고시 2025년 13호)", "orig": "Decree of the Deputy of Fish Quarantine of the Indonesian Quarantine Authority Number 13 Year 2025 Concerning Procedures for Registration of Exporters from the Country of Origin", "products": "Fish and Fishery Products", "hs": "03", "deadline": "2026-05-17", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/IDN185.docx", "note": "", "desc": "The Decree of the Deputy of Fish Quarantine of the Indonesian Quarantine Authority Number 13 Year 2025 establishes the procedures for the registration of exporters from the country of origin intending to export fish and fishery products into Republic of Indonesia, as a pre-border measure risk control instrument to ensure fish health, biosecurity, traceability, and the safety and quality of fishery products. This regulation regulates the procedure or stages of registration, which include harmonization and bilateral communication with the Competent Authority of the exporting country, submission and evaluation of questionnaires (country and exporters), implementation of on-site audits, and review and determination of registration recommendations. It further sets out provisions concerning the addition of commodity scope, extension of registration validity, periodic monitoring and evaluation, as well as mechanisms for suspension or rejection in cases where minimum requirements are not fulfilled. Indonesian Quarantine Authority (IQA) will issue registration numbers to all exporters from the country of origin that comply with the quarantine import requirements for fish and fishery products as stipulated by Indonesia.In addition, IQA as the competent border authority in Indonesia, as mandated by Law Number 21 of 2019 concerning animal, fish and plant quarantine, and as the veterinary quarantine authority in accordance with Government Regulation Number 34 of 2024, IQA plays a significant role in the export, import, and inter-area movement of animal, fish, and plant commodities as well as in ensuring that products entering Indonesia are healthy and safe for human consumption.Concerning the entry into force of the provisions stipulated in this regulation, IQA grants a grace period of 12 (twelve) months, commencing from the date this regulation is notified to the TBT WTO Secretariat.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/KEN/2006", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-03-18", "member": "케냐", "type": "정규통보", "topic": "표시", "ko": "저탄소 차 생산·표시 요건 케냐 표준(KS 3049)", "orig": "KS 3049: 2026 Low Carbon Tea — Production and Labelling Requirements", "products": "Tea (ICS code(s): 67.140.10)", "hs": "", "deadline": "2026-05-17", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/KEN2006.docx", "note": "", "desc": "This standard specifies requirements for production, processing, blending, packaging, labelling and conformity assessment of low carbon tea. It applies to black, green, purple, white, oolong and other tea types obtained from Camellia sinensis, and to tea blends, intended for prepackaged retail or other channels. It excludes herbal infusions not derived from Camellia sinensis", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/KEN/2007", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-03-18", "member": "케냐", "type": "정규통보", "topic": "식품용 기구·포장", "ko": "차 포장·용기 케냐 표준(KS 1927)", "orig": "KS 1927: 2025 Tea packets and containers — Specification", "products": "Tea (ICS code(s): 67.140.10)", "hs": "", "deadline": "2026-05-17", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/KEN2007.docx", "note": "", "desc": "This Kenya Standard specifies the requirements and methods of test for tea packets and containers.This standard applies to tea packaging for retail in the form of tea bags, tea packets, instant tea and ready to drink tea containers. The standard does not cover tea sacks, which is covered by KS ISO 9884-1.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/MMR/13/Add.1", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-03-19", "member": "미얀마", "type": "추가통보", "topic": "표시", "ko": "제품 라벨의 식품 제품코드 표시 준수사항 고시", "orig": "Notification for Business Operators to Follow When Displaying the Food Product Code on Product Labels", "products": "All pre-packaged food products (HS Code – 15 to 22)", "hs": "15, 16, 17, 18, 19, 20, 21, 22", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/MMR13A1.docx", "note": "", "desc": "This notification is to inform WTO Members that, pursuant to Notification (1/2026) and in accordance with the implementation of the e-submission system under the Department of Food and Drug Administration of the Ministry of Health, food business operators are required to display the Food Product Code on the labels of all pre-packaged food products (HS Code 15–22). The Food Product Code shall be obtained through the online Food Product Notification system and may be presented on the product label by direct printing, sticker application, or QR code. This measure is introduced to enhance consumer verification, strengthen traceability and risk-based control, and facilitate market access and international trade. Non-compliance after the prescribed grace period of one year and six months will be subject to action in accordance with Section 31 of the National Food Law.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/MDA/60", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-03-20", "member": "몰도바", "type": "정규통보", "topic": "주류", "ko": "맥주·맥주 기반 음료 규정 정부결정(225호)", "orig": "Government Decision No. 225 of 23 April 2025 approving the Regulation on beer and beer-based beverages", "products": "- Other: (HS code(s): 22029); Beer made from malt. (HS code(s): 2203); Other fermented beverages (for example, cider, perry, mead, saké); mixtures of fermented beverages and mixtures of fermented beverages and non-alcoholic beverages, not elsewhere specified or included. (HS code(s): 2206), in particular Non-alcoholic beer (HS: 2202 9100), Beer made from malt (HS: 2203 00), Mixed beverages of beer", "hs": "22029, 2203, 2206", "deadline": "2026-03-20", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/MDA60.docx", "note": "", "desc": "The Regulation on beer and beer-based beverages establishes specific rules on the production, packaging, labelling, and marketing, as well as quality and safety requirements for beer and beer-based beverages.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/MDA/61", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-03-20", "member": "몰도바", "type": "정규통보", "topic": "주류", "ko": "맥주·와인 외 비증류 발효주(사과주 등) 생산 규정 정부결정(881호)", "orig": "Government Decision No. 881 of 23 December 2024 approving the Regulation on the production of undistilled fermented alcoholic beverages other than beer and wine", "products": "Other fermented beverages (for example, cider, perry, mead, saké); mixtures of fermented beverages and mixtures of fermented beverages and non-alcoholic beverages, not elsewhere specified or included. (HS code(s): 2206)", "hs": "2206", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/MDA61.docx", "note": "", "desc": "The Regulation on the production of undistilled fermented alcoholic beverages other than beer and wine establishes the general and specific conditions for the production, circulation, and ensuring the traceability, quality, and safety of cider, fruit wine, fruit alcoholic beverages, and fruit cocktails.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/TZA/1558", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-03-20", "member": "탄자니아", "type": "정규통보", "topic": "식품용 기구·포장", "ko": "식품·먹는물 접촉 PVC 구성성분 허용목록 탄자니아 표준안(2판)", "orig": "CDC 11 (3968) DTZS, Positive list of constituents of polyvinyl chloride (PVC) and its copolymer in contact with foodstuffs, pharmaceutical and drinking water, Second Edition", "products": "\"Polyvinyl chloride\", in primary forms, not mixed with any other substances (HS code(s): 390410); Materials and articles in contact with foodstuffs (ICS code(s): 67.250)", "hs": "390410", "deadline": "2026-05-19", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/TZA1558.docx", "note": "", "desc": "This Draft Tanzania Standard covers positive list of constituents of PVC, namely, the polymers, copolymers, manufacturing residues and necessary additives which may be regarded as safe for use, when properly processed in contact with food, pharmaceuticals and drinking water and when present in the prescribed limits of concentration. This positive list does not purport to establish the suitability of the ingredient singly in a particular foodstuff from other than toxicological considerations.", "adopt": "To be determined and notified", "eif": ""}, {"sym": "G/TBT/N/TZA/1559", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-03-20", "member": "탄자니아", "type": "정규통보", "topic": "식품용 기구·포장", "ko": "플라스틱 도마 탄자니아 표준안", "orig": "CDC 11 (3972) DTZS, Plastic cutting board — Specification, First Edition", "products": "Tableware and kitchenware, of plastics (HS code(s): 392410); Plants and equipment for the food industry (ICS code(s): 67.260)", "hs": "392410", "deadline": "2026-05-19", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/TZA1559.docx", "note": "", "desc": "This Draft Tanzania Standard specifies requirements, sampling and test methods for plastic cutting boards intended for general use in butcheries and household in handling of food products including meat, vegetables and bakery", "adopt": "To be determined and notified", "eif": ""}, {"sym": "G/TBT/N/CHN/2239", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-03-24", "member": "중국", "type": "정규통보", "topic": "수입식품 관리", "ko": "수입식품 수입·수출업자 명부관리 규정 개정안", "orig": "Regulations on the Listing Administration of Importers and Exporters of Imported Food (Revised Draft)", "products": "Food (HS code(s): 02; 03; 04; 07; 08; 09; 10; 11; 12; 15; 16; 17; 18; 19; 20; 21; 22); (ICS code(s): 67)", "hs": "02, 03, 04, 07, 08, 09, 10, 11, 12, 15, 16, 17, 18, 19, 20, 21, 22", "deadline": "2026-05-23", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/CHN2239.docx", "note": "", "desc": "To implement the relevant provisions of Article 96 of the Food Safety Law of the People's Republic of China, adapt to China's needs of expanding opening-up and the rapid growth of imported food trade, ensure the safety of imported food, promote trade facilitation, and further standardize the record-filing management of importers and exporters exporting food to China, the existing Regulations on the Listing Administration of Importers and Exporters of Imported Food (Annex 1 of Announcement No. 55 of 2012 of the former General Administration of Quality Supervision, Inspection and Quarantine) have been optimized and improved. The main revised contents include: 1. Following the principle of facilitation, simplifying the content to be filled in for record-filing, reducing the record-filing information items for overseas exporters or agents of imported food from 20 to 10. 2. Following the principle of unification, revising the scope of food applicable to these provisions to be consistent with the current registration categories of overseas manufacturers exporting food to China. 3. Following the principle of stable expectations, specifying a 3-working-day customs handling time limit for the record-filing of overseas exporters or agents of imported food formerly without a handling time limit. 4. Following the principle of supervision in accordance with the law, standardizing the measures for record-filing, modification and cancellation in accordance with the relevant provisions of the superior laws, and clarifying the requirements for supervision and verification.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/USA/2267", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-03-24", "member": "미국", "type": "정규통보", "topic": "유기식품", "ko": "유기농 허용·금지물질 목록(작물·축산) 개정안", "orig": "National Organic Program: National List of Allowed and Prohibited Substances per October 2021, October 2022, and October 2024 Recommendations (Crops and Livestock)", "products": "Organic crops and livestock; Pesticides and other agrochemicals (ICS code(s): 65.100); Processes in the food industry (ICS code(s): 67.020); Food products in general (ICS code(s): 67.040); Cereals, pulses and derived products (ICS code(s): 67.060); Fruits. Vegetables (ICS code(s): 67.080); Meat, meat products and other animal produce (ICS code(s): 67.120)", "hs": "", "deadline": "2026-05-22", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/USA2267.docx", "note": "", "desc": "Proposed rule - This proposed rule would amend the U.S. Department of Agriculture's (USDA) organic regulations related to organic crop and livestock production. The proposed rule would provide additional tools to organic producers, allowing carbon dioxide in organic crop production and meloxicam as a pain treatment in organic livestock production. Additionally, this rulemaking would remove overly burdensome restrictions for methionine, an amino acid, in organic poultry feed and would affirm that sodium nitrate may be used as a fertilizer in organic crop production, with certain conditions to protect soil quality.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/ARE/698", "more": 5, "area": "TBT", "group": "식품 TBT", "date": "2026-03-26", "member": "걸프 6개국 공동", "type": "정규통보", "topic": "품질규격", "ko": "무가당 연유(증발유) 걸프 표준안", "orig": "Evaporated Milk", "products": "Evaporated Milk ICS: 67.100", "hs": "0402", "deadline": "2026-05-25", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/ARE698.docx", "note": "공동 통보 번호: G/TBT/N/ARE/698, G/TBT/N/BHR/776, G/TBT/N/KWT/760, G/TBT/N/OMN/599, G/TBT/N/QAT/750, G/TBT/N/SAU/1433", "desc": "This standard applies to evaporated milk, intended for direct consumption or further processing.", "adopt": "", "eif": "Generally, six months after publication in the Official Gazette"}, {"sym": "G/TBT/N/ARE/699", "more": 5, "area": "TBT", "group": "식품 TBT", "date": "2026-03-26", "member": "걸프 6개국 공동", "type": "정규통보", "topic": "품질규격", "ko": "가당 연유 걸프 표준안", "orig": "Sweetened Condensed Milk", "products": "Sweetened Condensed Milk ICS: 67.100", "hs": "0402", "deadline": "2026-05-25", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/ARE699.docx", "note": "공동 통보 번호: G/TBT/N/ARE/699, G/TBT/N/BHR/777, G/TBT/N/KWT/761, G/TBT/N/OMN/600, G/TBT/N/QAT/751, G/TBT/N/SAU/1434", "desc": "This standard applies to sweetened condensed milk, intended for direct consumption or further processing.", "adopt": "", "eif": "Generally, six months after publication in the Official Gazette"}, {"sym": "G/TBT/N/KAZ/34", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-03-26", "member": "카자흐스탄", "type": "정규통보", "topic": "식품용 기구·포장", "ko": "유라시아경제연합 공통 위생요건 중 식품접촉 재질·기구 부분 개정안", "orig": "Draft Decision of the Collegium of the Eurasian Economic Commission on Amending Section 16 of Chapter II of the Common sanitary-epidemiological and hygienic requirements for products subject to sanitary-epidemiological supervision (control)", "products": "Materials and articles made from polymeric and other materials intended to come into contact with food products and food environments", "hs": "", "deadline": "2026-05-25", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/KAZ34.docx", "note": "", "desc": "The draft provides for updating Section 16 of Chapter II of the Common sanitary-epidemiological and hygienic requirements for products subject to sanitary-epidemiological supervision (control) concerning requirements for materials and articles made from polymeric and other materials intended to come into contact with food products and food environments.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/THA/604/Add.2", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-03-30", "member": "태국", "type": "추가통보", "topic": "식품용 기구·포장", "ko": "식품접촉용 종이 표준 의무적용 부령안 제1조 대체", "orig": "Draft Ministerial Regulation Prescribing Industrial Products for Paper for Food Contact to Conform to the Standard (No. …) B.E. …", "products": "Paper for food contact (ICS: 55.040, 85.080.90, 85.080.99)", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN21/THA604A2.docx", "note": "", "desc": "This addendum is to inform that Clause 1 of the Ministerial Regulation Prescribing Industrial Products for Paper for Food Contact to Conform to the Standard B.E. 2568 (2025) is repealed and replaced by the following:“Clause 1. This Ministerial Regulation shall enter into force on 22 June B.E. 2570 (2027).”This amendment aims to extend the date of entry into force in order to provide sufficient time for manufacturers, importers, and other stakeholders to prepare for compliance. This draft Ministerial Regulation is open for public consultation, with comments invited within 30 days from the date of notification.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/PHL/362", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-03-31", "member": "필리핀", "type": "정규통보", "topic": "등록·신고", "ko": "가공식품 전자등록(e-Services) 시스템 이용 지침(FDA 회람)", "orig": "Guidelines on the Use of Electronic Services (e-Services) System for the Registration of Processed Food Products Repealing, FDA Circular No. 2020-033 “Procedure for the Use of the Modified Electronic Registration System for Raw Materials and Prepackaged Processed Food Products”", "products": "Food technology (ICS code(s): 67)", "hs": "", "deadline": "2026-05-30", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/PHL362.docx", "note": "", "desc": "This Circular is issued to provide guidelines to Food Business Operators (FBOs) on the implementation and utilization of the new E-Services System for the electronic registration of processed food products. Specifically, it aims to: A. Upgrade the current system from Electronic Registration Portal to e-Services System, and B. Provide procedural guidelines on the application of CPR using the e-Serv system.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/PHL/363", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-03-31", "member": "필리핀", "type": "정규통보", "topic": "품질규격", "ko": "코덱스 과일주스·넥타 일반규격(CXS 247-2005) 기술규정 채택", "orig": "Adoption of Codex General Standard for Fruit Juices and Nectars (CXS 247-2005) as Technical Regulation", "products": "Food products in general (ICS code(s): 67.040)", "hs": "2009", "deadline": "2026-05-30", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/PHL363.docx", "note": "", "desc": "This Order aims to establish updated, science-based regulatory standards for fruit beverages that ensure product quality, safety, and consumer protection, in harmonization with international Codex standards and existing national food safety regulations.Specifically, it aims to:A. Revise and update the guidelines on the naming of fruit beverages by repealing Administrative Order No. 90-A, s. 1980, entitled “Naming of Fruit Beverages.”B. Establish standards, guidelines, and limits for composition and quality factors, food additives, processing aids, contaminants, hygiene, labeling, and methods of analysis and sampling, consistent with the revised Codex General Standard for Fruit Juices and Nectar.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/RWA/1373", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-03-31", "member": "르완다", "type": "정규통보", "topic": "품질규격", "ko": "즉석 강화 통옥수수가루 르완다 표준안(DRS 436)", "orig": "DRS 436: 2026, Instant fortified whole maize flour—Specification", "products": "Cereals, pulses and derived products (ICS code(s): 67.060)", "hs": "110220", "deadline": "2026-05-30", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/RWA1373.docx", "note": "", "desc": "This Draft Rwanda Standard specifies requirements, sampling and test methods for instant fortified whole maize flour intended for human consumption", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/ARM/65", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-02", "member": "아르메니아", "type": "정규통보", "topic": "수입위생요건", "ko": "유라시아경제연합 공통 수의요건 개정안 — 사슴과 동물 수입 시 만성소모성질병 청정 확인", "orig": "Draft Decisions of the Collegium of the Eurasian Economic Commission on Amendments to Common veterinary (sanitary and veterinary) requirements for goods subject to veterinary control (surveillance) and on Amendments to the Decision of the Commission of the Customs Union No. 607 of 7 April 2011", "products": "Goods (products) subject to veterinary control", "hs": "", "deadline": "2026-04-10", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NARM65.docx", "note": "", "desc": "The drafts complement the veterinary requirements of the EAEU by introducing confirmation of the well-being of the territory in part of chronic wasting disease (CWD) when importing animals of the deer family (Cervidae). They also set up veterinary requirements and a veterinary certificate form for non-human primates as laboratory animals.", "adopt": "To be determined.", "eif": "To be determined."}, {"sym": "G/SPS/N/SAU/614", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-02", "member": "사우디아라비아", "type": "긴급통보", "topic": "가금 수입제한(HPAI)", "ko": "프랑스 멘에루아르주산 가금육·계란 수입 일시 금지(긴급)", "orig": "Notice of Administration Order of Saudi Food and Drug Authority Ref. No. 36972 dated 1 March 2026 entitled “Temporary ban on importation of poultry meat, eggs and their products originating from Maine-et-Loire in France”", "products": "Poultry meat, eggs and their products", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NSAU614.docx", "note": "", "desc": "Following the WOAH report dated 19 February 2026, a Highly pathogenic avian influenza (HPAI) virus outbreak has occurred in Maine-et-Loire in France. In compliance with the World Organisation for Animal Health (WOAH), Terrestrial Animal Health Code Chapter 10.4, it is deemed necessary for the Kingdom of Saudi Arabia to prevent the entry of the HPAI virus into the country. Therefore, the import of poultry meat, eggs and their products from Maine-et-Loire in France to the Kingdom of Saudi Arabia is temporarily suspended (with the exception of processed poultry meat and egg products exposed to either heat or other treatments that ensure deactivation of the HPAI virus, as long as it conforms with the approved health requirements, and standards, with a health certificate issued by the official bodies in France prove that the product is free from the virus).", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/CHL/877", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-03", "member": "칠레", "type": "정규통보", "topic": "사료", "ko": "사료 규정(농업부 시행령 2016년 제4호) 개정안", "orig": "Amending Ministry of Agriculture Decree No. 4, of 2016, approving animal feed regulations.", "products": "Animal feed", "hs": "2309", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCHL877.docx", "note": "", "desc": "The notified draft measure notifies the update to the designated Decree, relating to animal feed controls. Some of the amendments include:• Incorporating new definitions;• Stipulating that establishments that sell pet food must notify SAG of their activity;• Updating the system for granting producers an official number and authorization;• Allowing the handling of bulk products;• Relaxing some aspects of the imported products authorization, as well as amending these authorizations.Further details can be found in the document attached hereto.", "adopt": "Six months after publication in the Official Journal", "eif": ""}, {"sym": "G/SPS/N/JPN/1393", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-03", "member": "일본", "type": "긴급통보", "topic": "구제역", "ko": "키프로스산 생유·비가열 유제품 수입 중단(긴급)", "orig": "Import suspension of raw milk and/or un-heated/un-treated milk products from Cyprus", "products": "Raw milk and/or un-heated/un-treated milk products", "hs": "04", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NJPN1393.docx", "note": "", "desc": "In order to prevent the introduction of foot and mouth disease (FMD) virus into Japan, MAFF has suspended the import of raw milk and/or un-heated/un-treated milk products from Cyprus, including those shipped through third countries, on 21 February 2026 based on the \"Animal Health Requirements for raw milk and/or milk products to be exported to Japan from Listed countries\" and the Articles 37 and 44 of the \"Act on Domestic Animal Infectious Disease Control\".Importation of cloven-hoofed animals and products derived from cloven-hoofed animals other than milk and milk products, as well as straw and forage for feed from Cyprus have been prohibited under the Act on Domestic Animal Infectious Diseases Control. Therefore, only raw milk and un-heated/un-treated milk products are subject to the import suspension due to FMD outbreak.This is to inform that MAFF has removed Cyprus from the listed countries.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/MYS/20/Rev.1", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-03", "member": "말레이시아", "type": "개정통보", "topic": "수입검역", "ko": "활어 수입 절차 개정", "orig": "Update of the import protocol for live fish into Malaysia (Revision to G/SPS/N/MYS/20)", "products": "Import condition oflivefish (excluding ornamental fish)", "hs": "", "deadline": "2026-05-02", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NMYS20R1.docx", "note": "", "desc": "The Department of Fisheries Malaysia, according to Section 40 on Control of Live Fish, Fisheries Act 1985 (Act 317), has reviewed the notification of G/SPS/N/MYS/20* (6 July 2009).This amendment accounts for the reclassification and consolidation of species within their respective commodity groups. Furthermore, it incorporates requirements for disease analysis, biosecurity risks, and the specific purpose of exportation to Malaysia. The purpose of this notification is to inform all countries on the updated protocol for the importation of:Live Fish for Human Consumption;Live Fish Broodstock;Live Freshwater Fish Fry;Live Marine Fish Fry;Live Crustacea Broodstock;Live Crustacea Fry;Live Mollusc;Live Invertebrate;Live Aquatic Plant.The risk assessment and quarantine requirements for imported live aquatic animals are as follows:Live Fish for Human Consumption (i): The quarantine requirement is determined by the end-use of the consignment. Shipments designated for direct delivery to restaurants for immediate preparation are exempted from quarantine.Other Commodities (ii-ix): The importation risk and mandatory quarantine period are based on a comprehensive assessment that considers the susceptibility of the species, diseases listed as notifiable by the World Organisation for Animal Health (WOAH), and other critical biosecurity risks.The main content of the protocol are as follows:Import Conditions Prior to Arrival in Malaysia;Animal Health Certification Requirements for the Import of Live Fish into Malaysia;Import Conditions on Arrival in Malaysian Territory.This import protocol mandates that all importers adhere to the stipulated conditions prior to consignment arrival, meet all health certification standards, and comply with all procedures upon arrival in Malaysia, as outlined in Annex I.* Notes: According to Fisheries Act 1985, “Fish” means any aquatic animal or plant life, sedentary or not, and includes all species of finfish, crustacea, mollusca, aquatic mammals, or their eggs or spawn, fry, fingerling, spat or young, but does not include any species of otters, turtles or their eggs.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/MYS/26/Rev.1", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-03", "member": "말레이시아", "type": "개정통보", "topic": "수입검역", "ko": "관상용 담수·해수어·갑각류 수입 절차 개정", "orig": "Update of the import protocol for live freshwater ornamental fish, live marine ornamental fish and ornamental crustacea (revision to G/SPS/N/MYS/26)", "products": "Liveornamental aquatic animals", "hs": "", "deadline": "2026-05-02", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NMYS26R1.docx", "note": "", "desc": "The Department of Fisheries Malaysia, according to the Section 40 on Control of Live Fish, Fisheries Act 1985 (Act 317) has reviewed the notification of G/SPS/N/MYS/26 (7 January 2011). This amendment accounts for the reclassification and consolidation of species within their respective commodity groups. Furthermore, it incorporates requirements for disease analysis, biosecurity risks, and the specific purpose of exportation to Malaysia. The purpose of this notification is to inform all countries on the updated protocol for the importation of:Live Freshwater Ornamental Fish;Live Marine Ornamental Fish; and Live Ornamental Crustacea.Freshwater and marine ornamental fish exhibit distinct profiles of disease susceptibility due to fundamental differences in their aquatic environments. These differences, particularly in water chemistry and ecology, directly influence pathogen viability, transmission, and host-pathogen interactions.The main content of the protocols are as follows:Import Conditions Prior to Arrival in Malaysia;Animal Health Certification Requirements for the Import of Live Ornamental Fish into Malaysia;Import Conditions on Arrival in Malaysian Territory.This import protocol mandates that all importers adhere to the stipulated conditions prior to consignment arrival, meet all health certification standards, and comply with all procedures upon arrival in Malaysia, as outlined in Annex I.According to Fisheries Act 1985, “Fish” means any aquatic animal or plant life, sedentary or not, and includes all species of finfish, crustacea, mollusca, aquatic mammals, or their eggs or spawn, fry, fingerling, spat or young, but does not include any species of otters, turtles or their eggs.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/JPN/1378/Add.1", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-04", "member": "일본", "type": "추가통보", "topic": "수생동물 질병", "ko": "수산자원보호법 시행령 개정 — 수입검역 대상 질병·동물 추가", "orig": "Notification of revision of the Enforcement Ordinance of the Act on the Protection of Fishery Resources", "products": "Live crustaceans limited to Penaeidae and Palaemonidae, and live molluscs limited to Haliotis rubra and Haliotis laevigata, and their aquatic animal products for aquaculture", "hs": "0306, 030791", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NJPN1378A1.docx", "note": "", "desc": "MAFF proposed revision of the Enforcement Ordinance of the Act on the Protection of Fishery Resources to add a disease and target animals subject to import quarantine (for aquaculture) in the notification G/SPS/N/JPN/1378 (dated 10 December 2025). The revision of the Enforcement Ordinance of the Act on the Protection of Fishery Resources will be published on 9 March 2026 and enter into force on 9 June 2026. Bilateral consultations with countries that have exported to Japan the crustaceans for aquaculture, which are subject to import quarantine as targeted aquatic animals, have confirmed that three months would be sufficient for the exporting countries to adapt to the revised health requirements.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/CAN/1634", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-05", "member": "캐나다", "type": "정규통보", "topic": "수생동물 질병", "ko": "수생동물 감수성 종 목록 개정 의견수렴", "orig": "Susceptible Species of Aquatic Animals List", "products": "Susceptible species of aquatic animals", "hs": "03", "deadline": "2026-05-04", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCAN1634.docx", "note": "", "desc": "Canada is seeking comments on the Susceptible Species of Aquatic Animals List (SSL) to add or remove species as well as change the diseases of concern associated with species currently on the SSL. These updates are to align with changes to the species listed in the disease specific chapters of the World Organisation for Animal Health (WOAH) Aquatic Animal Health Code.Canada will be removingthe disease Bonamia ostreaefrom the following species and removing the species from the SSLOstrea lutaria. Canada will be removingthe disease Bonamia exitiosafrom the following species and removing the species from the SSLSaccostrea glomerataCanada will be adding the disease Bonamia exitiosato the following species and adding the species to the SSLOstrea equestris;Ostrea lurida.Canada will be removing the disease Bonamia exitiosato the following species:Crassostrea gigas.Canada will be adding the disease Bonamia exitiosato the following species:Magallana ariakensis;Ostrea puelchana.Canada will be removingthe diseasesAbalone herpesvirus and Xenohaliotis californiensisfrom the following species and removing the species from the SSLHaliotis discus hannai.Canada will be removingthe diseaseMarteilia refringensfrom the following species and removing the species from the SSLOstrea denselamellosa.Canada will be addthe diseaseMarteilia refringensfrom the following species and add the species from the SSLOstrea stentinaXenostrobus securesCanada will be removingthe diseaseMarteilia refringensfrom the following species:Ostrea angasi;Ostrea chilensis;Ostrea puelchana.Canada will be adding the disease Xenohaliotis californiensisto the following species and adding the species to the SSLHaliotis discus discus.Canada will be removing the disease Xenohaliotis californiensisto the following species and removing the species from the SSLHaliotis wallalensis.Canada will also make changes to the susceptibility for the following non-WOAH listed diseases.Canada will be adding the disease Haplosporidium nelsonito the following species and adding the species to the SSLMizuhopecten yessoensis.Canada will be adding the disease Mikrocytos mackinito the following species and adding the species to the SSLMagallana sikamea.Import permit and zoosanitary export certification may be required for export to Canada of species on the SSL. Therefore, it is the responsibility of the certifying official in the exporting country to refer to Canada's SSL to review the diseases of concern for the species presented f", "adopt": "When the final changes are published on the Government of Canada website. To be determined.", "eif": "To be determined."}, {"sym": "G/SPS/N/EU/926", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-05", "member": "유럽연합", "type": "정규통보", "topic": "사료첨가물", "ko": "사료첨가물 티아민염산염·질산티아민 허가 갱신", "orig": "Commission Implementing Regulation (EU) 2026/460 of 26 February 2026 concerning the renewal of the authorisation of thiamine hydrochloride and thiamine mononitrate as feed additives for all animal species and repealing Implementing Regulation (EU) 2015/897 (Text with EEA relevance)", "products": "Preparations of a kind used in animal feeding (HS code(s): 2309)", "hs": "2309", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEU926.docx", "note": "", "desc": "The substances covered by the Act were authorised for a period of 10 years as feed additives for all animal species in the additive category ‘nutritional additives’ and in the functional group ‘vitamins, pro-vitamins and chemically well-defined substances having similar effect’. An application was submitted for the renewal of the authorisation of these substances in accordance with article 14 of Regulation (EC) No 1831/2003. Based on the favourable conclusions of a scientific assessment of the dossier submitted by the applicant, conducted by the European Food Safety Authority (EFSA), the authorisation of these substances as feed additives for all animal species is renewed under certain conditions detailed in the Annex to the Act. A transitional period is included for the interested parties to meet the new authorisation’s requirements.", "adopt": "", "eif": "This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union."}, {"sym": "G/SPS/N/RUS/351", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-05", "member": "러시아", "type": "긴급통보", "topic": "구제역", "ko": "키프로스산 구제역 감수성 동물·제품 수입·경유 일시 제한(긴급)", "orig": "Letter of the Federal Service for Veterinary and Phytosanitary Surveillance as of 26 February 2026 No. FS-ARe-7/7048-3", "products": "Animals susceptible to foot-and-mouth disease and products derived thereof (HS code(s): 0102; 0103; 010613; 0201; 0202; 0203; 0204; 0205; 0206; 0209; 0210; 04; 051110; 051199; 2309; 430180; 430190; 430390; 843680; 970529)", "hs": "0102, 430390, 430190, 430180, 2309, 051199, 051110, 04, 0210, 0209, 0206, 0205, 0204, 0203, 0202, 0201, 010613, 0103, 843680, 970529", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NRUS351.docx", "note": "", "desc": "This letter introduces temporary restrictions on the imports of certain animals susceptible to foot-and-mouth disease and products derived thereof, as well as on the transit of animals susceptible to foot-and-mouth disease from Cyprus to the territory of the Russian Federation due to the deterioration of foot-and-mouth disease epizootic situation in the country indicated.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/RUS/352", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-05", "member": "러시아", "type": "긴급통보", "topic": "블루텅", "ko": "아일랜드산 소·양 관련 제품 수입 및 블루텅 감수성 동물 경유 일시 제한(긴급)", "orig": "Letter of the Federal Service for Veterinary and Phytosanitary Surveillance No. FS-ARe-7/6962-3 as of 29 January 2026", "products": "Cattle; small cattle; wild, zoo and circus animals susceptible to bluetongue, camels and other members of the camel family; sperm of bulls, sheep and goat-producers; cattle and small cattle embryos; meat of wild small ruminants (HS code(s): 0102; 0104; 0106; 051199)", "hs": "0102, 0104, 0106, 051199", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NRUS352.docx", "note": "", "desc": "This letter introduces temporary restrictions on the imports of products mentioned in point 3 to the Russian Federation, as well as on the transit of cattle, small cattle and animals susceptible to bluetongue through the territory of the Russian Federation from Ireland due to the registration of bluetongue disease outbreaks.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/EU/927", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-06", "member": "유럽연합", "type": "정규통보", "topic": "사료첨가물", "ko": "사료첨가물 L-히스티딘 신규 허가", "orig": "Commission Implementing Regulation (EU) 2026/353 of 18 February 2026 concerning the authorisation of L-histidine and L-histidine monohydrochloride monohydrate, produced with Corynebacterium glutamicum KCCM 80389 as feed additives for all animal species (Text with EEA relevance)", "products": "Preparations of a kind used in animal feeding (HS code(s): 2309)", "hs": "2309", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEU927.docx", "note": "", "desc": "This Regulation authorises for the first time in the European Union and for a period of ten years L-histidine and L-histidine monohydrochloride monohydrate, produced with Corynebacterium glutamicum KCCM 80389 as feed additives belonging to the additive category ‘nutritional additives’ and in the functional group ‘amino acids, their salts and analogues’. This authorisation is based on the favourable conclusions of a scientific assessment of the dossier submitted by the applicant, conducted by the European Food Safety Authority (EFSA). The terms of the authorisation are detailed in the Annex to the Act.", "adopt": "", "eif": "This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union."}, {"sym": "G/SPS/N/EU/928", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-06", "member": "유럽연합", "type": "정규통보", "topic": "사료첨가물", "ko": "사료첨가물 락티카세이바실루스 휠젠베르겐시스 제제 신규 허가", "orig": "Commission Implementing Regulation (EU) 2026/348 of 17 February 2026 concerning the authorisation of a preparation of Lacticaseibacillus huelsenbergensis DSM 115424 as a feed additive for all animal species (Text with EEA relevance)", "products": "Preparations of a kind used in animal feeding (HS code(s): 2309)", "hs": "2309", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEU928.docx", "note": "", "desc": "This Regulation authorises for the first time in the European Union and for a period of ten years a preparation of Lacticaseibacillus huelsenbergensis DSM 115424 as a feed additive belonging to the category ‘technological additives’ and in the functional group ‘silage additives’. This authorisation is based on the favourable conclusions of a scientific assessment of the dossier submitted by the applicant, conducted by the European Food Safety Authority (EFSA). The terms of the authorisation are detailed in the Annex to the Act.", "adopt": "", "eif": "This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union."}, {"sym": "G/SPS/N/EU/929", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-06", "member": "유럽연합", "type": "정규통보", "topic": "사료첨가물", "ko": "사료첨가물 L-아르기닌 신규 허가", "orig": "Commission Implementing Regulation (EU) 2026/352 of 18 February 2026 concerning the authorisation of L-arginine produced with Escherichia coli CCTCC M 20231961 as a feed additive for all animal species (Text with EEA relevance)", "products": "Preparations of a kind used in animal feeding (HS code(s): 2309)", "hs": "2309", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEU929.docx", "note": "", "desc": "This Regulation authorises for the first time in the European Union and for a period of ten years L-arginine produced with Escherichia coli CCTCC M 20231961 as a feed additive belonging to the additive category ‘nutritional additives’ and in the functional group ‘amino acids, their salts and analogues’. This authorisation is based on the favourable conclusions of a scientific assessment of the dossier submitted by the applicant, conducted by the European Food Safety Authority (EFSA). The terms of the authorisation are detailed in the Annex to the Act.", "adopt": "", "eif": "This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union."}, {"sym": "G/SPS/N/USA/3561", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-06", "member": "미국", "type": "정규통보", "topic": "사료첨가물", "ko": "산란·종계용 사료 크롬 프로피오네이트 사용 허용 청원 접수(Kemin)", "orig": "Kemin Industries, Inc.; Filing of Food Additive Petition (Animal Use); Notification of Petition", "products": "Preparations of a kind used in animal feeding (HS code(s): 2309); Food technology (ICS code(s): 67)", "hs": "2309", "deadline": "2026-04-03", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NUSA3561.docx", "note": "", "desc": "The Food and Drug Administration (FDA or we) is announcing that we have filed a food additive petition, submitted by Kemin Industries, Inc., proposing that we amend our food additive regulations to provide for the safe use of chromium propionate as a source of chromium in food for layer and breeding chickens. The food additive petition was filed on 7 February 2026.", "adopt": "Not applicable", "eif": "Not applicable"}, {"sym": "G/SPS/N/USA/3562", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-06", "member": "미국", "type": "정규통보", "topic": "사료첨가물", "ko": "반려동물 사료 착색료 자구아(제니핀-글리신) 블루 허용 청원 접수", "orig": "Ecoflora Cares; Filing of Color Additive Petition; Notification of Petition", "products": "Preparations of a kind used in animal feeding (HS code(s): 2309); Food technology (ICS code(s): 67)", "hs": "2309", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NUSA3562.docx", "note": "", "desc": "The Food and Drug Administration (FDA or we) is announcing that we have filed a petition, submitted by Ecoflora Cares, c/o Exponent, Inc., proposing that we amend our color additive regulations to provide for the safe use of jagua (genipin-glycine) blue as a color additive in pet foods at levels consistent with good manufacturing practice. The color additive petition was filed on 24 February 2026.", "adopt": "Not applicable", "eif": "Not applicable"}, {"sym": "G/SPS/N/CHL/859/Add.1", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-10", "member": "칠레", "type": "추가통보", "topic": "수입검역", "ko": "일부 동물 수입 후 격리검역 면제 결의 공포(공포 30일 후 시행)", "orig": "Resolución Exenta No 1462/2026 que \"Exime del requisito de cuarentena de post ingreso en Chile a los animales que se indican, y modifica las resoluciones No 5066/2018, 54/1999, 809/2003, 692/2019 y 436/2020\" (Exempt Resolution No. 1462/2026 exempting certain animals from the requirement for post-entry quarantine in Chile and amending Resolutions No. 5066/2018, No. 54/1999, No. 809/2003, No. 692/2019 and No. 436/2020)Chile hereby advises that Exempt Resolution No. 1462/2026 exempting certain animals from the requirement for post-entry quarantine in Chile and amending Resolutions No. 5066/2018, ", "products": "Certain animal species (dogs, cats, ferrets, amphibians, reptiles, animals of the order Rodentia, hedgehogs and rabbits)", "hs": "010614, 010619, 010620", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCHL859A1.docx", "note": "", "desc": "Resolución Exenta No 1462/2026 que \"Exime del requisito de cuarentena de post ingreso en Chile a los animales que se indican, y modifica las resoluciones No 5066/2018, 54/1999, 809/2003, 692/2019 y 436/2020\" (Exempt Resolution No. 1462/2026 exempting certain animals from the requirement for post-entry quarantine in Chile and amending Resolutions No. 5066/2018, No. 54/1999, No. 809/2003, No. 692/2019 and No. 436/2020)Chile hereby advises that Exempt Resolution No. 1462/2026 exempting certain animals from the requirement for post-entry quarantine in Chile and amending Resolutions No. 5066/2018, No. 54/1999, No. 809/2003, No. 692/2019 and No. 436/2020, was published in the Official Journal on 9 March 2026 and will enter into force 30 days from that date.https://members.wto.org/crnattachments/2026/SPS/CHL/26_01371_00_s.pdf", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/TZA/517", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-13", "member": "탄자니아", "type": "정규통보", "topic": "축산", "ko": "초생추(하루 된 병아리) 탄자니아 표준안", "orig": "AFDC 31 (3448) DTZS, Day-old chicks — Specifications, First Edition", "products": "Live animals (excl. horses, asses, mules, hinnies, bovine animals, swine, sheep, goats, poultry, fish, crustaceans, molluscs and other aquatic invertebrates, and microorganic cultures etc.) (HS code(s): 0106); Animal husbandry and breeding (ICS code(s): 65.020.30)", "hs": "0106", "deadline": "2026-05-12", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTZA517.docx", "note": "같은 표준안을 TBT로도 통보(G/TBT/N/TZA/1533)", "desc": "This Tanzania standard specifies requirements, sampling and test methods for day-old chicks intended for use as layers and broilers. It excludes day-old chicks from other domesticated poultry.Note: This Draft Tanzania Standard was also notified under TBT Committee.", "adopt": "To be determined and notified.", "eif": "To be determined."}, {"sym": "G/SPS/N/MYS/20/Rev.2", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-16", "member": "말레이시아", "type": "개정통보", "topic": "수입검역", "ko": "활어 수입 절차 개정(2차)", "orig": "Update of the import protocol for live fish into Malaysia (Revision to G/SPS/N/MYS/20)", "products": "Import condition oflivefish (excluding ornamental fish)", "hs": "", "deadline": "2026-05-15", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NMYS20R2.docx", "note": "", "desc": "The Department of Fisheries Malaysia, according to Section 40 on Control of Live Fish, Fisheries Act 1985 (Act 317), has reviewed the notification of G/SPS/N/MYS/20* (6 July 2009).This amendment accounts for the reclassification and consolidation of species within their respective commodity groups. Furthermore, it incorporates requirements for disease analysis, biosecurity risks, and the specific purpose of exportation to Malaysia. The purpose of this notification is to inform all countries on the updated protocol for the importation of:Live Fish for Human Consumption;Live Fish Broodstock;Live Freshwater Fish Fry;Live Marine Fish Fry;Live Crustaceans Broodstock;Live Crustaceans Fry;Live Mollusca;Live Invertebrates;Live Aquatic Plant.The risk assessment and quarantine requirements for imported live aquatic animals are as follows:Live Fish for Human Consumption (i): The quarantine requirement is determined by the end-use of the consignment. Shipments designated for direct delivery to restaurants for immediate preparation are exempted from quarantine;Other Commodities (ii-ix): The importation risk and mandatory quarantine period are based on a comprehensive assessment that considers the susceptibility of the species, diseases listed as notifiable by the World Organisation for Animal Health (WOAH), and other critical biosecurity risks.The main content of the protocol is as follows:Import Conditions Prior to Arrival in Malaysia;Animal Health Certification Requirements for the Import of Live Fish into Malaysia;Import Conditions on Arrival in Malaysian Territory.This import protocol mandates that all importers adhere to the stipulated conditions prior to consignment arrival, meet all health certification standards, and comply with all procedures upon arrival in Malaysia, as outlined in Annex I.* Notes: According to Fisheries Act 1985, “Fish” means any aquatic animal or plant life, sedentary or not, and includes all species of finfish, crustacea, mollusca, aquatic mammals, or their eggs or spawn, fry, fingerling, spat or young, but does not include any species of otters, turtles or their eggs.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/MYS/26/Rev.2", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-16", "member": "말레이시아", "type": "개정통보", "topic": "수입검역", "ko": "관상용 담수·해수어·갑각류 수입 절차 개정(2차)", "orig": "Update of the import protocol for live freshwater ornamental fish, live marine ornamental fish and ornamental crustaceans (revision to G/SPS/N/MYS/26)", "products": "Liveornamental aquatic animals", "hs": "", "deadline": "2026-05-15", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NMYS26R2.docx", "note": "", "desc": "The Department of Fisheries Malaysia, according to the Section 40 on Control of Live Fish, Fisheries Act 1985 (Act 317) has reviewed the notification of G/SPS/N/MYS/26 (7 January 2011). This amendment accounts for the reclassification and consolidation of species within their respective commodity groups. Furthermore, it incorporates requirements for disease analysis, biosecurity risks, and the specific purpose of exportation to Malaysia. The purpose of this notification is to inform all countries on the updated protocol for the importation of:Live Freshwater Ornamental Fish;Live Marine Ornamental Fish; and Live Ornamental Crustaceans.Freshwater and marine ornamental fish exhibit distinct profiles of disease susceptibility due to fundamental differences in their aquatic environments. These differences, particularly in water chemistry and ecology, directly influence pathogen viability, transmission, and host-pathogen interactions.The main content of the protocols is as follows:Import Conditions Prior to Arrival in Malaysia;Animal Health Certification Requirements for the Import of Live Ornamental Fish into Malaysia;Import Conditions on Arrival in Malaysian Territory.This import protocol mandates that all importers adhere to the stipulated conditions prior to consignment arrival, meet all health certification standards, and comply with all procedures upon arrival in Malaysia, as outlined in Annex I.According to Fisheries Act 1985, “Fish” means any aquatic animal or plant life, sedentary or not, and includes all species of finfish, crustacea, mollusca, aquatic mammals, or their eggs or spawn, fry, fingerling, spat or young, but does not include any species of otters, turtles or their eggs.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/MYS/72/Rev.1", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-16", "member": "말레이시아", "type": "개정통보", "topic": "수입검역", "ko": "활새우(어미새우·후기유생) 수출 해외 부화장 생물안전 현지 점검 시행", "orig": "The notice of the implementation of biosecurity inspection at foreign hatcheries that wish to export live shrimp (including Broodstock and Postlarvae) to Malaysia", "products": "Live shrimp (including Broodstock and Postlarvae)", "hs": "", "deadline": "2026-05-15", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NMYS72R1.docx", "note": "", "desc": "The Department of Fisheries Malaysia (DoF) intends to implement biosecurity inspection and verification visits at foreign hatcheries that wish to export live shrimp (including broodstock and post-larvae) to Malaysia. This measure is introduced to strengthen assurance of compliance with Malaysia’s aquatic animal health and biosecurity requirements, and to prevent the introduction of serious transboundary aquatic animal diseases, in alignment with the World Organisation for Animal Health (WOAH) Aquatic Animal Health Code. The inspection will be conducted on a risk-based and transparent basis, in consultation with the competent authority of the exporting country, and consistent with the principles of equivalence and mutual recognition under the WTO Agreement on the Application of Sanitary and Phytosanitary Measures (SPS Agreement).", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/TZA/518", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-16", "member": "탄자니아", "type": "정규통보", "topic": "축산", "ko": "종모우 동결정액 탄자니아 표준안", "orig": "AFDC 31 (3447) DTZS, Frozen semen from breeding bull — Specifications, First Edition", "products": "Bovine semen (HS code(s): 051110); Animal husbandry and breeding (ICS code(s): 65.020.30)", "hs": "051110", "deadline": "2026-05-15", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTZA518.docx", "note": "같은 표준안을 TBT로도 통보(G/TBT/N/TZA/1534)", "desc": "This Tanzania standard specifies technical, biological and veterinary requirements applicable to frozen semen from breeding bulls. It also provides guidelines for transportation of semen. This standard excludes frozen semen from other domesticated animals.Note: This Draft Tanzania Standard was also notified under TBT Committee.", "adopt": "To be determined and notified.", "eif": "To be determined."}, {"sym": "G/SPS/N/ZAF/90", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-16", "member": "남아프리카공화국", "type": "정규통보", "topic": "반려동물", "ko": "남아프리카공화국 수출용 개 수의위생증명서", "orig": "Veterinary Health Certificate in Respects of Dogs for Export to the Republic of South Africa", "products": "Live domestic dogs", "hs": "01, 010619", "deadline": "2026-05-15", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NZAF90.docx", "note": "", "desc": "Due to international changes in the availability of reagent for the Babesia gibsoni Immunofluorescence Antibody Test (IFAT) and the Brucella canis disease status in several countries, South Africa has revised the import conditions for domestic dogs with regards to the testing requirements and certification for these diseases.", "adopt": "Sixty days from the date of circulation.", "eif": "Sixty days from the date of circulation, the veterinary health certificate will be implemented."}, {"sym": "G/SPS/N/EU/886/Add.1", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-17", "member": "유럽연합", "type": "추가통보", "topic": "사료첨가물", "ko": "개·고양이용 우엉 추출물 사료첨가물 허가 거부 채택 — 시행규정 (EU) 2026/548", "orig": "Denial of authorisation of great burdock extract from Arctium lappa L. as a feed additive for cats and dogs", "products": "Preparations of a kind used in animal feeding (HS code(s): 2309)", "hs": "2309", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEU886A1.docx", "note": "", "desc": "The proposal notified in G/SPS/N/EU/886 (19 September 2025) is now adopted by Commission Implementing Regulation (EU) 2026/548 of 13 March 2026 concerning the denial of authorisation of great burdock extract from Arctium lappa L. as a feed additive for cats and dogs (Text with EEA relevance).This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/EU/887/Add.1", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-17", "member": "유럽연합", "type": "추가통보", "topic": "사료첨가물", "ko": "개·고양이용 인삼 추출물 사료첨가물 허가 거부 채택 — 시행규정 (EU) 2026/585", "orig": "Denial of authorisation of ginseng extract from Panax ginseng C.A. Meyer as a feed additive for cats and dogs", "products": "Preparations of a kind used in animal feeding (HS code(s): 2309)", "hs": "2309", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEU887A1.docx", "note": "", "desc": "The proposal notified in G/SPS/N/EU/887 (19 September 2025) is now adopted by Commission Implementing Regulation (EU) 2026/585 of 13 March 2026 concerning the denial of authorisation of ginseng extract from Panax ginseng C.A. Meyer as a feed additive for cats and dogs (Text with EEA relevance).This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/MDA/35", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-18", "member": "몰도바", "type": "긴급통보", "topic": "사료", "ko": "우크라이나산 배합사료 수입 일시 중단(긴급)", "orig": "Order No. 12 of 9 January 2026 on the temporary suspension of imports of compound feed from Ukraine", "products": "Preparations of a kind used in animal feeding (HS code(s): 2309), in particular compound feed intended for poultry and other food-producing animals", "hs": "2309", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NMDA35.docx", "note": "", "desc": "The measure establishes the temporary suspension of imports of compound feed originating from Ukraine into the territory of the Republic of Moldova. The measure was introduced following the detection of residues of the prohibited veterinary medicinal substance metronidazole and its metabolite hydroxymetronidazole in poultry serum samples collected under the National Residue Monitoring Plan. As a result, official investigations and traceability checks were initiated in affected poultry establishments. During these investigations, official samples of compound feed used in those establishments were taken, and laboratory analysis confirmed the presence of metronidazole residues in the feed. Traceability analysis indicated that the contaminated feed had been imported from Ukraine. In order to prevent further introduction and circulation of feed containing prohibited substances in the poultry production chain, the Republic of Moldova introduced a temporary suspension of imports of compound feed originating from Ukraine until adequate guarantees are provided by the competent authority of the exporting country.", "adopt": "", "eif": "Order No. 12 of 9 January 2026 regarding the temporary suspension of the import of compound feed from Ukraine entered into force on the date of its publication in the Official Gazette, i.e. 15 January 2026."}, {"sym": "G/SPS/N/RUS/353", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-18", "member": "러시아", "type": "긴급통보", "topic": "가금 수입제한(HPAI)", "ko": "말레이시아산 가금·가금 제품 수입·경유 일시 제한(긴급)", "orig": "Letter of the Federal Service for Veterinary and Phytosanitary Surveillance No. FS-ARe-7/7094-3 as of 11 March 2026", "products": "Live poultry and products derived thereof (including products in packaging transported in hand luggage and luggage for personal use), egg products, meat and edible offal of poultry, poultry meat products, incubation egg of poultry, incubation egg (except poultry egg), live bird (except poultry), feed and feed additives for birds, equipment for the maintenance, slaughter and cutting of birds (HS co", "hs": "0105, 2936, 3504, 3507, 3808, 3824, 3923, 3926, 4206, 2309, 4415, 4421, 7020, 7309, 7310, 7326, 7616, 8436, 8606, 4416, 2106, 2104, 2102, 0207, 0208, 0209, 0210, 0407, 0408, 0410, 0504, 0505, 0511, 1506, 1510, 1516, 1518, 1601, 1602, 1603, 1902, 1904, 8609, 8716", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NRUS353.docx", "note": "", "desc": "This letter introduces temporary restrictions on the imports of live poultry and poultry products to the territory of the Russian Federation, as well as on the transit of live poultry through the territory of the Russian Federation from Malaysia due to the outbreak of Newcastle disease in the country indicated.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/RUS/354", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-18", "member": "러시아", "type": "긴급통보", "topic": "구제역", "ko": "말레이시아산 구제역 감수성 동물·제품 수입·경유 일시 제한(긴급)", "orig": "Letter of the Federal Service for Veterinary and Phytosanitary Surveillance as of 11 March 2026 No. FS-ARe-7/7093-3", "products": "Animals susceptible to foot-and-mouth disease and products derived thereof, including products in packaging transported in hand luggage and luggage for personal use (HS code(s): 0102; 0103; 010613; 0201; 0202; 0203; 0204; 0205; 0206; 0209; 0210; 04; 051110; 051199; 2309; 430180; 430190; 430390; 843680; 970529)", "hs": "0102, 430390, 430190, 430180, 2309, 051199, 051110, 04, 0210, 0209, 0206, 0205, 0204, 0203, 0202, 0201, 010613, 0103, 843680, 970529", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NRUS354.docx", "note": "", "desc": "This letter introduces temporary restrictions on the imports of certain animals susceptible to foot-and-mouth disease and products derived thereof, as well as on the transit of animals susceptible to foot-and-mouth disease from Malaysia to the territory of the Russian Federation due to the deterioration of foot-and-mouth disease epizootic situation in the country indicated.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/MDA/33/Add.1", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-19", "member": "몰도바", "type": "추가통보(긴급)", "topic": "가금 수입제한 완화", "ko": "우크라이나산 가금육·제품 수입 중단 부분 예외 명령(제127호)", "orig": "Order No. 127 of 13 March 2026 on the partial derogation from the temporary suspension of imports of poultry meat and poultry meat products from Ukraine", "products": "Meat and edible meat offal (HS code(s): 02); Products of animal origin, not elsewhere specified or included (HS code(s): 05); Preparations of meat, of fish, of crustaceans, molluscs or other aquatic invertebrates, or of insects (HS code(s): 16) in particular the following HS codes: 1601, 1602, 0207, 0504", "hs": "02, 0207, 05, 0504, 16, 1601, 1602", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NMDA33A1.docx", "note": "", "desc": "This addendum concerns the SPS notification G/SPS/N/MDA/33 regarding the temporary suspension of imports of poultry meat and poultry by-products and products containing poultry meat from Ukraine. Following additional investigations and guarantees provided by the competent authority of Ukraine, the Republic of Moldova has amended the scope of the measure established by Order No. 48 of 26 January 2026. According to the Order No. 127 of 13 March 2026, the temporary suspension of imports of poultry meat and products containing poultry meat originating from Ukraine remains in force for all establishments in Ukraine, with the exception of the establishment listed in the Annex to the Order, which is authorised to export poultry meat to the Republic of Moldova.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/THA/807", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-19", "member": "태국", "type": "긴급통보", "topic": "가금 수입제한(HPAI)", "ko": "네덜란드산 가금·도체 수입·경유 일시 중단(긴급)", "orig": "The DLD order on temporary suspension of importation or transit of live poultry and poultry carcasses from the Netherlands to prevent the spread of Highly Pathogenic Avian Influenza", "products": "Live poultry and poultry carcasses under Animal Epidemics Act B.E. 2558 (2015)", "hs": "0105, 0207", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTHA807.docx", "note": "", "desc": "The WOAH has reported an outbreak of Highly Pathogenic Avian Influenza (Subtype H5N1) in the area of the Netherlands. Therefore, it is necessary for Thailand to prevent the entry of Highly Pathogenic Avian Influenza (Subtype H5N1) into the country. By the virtue of the Animal Epidemics Act B.E. 2558 (2015), the importation or transit of live poultry and poultry carcasses from the Netherlandshas been temporarily suspended.Where live poultry and poultry carcasses from the Netherlands have undergone a risk assessment and have been determined to be free from epidemic diseases or vectors thereof, and where the measures prescribed by the DLD of Thailand have been duly complied with, the Director-General of the DLD will g

rant permission for the importation or transit of such live poultry or poultry carcasses into or through Thailand.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/JPN/1380/Add.1", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-26", "member": "일본", "type": "추가통보", "topic": "사료첨가물", "ko": "사료첨가물 바시트라신아연·할로푸지논 지정 취소 확정", "orig": "Proposed revocation of designation of zinc bacitracin and calcium halofuginone polystyrenesulfonate as feed additives", "products": "Zinc bacitracin and Calcium halofuginone polystyrenesulfonate as feed additives", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NJPN1380A1.docx", "note": "", "desc": "The revocation of designation of zinc bacitracin and calcium halofuginone polystyrenesulfonate as feed additives, notified in G/SPS/N/JPN/1380 (dated 22 December 2025), will come into force on 30 March 2026.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/THA/803/Add.1", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-26", "member": "태국", "type": "추가통보(긴급)", "topic": "가금 수입제한(HPAI)", "ko": "헝가리산 가금 수입·경유 중단 명령 개정 — 위험평가로 질병 위험이 없다고 판단되면 허가하는 조항 추가", "orig": "The DLD order on temporary suspension of the importation or transit of live poultry and poultry carcasses from Hungary to prevent the spread of Highly Pathogenic Avian Influenza", "products": "Live poultry and poultry carcasses under Animal Epidemics Act B.E. 2558 (2015)", "hs": "0105, 0207", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTHA803A1.docx", "note": "", "desc": "Thailand proposes an amendment to the Department of Livestock Development (DLD) Order on temporary suspension of importation or transit of live poultry and poultry carcasses from Hungary to prevent the spread of High Pathogenicity Avian Influenza by adding paragraph (2) as follow: The WOAH has reported an outbreak of Highly Pathogenic Avian Influenza in the area of Hungary. Therefore, it is necessary for Thailand to prevent the entry of Highly Pathogenic Avian Influenza into the country. By the virtue of the Animal Epidemics Act B.E. 2558 (2015), the importation or transit of live poultry and poultry carcasses from certain areas of Hungary has been temporarily suspended. 2. Where live poultry and poultry carcasses from Hungary have undergone a risk assessment and have been determined to be free from epidemic diseases or vectors thereof, and where the measures prescribed by the DLD of Thailand have been duly complied with, the Director-General of the DLD will grant permission for the importation or transit of such live poultry or poultry carcasses into or through Thailand.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/EU/936", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-27", "member": "유럽연합", "type": "정규통보", "topic": "사료첨가물", "ko": "돼지·가금용 사료첨가물(에게르텔라과 균주 제제) 허가 갱신", "orig": "Commission Implementing Regulation (EU) 2026/549 of 13 March 2026 concerning the renewal of the authorisation of a preparation of the bacterial strain DSM 11798 of the Eggerthellaceae family as a feed additive for pigs, poultry and ornamental birds and repealing Implementing Regulations (EU) No 1016/2013 and (EU) 2017/930 (Text with EEA relevance)", "products": "Preparations of a kind used in animal feeding (HS code(s): 2309)", "hs": "2309", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEU936.docx", "note": "", "desc": "The preparation covered by the Act was authorised for a period of ten years as a feed additive for pigs, poultry and ornamental birds in the additive category ‘technological additives’ and in the functional group ‘substances for the reduction of the contamination of feed by mycotoxins’. An application was submitted for the renewal of the authorisation of this preparation in accordance with article 14 of Regulation (EC) No 1831/2003. Based on the favourable conclusions of a scientific assessment of the dossier submitted by the applicant, conducted by the European Food Safety Authority (EFSA), the authorisation of this preparation as a feed additive for pigs, poultry and ornamental birds is renewed under certain conditions detailed in the Annex to the Act. A transitional period is included for the interested parties to meet the new authorisation’s requirements.", "adopt": "", "eif": "This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union."}, {"sym": "G/SPS/N/JPN/1395", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-27", "member": "일본", "type": "긴급통보", "topic": "구제역", "ko": "그리스산 생유·비가열 유제품 수입 중단(긴급)", "orig": "Import suspension of raw milk and/or un-heated/un-treated milk products from Greece", "products": "Raw milk and/or un-heated/un-treated milk products", "hs": "04", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NJPN1395.docx", "note": "", "desc": "In order to prevent the introduction of foot and mouth disease (FMD) virus into Japan, MAFF has suspended the import of raw milk and/or un-heated/un-treated milk products from Greece, including those shipped through third countries, on 18 March 2026 based on the \"Animal Health Requirements for raw milk and/or milk products to be exported to Japan from Listed countries\" and the Articles 37 and 44 of the \"Act on Domestic Animal Infectious Disease Control\".Importation of cloven-hoofed animals and products derived from cloven-hoofed animals other than milk and milk products, as well as straw and forage for feed from Greece have been prohibited under the Act on Domestic Animal Infectious Diseases Control. Therefore, only raw milk and un-heated/un-treated milk products are subject to the import suspension due to FMD outbreak.This is to inform that MAFF has removed Greece from the listed countries.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/RUS/355", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-27", "member": "러시아", "type": "긴급통보", "topic": "구제역", "ko": "그리스산 구제역 감수성 동물·제품 수입·경유 일시 제한(긴급)", "orig": "Letter of the Federal Service for Veterinary and Phytosanitary Surveillance as of 24 March 2026 No. FS-ARe-7/7098-3", "products": "Animals susceptible to foot-and-mouth disease and products derived thereof, including products in packaging transported in hand luggage and luggage for personal use (HS code(s): 0102; 0103; 010613; 0201; 0202; 0203; 0204; 0205; 0206; 0209; 0210; 04; 051110; 051199; 2309; 430180; 430190; 430390; 843680; 970529)", "hs": "0102, 0103, 010613, 0201, 0202, 0203, 0204, 0205, 0206, 0209, 0210, 04, 051110, 051199, 2309, 430180, 430190, 430390, 843680, 970529", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NRUS355.docx", "note": "", "desc": "This letter introduces temporary restrictions on the imports of certain animals susceptible to foot-and-mouth disease and products derived thereof, as well as on the transit of animals susceptible to foot-and-mouth disease from Greece to the territory of the Russian Federation due to the deterioration of foot-and-mouth disease epizootic situation in the country indicated.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/COL/395/Add.1", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-30", "member": "콜롬비아", "type": "추가통보(긴급)", "topic": "가금 수입제한 해제", "ko": "스페인산 조류·가금 관련 제품 수입위생서류 발급 중단 해제(2026.3.25)", "orig": "Resolución No. 00005038 del 25 de marzo de 2026 \"Por la cual se levanta la medida temporal de suspensión de emisión de documentos zoosanitarios de importación (DZI) para aves vivas, material genético, productos y subproductos de riesgo susceptibles de transmitir la Influenza Aviar de Alta Patogenicidad, procedentes del Reino de España, declarada mediante Resolución ICA 19583 de 2025\" (Resolution No. 00005038 of 25 March 2026 \"lifting the temporary suspension on the issuance of animal health import documents (DZI) for live birds, genetic material, products and by-products at risk of transmittin", "products": "Live birds, genetic material, products and by-products at risk of transmitting high pathogenicity avian influenza", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCOL395A1.docx", "note": "", "desc": "Resolución No. 00005038 del 25 de marzo de 2026 \"Por la cual se levanta la medida temporal de suspensión de emisión de documentos zoosanitarios de importación (DZI) para aves vivas, material genético, productos y subproductos de riesgo susceptibles de transmitir la Influenza Aviar de Alta Patogenicidad, procedentes del Reino de España, declarada mediante Resolución ICA 19583 de 2025\" (Resolution No. 00005038 of 25 March 2026 \"lifting the temporary suspension on the issuance of animal health import documents (DZI) for live birds, genetic material, products and by-products at risk of transmitting high pathogenicity avian influenza, coming from the Kingdom of Spain, declared under ICA Resolution No. 19583 of 2025\")The Republic of Colombia hereby notifies the issuance of Resolution No. 00005038 of 25 March 2026 \"lifting the temporary suspension on the issuance of animal health import documents (DZI) for live birds, genetic material, products and by-products at risk of transmitting high pathogenicity avian influenza, coming from the Kingdom of Spain, declared under ICA Resolution No. 19583 of 2025\", which lifts the measure suspending the issuance of animal health import documents (DZI) for live birds, genetic material, products and by-products at risk of transmitting high pathogenicity avian influenza (HPAI), coming from Spain.The decision is based on the fact that the health event has been declared as resolved in the World Animal Health Information System (WAHIS), and on the recovery of Spain's health status as a HPAI-free country, in accordance with the self-declaration published on 18 February 2026 by the World Organisation for Animal Health (WOAH).The issuance of DZI for these products has therefore resumed, subject to compliance with the sanitary import requirements in force and the time frames set out in those requirements. The time frames entered into effect on the date when WOAH published the self-declaration.https://www.ica.gov.co/getattachment/f1f67b77-05d9-4a00-9e04-cdc1d706f197/2026R0005038.aspxhttps://members.wto.org/crnattachments/2026/SPS/COL/26_01745_00_s.pdf", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/EU/937", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-30", "member": "유럽연합", "type": "정규통보", "topic": "사료첨가물", "ko": "사료첨가물 아카시아검 허가 갱신", "orig": "Commission Implementing Regulation (EU) 2026/540 of 11 March 2026 concerning the authorisation of acacia gum as a feed additive for all animal species (Text with EEA relevance)", "products": "Preparations of a kind used in animal feeding (HS code(s): 2309)", "hs": "2309", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEU937.docx", "note": "", "desc": "The substance covered by the Act was authorised as a feed additive for all animal species. An application was submitted for the reauthorisation of this substance in accordance with article 10 of Regulation (EC) No 1831/2003. Based on the favourable conclusions of a scientific assessment of the dossier submitted by the applicant, conducted by the European Food Safety Authority (EFSA), this substance is reauthorised as a feed additive for all animal species in the additive category ‘technological additives’ and in the functional groups ‘emulsifiers’ and ‘stabilisers’, under certain conditions detailed in the Annex to the Act. A transitional period is included for the interested parties to meet the new authorisation requirements.", "adopt": "", "eif": "This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union."}, {"sym": "G/SPS/N/EU/938", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-30", "member": "유럽연합", "type": "정규통보", "topic": "사료첨가물", "ko": "사료첨가물 패출리 정유 허가 갱신", "orig": "Commission Implementing Regulation (EU) 2026/528 of 11 March 2026 concerning the authorisation of patchouli essential oil from Pogostemon cablin Benth. as a feed additive for all animal species (Text with EEA relevance)", "products": "Preparations of a kind used in animal feeding (HS code(s): 2309)", "hs": "2309", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEU938.docx", "note": "", "desc": "The substance covered by the Act was authorised as a feed additive for all animal species. An application was submitted for the reauthorisation of this substance in accordance with article 10 of Regulation (EC) No 1831/2003. Based on the favourable conclusions of a scientific assessment of the dossier submitted by the applicant, conducted by the European Food Safety Authority (EFSA), this substance is reauthorised as a feed additive for all animal species in the additive category ‘sensory additives’ and in the functional group ‘flavouring compounds’, under certain conditions detailed in the Annex to the Act. A transitional period is included for the interested parties to meet the new authorisation’s requirements.", "adopt": "", "eif": "This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union."}, {"sym": "G/SPS/N/UKR/261", "more": 0, "area": "SPS", "group": "동물위생", "date": "2026-03-30", "member": "우크라이나", "type": "정규통보", "topic": "동물용의약품", "ko": "동물용의약품 국가등록 규정 결의안", "orig": "Draft Resolution of the Cabinet of Ministers of Ukraine “On Approval of the Regulation on State Registration of Veterinary Medicinal Products and Repealing Certain Resolutions of the Cabinet of Ministers of Ukraine”", "products": "Veterinary medicinal products", "hs": "", "deadline": "2026-05-29", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NUKR261.docx", "note": "", "desc": "The draft Resolution is developed to establish requirements for the state registration of veterinary medicinal products manufactured industrially or by a method involving an industrial process and intended to be placed on the market. The draft Resolution provides for: - procedures for state registration of veterinary medicinal products, including submission of applications and the required documents in electronic form; examination of applications by the State Service of Ukraine on Food Safety and Consumer Protection; timelines for decision-making; grounds for suspending the processing of applications; procedures, timelines and fees for assessment of registration dossier materials by the authorized (designated) authority; grounds for taking a decision on the state registration or refusal of such registration; - specific provisions for the state registration of certain types of veterinary medicinal products, including antimicrobial veterinary medicinal products; veterinary medicinal products containing or consisting of genetically modified organisms; veterinary medicinal products intended exclusively for export; immunological veterinary medicinal products for notifiable or rare (exotic) animal diseases and generic, hybrid, combined and homeopathic veterinary medicinal products; - requirements for applications, registration dossiers and other documents attached to the application; - conditions for the suspension, restoration and termination of the state registration; - time limits for remedying deficiencies specified in the notification of suspension of the application processing. The draft Resolution also proposes to establish transitional periods for certain provisions, taking into account the relevant transitional provisions of the Law of Ukraine \"On Veterinary Medicine and Animal Welfare\", in particular: non-application of the requirement to submit documents confirming compliance of manufacturing sites with GMP requirements of (until 1 July 2027); possibility to submit applications and other documents in paper form (until 1 March 2030); non-application of requirements for the registration dossier and supporting documents regarding the research, testing, and risk assessment of genetically modified organisms (until 16 September 2026) and non-application of requirements for confirming compliance with relevant good practices in the registration dossier (until 1 July 2032). The draft Resolution aims to align national legislation in the field of animal health a", "adopt": "To be determined.", "eif": "The Resolution will enter into force on the date of its publication."}, {"sym": "G/SPS/N/BRA/2476", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-03-06", "member": "브라질", "type": "정규통보", "topic": "수입요건", "ko": "스페인산 블루베리 생과 수입 식물검역요건 개정안", "orig": "Draft - Updates the phytosanitary requirements for the importation of blueberry fruit (Vaccinium corymbosum) produced in Spain", "products": "Vaccinium corymbosum", "hs": "081040", "deadline": "2026-05-05", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NBRA2476.docx", "note": "", "desc": "Draft Ordinance aiming to update the phytosanitary requirements for the importation into Brazil of blueberry fruit (Vaccinium corymbosum) (category 3) produced in Spain.", "adopt": "To be determined.", "eif": "To be determined."}, {"sym": "G/SPS/N/BRA/2477", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-03-06", "member": "브라질", "type": "정규통보", "topic": "수입요건", "ko": "포르투갈산 블루베리 생과 수입 식물검역요건 개정안", "orig": "Draft - Updates the phytosanitary requirements for the importation of blueberry fruit (Vaccinium corymbosum) produced in Portugal", "products": "Vaccinium corymbosum", "hs": "081040", "deadline": "2026-05-05", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NBRA2477.docx", "note": "", "desc": "Draft Ordinance aiming to update the phytosanitary requirements for the importation into Brazil of blueberry fruit (Vaccinium corymbosum) (category 3) produced in Portugal.", "adopt": "To be determined.", "eif": "To be determined."}, {"sym": "G/SPS/N/JPN/1394", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-03-06", "member": "일본", "type": "정규통보", "topic": "검역병해충", "ko": "식물방역법 시행규칙 별표·비검역병해충 목록 개정안", "orig": "Proposed revisions of the Ordinance for Enforcement of the Plant Protection Act, relevant notifications and detailed rules", "products": "Plant, plant products and other objects", "hs": "", "deadline": "2026-05-05", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NJPN1394.docx", "note": "", "desc": "The MAFF will revise Annexed Tables 1, 1-2, 2 and 2-2 of the Ordinance for Enforcement of the Plant Protection Act and the non-quarantine pest list to reflect the latest scientific evidence.Summary of the proposed revisions - Annex 1;Proposed revision of Annexed Table 1 of the Ordinance for Enforcement of the Plant Protection Act on list of the quarantine pest list - Annex 2;Proposed revision of Annexed Table 1-2 of the Ordinance for Enforcement of the Plant Protection Act on list of the plants and other objects subject to specific phytosanitary measures to be carried out in exporting countries - Annex 3;Proposed revision of Annexed Table 2 of the Ordinance for Enforcement of the Plant Protection Act on list of the import prohibited plants - Annex 4;Proposed revision of Annexed Table 2-2 of the Ordinance for Enforcement of the Plant Protection Act on list of the import prohibited plants (excluding the plants that meet the requirements) - Annex 5;Proposed revision of the non-quarantine pest list - Annex 6.The following emergency notifications will be withdrawn after the enforcement of this amendment:G/SPS/N/JPN/1326G/SPS/N/JPN/1335G/SPS/N/JPN/1360G/SPS/N/JPN/1376G/SPS/N/JPN/1379, and G/SPS/N/JPN/1385.", "adopt": "June 2026", "eif": "Proposed revisions of lists will enter into force after six months from the date of publication while the relevant emergency measures will remain effective until the date of entry into force. In relation to the proposed revisions, additional emergency notifications may be issued as needed. The following revisions will enter into force on the day following the date of publication, as they are trade facilitating measures.: - Proposed deletion of Tuta absoluta of Annexed Table 1 in Annex 2; - Proposed deletion of Item 7 of Annexed Table 2-2 in Annex 5; - Proposed amendments of the non-quarantine pest list in Annex 6."}, {"sym": "G/SPS/N/ECU/388", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-03-09", "member": "에콰도르", "type": "정규통보", "topic": "수입요건", "ko": "아르헨티나산 식용 수수 수입 식물검역요건 개정", "orig": "Modificación sobre los requisitos fitosanitarios de cumplimiento obligatorio para la importación de granos de sorgo (Sorghum bicolor) para consumo, originarios de Argentina (Amendment to the mandatory phytosanitary requirements for the importation of sorghum (Sorghum bicolor) grains for consumption from Argentina)", "products": "Sorghum (Sorghum bicolor) grains", "hs": "1007", "deadline": "2026-05-08", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NECU388.docx", "note": "", "desc": "The notified text amends the mandatory phytosanitary requirements for the importation of sorghum (Sorghum bicolor) grains for consumption from Argentina.", "adopt": "24 September 2025", "eif": "24 September 2025"}, {"sym": "G/SPS/N/ECU/389", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-03-09", "member": "에콰도르", "type": "정규통보", "topic": "수입요건", "ko": "아르헨티나산 면 원섬유 수입 식물검역요건 개정", "orig": "Modificación de requisitos fitosanitarios de cumplimiento obligatorio para la importación de fibra sin cardar ni peinar de algodón (Gossypium hirsutum) para la industria, originaria de Argentina (Amendment to the mandatory phytosanitary requirements for the importation of cotton (Gossypium hirsutum) fibre, not carded or combed, for industry, from Argentina)", "products": "Cotton fibre", "hs": "5 de: 060290)", "hs": "060290", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCOL408A1.docx", "note": "", "desc": "Resolución No. 00002655 del 6 de marzo de 2026, \"Por medio de la cual se actualizan los requisitos fitosanitarios para la importación a Colombia de esquejes de clavel con raíz – plantas (Dianthus L.) de origen y procedencia de la República Federal de Alemania para uso comercial, ensayo y/o siembra\" (Resolution No. 00002655 of 6 March 2026 updating the phytosanitary requirements for the importation into Colombia of rooted carnation cuttings - plants (Dianthus L.) originating in and coming from the Federal Republic of Germany for commercial use, testing and sowing)The Republic of Colombia hereby notifies the issuance of Resolution No. 00002655 of 6 March 2026 updating the phytosanitary requirements for the importation into Colombia of rooted carnation cuttings - plants (Dianthus L.) originating in and coming from the Federal Republic of Germany for commercial use, testing and sowing. The Resolution updates the phytosanitary requirements for the importation into Colombia of rooted carnation cuttings - plants (Dianthus L.) originating in and coming from the Federal Republic of Germany for commercial use, testing and sowing, and applies to all natural or legal persons importing these products.The Resolution was published in Official Journal No. 53.422 of 9 March 2026 and entered into force the same day.https://www.ica.gov.co/getattachment/a4b3e458-5ab3-41f8-ab3c-bf4b18f2b2b3/2026R00002655.aspxhttps://members.wto.org/crnattachments/2026/SPS/COL/26_01373_00_s.pdf", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/MEX/464", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-03-11", "member": "멕시코", "type": "정규통보", "topic": "종자 검역", "ko": "과테말라산 파종용 오이 종자 수입 식물검역요건안", "orig": "Propuesta de requisitos fitosanitarios para importación a México de semilla de pepino (Cucumis sativus) para siembra, originaria y procedente de Guatemala (Draft phytosanitary requirements for the importation into Mexico of cucumber (Cucumis sativus L.) seeds for sowing, originating in and coming from Guatemala)", "products": "Cucumber (Cucumis sativus L.) seeds for sowing", "hs": "120991", "deadline": "2026-05-10", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NMEX464.docx", "note": "", "desc": "The notified draft phytosanitary requirements governing the importation into Mexico of cucumber (Cucumis sativus L.) seeds for sowing, originating in and coming from Guatemala, were determined by SENASICA, pursuant to the Agreement on the Application of Sanitary and Phytosanitary Measures.", "adopt": "To be determined", "eif": "To be determined"}, {"sym": "G/SPS/N/CRI/350", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-03-12", "member": "코스타리카", "type": "정규통보", "topic": "수입요건", "ko": "브라질산 감 생과 수입 결의안", "orig": "Proyecto de Resolución para regular la importación de frutas de Kaki (Diospyros kaki) para consumo fresco originarias de Brasil (Draft Resolution governing the importation, for consumption, of fresh persimmons (Diospyros kaki) originating in Brazil)", "products": "Fresh persimmons (HS code(s): 081070)", "hs": "081070", "deadline": "2026-05-11", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCRI350.docx", "note": "", "desc": "The notified draft Resolution establishes phytosanitary measures for the importation, for consumption, of fresh persimmons (Diospyros kaki) originating in Brazil.", "adopt": "To be determined", "eif": "This Resolution will enter into force upon signature."}, {"sym": "G/SPS/N/CRI/351", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-03-12", "member": "코스타리카", "type": "정규통보", "topic": "수입요건", "ko": "우루과이산 감 생과 수입 결의안", "orig": "Proyecto de Resolución para regular la importación de frutas de Kaki (Diospyros kaki) para consumo fresco originarias de Uruguay (Draft Resolution governing the importation, for consumption, of fresh persimmons (Diospyros kaki) originating in Uruguay)", "products": "Fresh persimmons (HS code(s): 081070)", "hs": "081070", "deadline": "2026-05-11", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCRI351.docx", "note": "", "desc": "The notified draft Resolution establishes phytosanitary measures for the importation, for consumption, of fresh persimmons (Diospyros kaki) originating in Uruguay.", "adopt": "To be determined", "eif": "This Resolution will enter into force upon signature."}, {"sym": "G/SPS/N/AUS/376/Add.9", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-03-13", "member": "호주", "type": "추가통보(긴급)", "topic": "병해충(긴급)", "ko": "자일렐라균 대응 묘목·조직배양체 수입 긴급조치 추가통보", "orig": "Emergency measures for nursery stock and tissue culture against Xylella fastidiosa and related Xylella species", "products": "Nursery stock, tissue culture, cuttings, budwood, rooted plants, corms and bulbs of 89 families of plants known to host Xylella spp.", "hs": "0601, 0602", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NAUS376A9.docx", "note": "", "desc": "On 9 November 2015, Australia notified of the implementation of emergency measures for the import of nursery stock, tissue cultures, cuttings, budwood, rooted plants, corms and bulbs against Xylella fastidiosa and related Xylella species. Further to notifications: G/SPS/N/AUS/376; G/SPS/N/AUS/376/Add.1; G/SPS/N/AUS/376/Add.2; G/SPS/N/AUS/376/Add.3; G/SPS/N/AUS/376/Add.4; G/SPS/N/AUS/538; G/SPS/N/AUS/557; G/SPS/N/AUS/376/Add.5; G/SPS/N/AUS/376/Add.6, G/SPS/N/AUS/376/Add.7 and G/SPS/N/AUS/376/Add.8 and based on additional information on the host range of Xylella fastidiosa and related Xylella species, Australia notifies that emergency measures for Xylella will be extended to nursery stock belonging to all species within the Musa genus from 13 March 2026. This change will ensure that Australia’s import conditions continue to be effective in reducing the risk of Xylella from entering Australia.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/COL/416", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-03-13", "member": "콜롬비아", "type": "정규통보", "topic": "종자 검역", "ko": "칠레산 해바라기 종자 수입 식물검역요건 결의안", "orig": "Proyecto de Resolución \"Por medio de la cual se establecen los requisitos fitosanitarios para la importación a Colombia de semillas de Girasol (Helianthus annuus L.) de origen y procedencia Chile, para ensayo, uso comercial y/o siembra\" (Draft Resolution establishing phytosanitary requirements for the importation into Colombia of sunflower (Helianthus annuus L.) seeds originating in and coming from Chile, for testing, commercial use and/or sowing)", "products": "Sunflower (Helianthus annuus L.) seeds (HS code: 1206)", "hs": "1206", "deadline": "2026-05-12", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCOL416.docx", "note": "", "desc": "The notified measure seeks to establish phytosanitary requirements for the importation into Colombia of sunflower (Helianthus annuus L.) seeds originating in and coming from Chile, for testing, commercial use and/or sowing. The provisions will apply to all natural or legal persons who import into Colombia sunflower (Helianthus annuus L.) seeds originating in and coming from Chile, for testing, commercial use and/or sowing.", "adopt": "Enters into force upon publication in the Official Journal", "eif": "Enters into force upon publication in the Official Journal"}, {"sym": "G/SPS/N/PER/1112", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-03-13", "member": "페루", "type": "정규통보", "topic": "수입요건", "ko": "칠레산 벚나무속 화분 수입 식물검역요건안", "orig": "Proyecto de Resolución Directoral para el establecimiento de requisitos fitosanitarios de necesario cumplimiento en la importación de polen de Prunus spp. de origen y procedencia Chile (Draft Directorial Resolution establishing mandatory phytosanitary requirements governing the importation of Prunus spp. pollen originating in and coming from Chile)", "products": "Prunus spp. pollen (HS code: 140490)", "hs": "140490", "deadline": "2026-05-12", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NPER1112.docx", "note": "", "desc": "The draft phytosanitary requirements governing the importation into Peru of Prunus spp. pollen originating in and coming from Chile are being submitted for public consultation following the completion of the relevant pest risk analysis.", "adopt": "To be determined", "eif": "Upon publication in the Official Journal, El Peruano"}, {"sym": "G/SPS/N/EU/931", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-03-16", "member": "유럽연합", "type": "정규통보", "topic": "규제 비검역병해충", "ko": "재식용 식물의 규제 비검역병해충 조치 예외 명확화안", "orig": "Draft Commission Implementing Regulation amending Implementing Regulation (EU) 2019/2072 as regards exemptions from the measures to prevent the presence of regulated non-quarantine pests on specific plants for planting", "products": "Plants (HS Chapters: 06 (live plants)", "hs": "06", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEU931.docx", "note": "", "desc": "The draft legal act amends Article 6(3) of Implementing Regulation (EU) 2019/2072 and adds a new Article 6a, in view of clarifying the cases of plants for planting, -either imported into the European Union or moved within the European Union-, where exemptions from the rules of Regulated Non-Quarantine Pests (RNQPs) are possible. Certain conditions are put in place under which those exemptions should be applied. In this context:Article 6(3) aligns the cases of plants for planting exempted from the RNQP requirements with the cases of the corresponding plant propagating material exempted from the scope of the EU marketing Directives (Directives 66/401/EEC, 66/402/EEC, 68/193/EEC, 98/56/EC, 1999/105/EC, 2002/54/EC, 2002/55/EC, 2002/56/EC, 2002/57/EC, 2008/72/EC and 2008/90/EC);New Article 6a clarifies the cases of seed not finally certified and seed as grown, imported into the European Union or moved within the European Union, which can be destined for further processing before being placed on the EU market. The clarification of the exemptions from the rules for RNQPs, has as objective to facilitate trade while the envisaged conditions ensure plant protection.", "adopt": "June 2026", "eif": "This Regulation shall enter into force and become immediately applicable on the twentieth day following that of its publication in the Official Journal of the European Union."}, {"sym": "G/SPS/N/EU/932", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-03-16", "member": "유럽연합", "type": "정규통보", "topic": "병해충", "ko": "벼뿌리혹선충(Meloidogyne graminicola) 유입·확산 방지 조치안", "orig": "Draft Commission Implementing Regulation amending Annexes II, VII and VIII to Implementing Regulation (EU) 2019/2072 as regards measures to prevent the entry into, presence, establishment and spread within, the Union territory of Meloidogyne graminicola Golden & Birchfield", "products": "Plants (HS Chapters: 06 (live plants)", "hs": "06", "deadline": "2026-05-15", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEU932.docx", "note": "", "desc": "The draft legal act provides for measures against Meloidogyne graminicola. These measures should replace temporary measures provided under Regulation (EU) 2022/1372 which will expire on 30 June 2026.This includes measures regarding the introduction of rooted plants for planting of Oryza sativa that have been grown in soil, originating in countries, areas or places of production which are free from Meloidogyne graminicola", "adopt": "June 2026", "eif": "This Regulation shall enter into force and become immediately applicable on the twentieth day following that of its publication in the Official Journal of the European Union."}, {"sym": "G/SPS/N/USA/3563", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-03-16", "member": "미국", "type": "정규통보", "topic": "수입요건", "ko": "이탈리아 사르데냐산 아티초크 수입 병해충위험분석 공개", "orig": "Notice of Availability of a Pest Risk Analysis for the Importation of Globe Artichoke From Sardinia, Italy Into the United States [Docket No. APHIS–2024–0006]", "products": "Fresh, immature flower buds of globe artichoke (Cynara cardunculus", "hs": "", "deadline": "2026-05-04", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NUSA3563.docx", "note": "", "desc": "We are advising the public that we have prepared a pest risk analysis that evaluates the risks associated with the importation of fresh, immature flower buds of globe artichoke (Cynara cardunculus, also known as spiny artichoke) from Sardinia, Italy into the United States. Based on the analysis, we have determined that the application of one or more designated phytosanitary measures will be sufficient to mitigate the risks of introducing or disseminating plant pests or noxious weeds via the importation of globe artichoke from Sardinia, Italy into the United States. We are making the pest risk analysis available to the public for review and comment. (Federal Register Vol. 91, No. 41; Tuesday, 3 March 2026; pg. 10365)", "adopt": "To be determined.", "eif": "To be determined."}, {"sym": "G/SPS/N/CRI/347/Add.1", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-03-17", "member": "코스타리카", "type": "추가통보", "topic": "수입요건", "ko": "인도산 식용 비둘기콩 수입 결의 공포", "orig": "Resolution governing the importation of pigeon pea (Cajanus cajan) grain for consumption originating in IndiaCosta Rica hereby advises that the phytosanitary measures notified in document G/SPS/N/CRI/347 have entered into force pursuant to Resolution No. 013-2026-CV-ARP-SFE of the State Phytosanitary Service, Plant Quarantine Department, Pest Risk Analysis Unit, establishing phytosanitary requirements for the importation of pigeon pea (Cajanus cajan) grain for consumption originating in India. This Resolution was issued at 14:05 on 16 March 2026.https://members.wto.org/crnattachments/2026/SPS/", "products": "Pigeon pea (Cajanus cajan) grain for consumption (HS code: 071360)", "hs": "071360", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCRI347A1.docx", "note": "", "desc": "Resolution governing the importation of pigeon pea (Cajanus cajan) grain for consumption originating in IndiaCosta Rica hereby advises that the phytosanitary measures notified in document G/SPS/N/CRI/347 have entered into force pursuant to Resolution No. 013-2026-CV-ARP-SFE of the State Phytosanitary Service, Plant Quarantine Department, Pest Risk Analysis Unit, establishing phytosanitary requirements for the importation of pigeon pea (Cajanus cajan) grain for consumption originating in India. This Resolution was issued at 14:05 on 16 March 2026.https://members.wto.org/crnattachments/2026/SPS/CRI/26_01500_00_s.pdf", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/TPKM/655/Add.1", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-03-17", "member": "대만", "type": "추가통보", "topic": "수입요건", "ko": "식물·식물산물 수입 검역요건 B부 시행", "orig": "The implementation on Part B of the “Quarantine Requirements for the Importation of Plants or Plant Products”", "products": "Plants or plant products", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTPKM655A1.docx", "note": "", "desc": "The Separate Customs Territory of Taiwan, Penghu, Kinmen and Matsu notified the draft of Part B of the “Quarantine Requirements for the Importation of Plants or Plant Products” on 8 January 2026 (G/SPS/N/TPKM/655). This regulation has been published and will enter into force on 1 April 2026.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/USA/3564", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-03-17", "member": "미국", "type": "정규통보", "topic": "수입요건", "ko": "대만산 파인애플 수입요건 개정안", "orig": "Notice of Proposed Revision to Requirements for the Importation of Pineapples From Taiwan Into the United States [Docket No. APHIS-2025-0637]", "products": "Fresh pineapple", "hs": "080430", "deadline": "2026-05-04", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NUSA3564.docx", "note": "", "desc": "We are advising the public that we have prepared a pest risk assessment (PRA) and a risk management document (RMD) relative to the importation into the United States of fresh pineapple (Ananas comosus (L.) Merr.) fruit from Chinese Taipei. Currently, fresh pineapple fruit from Chinese Taipei must be at least 50 percent Smooth Cayenne by lineage in order to be authorized importation into the United States, and may only be imported into Guam or the Commonwealth of the Northern Mariana Islands, among other import conditions. However, the national plant protection organization (NPPO) of Chinese Taipei has asked APHIS for expanded authorization to import any variety of fresh pineapple fruit into any State or Territory of the United States. Based on the NPPO's request, APHIS has prepared a PRA that evaluates the plant pest and noxious weed risk associated with the importation of fresh pineapple fruit from Chinese Taipei into the United States, and an RMD that proposes mitigations to address these risks. We are making the PRA and RMD available to the public for review and comment. (Federal Register Vol. 91, No. 41; Tuesday, 3 March 2026; pp 10364-10365)", "adopt": "To be determined.", "eif": "To be determined."}, {"sym": "G/SPS/N/USA/3565", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-03-17", "member": "미국", "type": "정규통보", "topic": "수입요건", "ko": "한국산 고구마 생뿌리 수입 병해충위험분석 공개", "orig": "Notice of Availability of a Pest Risk Analysis for the importation of Fresh Sweet Potato (Ipomoea batatas (L.)Roots from the Republic of Korea into the United States [Docket No. APHIS-2025-0013]", "products": "Fresh sweet potato roots", "hs": "071420", "deadline": "2026-05-12", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NUSA3565.docx", "note": "한국산 농산물 관련", "desc": "We are advising the public that we have prepared a pest risk analysis that evaluates the risks associated with importation of fresh sweet potato (Ipomoea batatas (L.)) roots from the Republic of Korea into the United States for consumption. Currently, fresh sweet potato roots are authorized into Guam and the Commonwealth of the Northern Mariana Islands. Based on the analysis, we have determined that the application of one or more designated phytosanitary measures will be sufficient to mitigate the risks of introducing or disseminating plant pests or noxious weeds via the importation of fresh sweet potato roots from the Republic of Korea into the rest of the United States. We are making the pest risk analysis available to the public for review and comment. (Federal Register, Vol. 91, No. 49, Friday, 13 March 2026, pp 12339-12340.)", "adopt": "To be determined.", "eif": "To be determined."}, {"sym": "G/SPS/N/CHL/868/Add.1", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-03-18", "member": "칠레", "type": "추가통보", "topic": "수입요건", "ko": "캐나다산 체리 묘목·삽수 수입 식물검역요건 개정 결의 공포", "orig": "Resolución Exenta No 1.835/2026 que Modifica resolución No 6.315 de 2013, que Establece requisitos fitosanitarios de importación para plantas, estacas y ramillas de cerezo (Prunus avium), procedentes de Canadá (Exempt Resolution No. 1.835/2026 amending Resolution No. 6.315 of 2013 establishing phytosanitary requirements for the importation of cherry tree (Prunus avium) plants, cuttings and scions from Canada)Chile hereby advises that Exempt Resolution No. 1.835 of 2026 amending Resolution No. 6.315 of 2013 establishing phytosanitary requirements for the importation of cherry tree (Prunus avium", "products": "Cherry tree (Prunus avium) plants, cuttings and twigs", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCHL868A1.docx", "note": "", "desc": "Resolución Exenta No 1.835/2026 que Modifica resolución No 6.315 de 2013, que Establece requisitos fitosanitarios de importación para plantas, estacas y ramillas de cerezo (Prunus avium), procedentes de Canadá (Exempt Resolution No. 1.835/2026 amending Resolution No. 6.315 of 2013 establishing phytosanitary requirements for the importation of cherry tree (Prunus avium) plants, cuttings and scions from Canada)Chile hereby advises that Exempt Resolution No. 1.835 of 2026 amending Resolution No. 6.315 of 2013 establishing phytosanitary requirements for the importation of cherry tree (Prunus avium) plants, cuttings and scions from the Canada, was published in the Official Journal on 17 March 2026 and entered into force on that date.https://members.wto.org/crnattachments/2026/SPS/CHL/26_01535_00_s.pdf", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/CHL/878", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-03-18", "member": "칠레", "type": "긴급통보", "topic": "병해충(긴급)", "ko": "달팽이류 침입 위험 신·중고 차량·선박·컨테이너 긴급 식물검역조치", "orig": "Resolución Exenta No 1834/2026, Establece Medidas Fitosanitarias de emergencia para vehículos nuevos y usados con riesgo de infestación por gasterópodos procedentes de cualquier origen (Exempt Resolution No. 1834/2026 establishing emergency phytosanitary measures for new and used vehicles at risk of infestation by gastropods from any origin)", "products": "Used and new vehicles at risk of infestation by gastropods", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCHL878.docx", "note": "", "desc": "The notified resolution, Exempt Resolution No. 1.834/2026, establishes emergency phytosanitary measures for new/used vehicles, vessels and containers of any origin, requiring that they arrive free of quarantine gastropods, such as Cathaica fasciola, Succinea sp., Bradybaena despecta and Eobania vermiculata. If quarantine gastropods are detected during port inspections, the vehicles, vessels or containers will be denied entry or required to be re-exported; for those that have already been unloaded and/or moved to other places, pending importation, SAG will instruct that they be re-laded onto the ship. It also provides for the adoption of mitigation measures in the surrounding area and/or warehouses where those vehicles have been stored.Further details can be found in the document attached hereto.", "adopt": "", "eif": "16 March 2026"}, {"sym": "G/SPS/N/COL/417", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-03-18", "member": "콜롬비아", "type": "정규통보", "topic": "수입요건", "ko": "파라과이산 땅콩 수입 식물검역요건 결의안", "orig": "Proyecto de resolución \"Por medio de la cual se establecen los requisitos fitosanitarios para la importación a Colombia de grano de Maní (Arachis hypogaea L.) de origen y procedencia Paraguay, para consumo humano, uso industrial y/o comercial\" (Draft resolution establishing the phytosanitary requirements for the importation into Colombia of ground-nuts (Arachis hypogaea L.) originating in and coming from Paraguay for human consumption, and industrial and/or commercial use).", "products": "Ground-nuts (Arachis hypogaea) (HS code: 1202)", "hs": "1202", "deadline": "2026-05-17", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCOL417.docx", "note": "", "desc": "The notified measure seeks to establish phytosanitary requirements for the importation into Colombia of ground-nuts (Arachis hypogaea L.) originating in and coming from Paraguay for human consumption, and industrial and/or commercial use. The provisions shall apply to all natural or legal persons engaged in the importation of this product into the national territory for the aforementioned uses.", "adopt": "Enters into force upon publication in the Official Journal", "eif": "Enters into force upon publication in the Official Journal"}, {"sym": "G/SPS/N/CRI/352", "more": 0, "area": "SPS", "group": "식물검역", "date": "2026-03-18", "member": "코스타리카", "type": "정규통보", "topic": "수입요건", "ko": "튀르키예산 석류 생과 수입 결의안", "orig": "Proyecto de Resolución para regular la importación de frutas de Grana         <p>WTO ePing에 배포된 SPS 통보 전체와 식품 관련 TBT 통보를 모아, Claude가 원문을 읽고 초안을 쓰면 담당자가 확인해 정리합니다. 발행은 수시로 합니다. 지금 실린 호의 국문 제목·분류·편집자 노트는 모두 담당자 검토 전 초안입니다.${ALL.length > UNIQ.length ? ' 기간이 겹치는 호가 있어, 같은 통보가 두 호에 함께 실린 경우 전체 호 보기에서는 1건으로 셉니다.' : ''} 국문 제목은 원제를 바탕으로 한 참고용이며, 규정의 법적 의미는 원문으로 확인해 주세요. 북마크는 지금 쓰는 브라우저에만 저장됩니다.</p>
      </div>`;
    const bind = (id, key, ev = 'change', val = (e) => e.target.value) => $(id).addEventListener(ev, (e) => { F[key] = val(e); renderFeed(); });
    let t = null; $('f-q').addEventListener('input', (e) => { clearTimeout(t); t = setTimeout(() => { F.q = e.target.value; renderFeed(); }, 120); });
    bind('f-group', 'group'); bind('f-member', 'member');
    $('f-scope').addEventListener('change', (e) => { F.scope = e.target.value; F.member = ''; renderHome(); syncBm(); $('feed-top')?.scrollIntoView({ block: 'start' }); });
    bind('f-open', 'open', 'change', e => e.target.checked); bind('f-marked', 'marked', 'change', e => e.target.checked);
    $('f-clear').onclick = () => { F = { q: '', group: '', member: '', open: false, marked: false, scope: F.scope }; renderHome(); syncBm(); };
    renderFeed();
  }

  function renderFeed() {
    const q = F.q.trim().toLowerCase();
    const base = F.scope === 'all' ? UNIQ : scopeItems().map(x => ({ ...x, issue: ISSUES.find(i => i.id === F.scope) }));
    const rows = base.filter(x => (!F.group || x.group === F.group) && (!F.member || x.member === F.member) &&
      (!F.open || (x.deadline && left(x.deadline) >= 0)) && (!F.marked || marks.has(x.sym)) &&
      (!q || [x.sym, x.member, x.topic, x.ko, x.orig, x.products, x.hs, x.desc].join(' ').toLowerCase().includes(q)))
      .sort((a, b) => (a.deadline && left(a.deadline) >= 0 ? 0 : 1) - (b.deadline && left(b.deadline) >= 0 ? 0 : 1) || GROUPS.indexOf(a.group) - GROUPS.indexOf(b.group) || b.date.localeCompare(a.date));
    const active = F.q || F.group || F.member || F.open || F.marked;
    $('f-count').textContent = `${rows.length}건`;
    $('f-clear').hidden = !active;
    $('feed').innerHTML = rows.length ? rows.map(card).join('') :
      `<li class="empty"><b>${F.marked && !marks.size ? '아직 북마크한 통보가 없습니다' : '조건에 맞는 통보가 없습니다'}</b><span>${F.marked && !marks.size ? '카드의 북마크를 누르면 여기에 모입니다.' : '검색어나 필터를 바꿔 보세요.'}</span></li>`;
    $('feed').querySelectorAll('[data-mark]').forEach(b => b.onclick = () => { toggleMark(b.dataset.mark); renderFeed(); });
  }

  function ref(x) {
    const d = x.deadline && left(x.deadline) >= 0 ? ` · 의견 ${md(x.deadline)}까지` : '';
    return `<li><a href="#${itemId(x.sym)}">${esc(x.member)} — ${esc(x.ko)}</a><small><span class="sym">${esc(x.sym)}</span>${d}</small></li>`;
  }

  function renderPost(x) {
    const map = Object.fromEntries(x.items.map(i => [i.sym, i])), r = x.raw;
    const open = x.items.filter(i => i.deadline && left(i.deadline) >= 0).length;
    const due = x.items.filter(i => i.deadline && left(i.deadline) >= 0 && left(i.deadline) <= 21).sort((a, b) => a.deadline.localeCompare(b.deadline));
    $('v-post').innerHTML = `
      <header class="post-head">
        <a class="back" href="#home">← WTO 식품 통보 브리프</a>
        <span class="kicker">${esc(x.badge)} · ${esc(x.label)}${x.edition ? ' · ' + esc(x.edition) : ''}</span>
        <h1>${esc(x.note.headline)}</h1>
        <p class="subtitle">${esc(x.note.subtitle)}</p>
        <div class="byline"><span class="avatar" aria-hidden="true">글</span><div><b>글로벌정보부</b><span class="num">${fd(x.published)} · ${readMin(x)}분 읽기</span></div></div>
      </header>
      <div class="prose">
        <p>${span(x)} WTO에 배포된 통보는 공동 통보를 하나로 셈하면 ${r.spsUnique + r.tbtUnique}건이었습니다. 이 가운데 SPS 통보 전부와 식품 관련 TBT 통보 <b>${x.items.length}건</b>을 실었고, ${open ? `${open}건은 의견 제출 기한이 남아 있습니다` : '의견 제출 기한이 남은 통보는 없습니다'}. 주요 동향은 다음과 같습니다.</p>
        ${x.note.themes.map(t => `<h2>${esc(t.title)}</h2><p>${esc(t.text)}</p><ul class="refs">${t.syms.map(s => map[s]).filter(Boolean).map(ref).join('')}</ul>`).join('')}
        ${due.length ? `<h2>의견 제출 기한이 다가오는 통보</h2><p>앞으로 3주 안에 마감되는 통보는 ${due.length}건이고, 가장 빠른 마감은 ${md(due[0].deadline)}입니다.</p><ul class="refs">${due.map(ref).join('')}</ul>` : ''}
        <p>나머지 통보는 <a href="#home" id="to-feed">이 호의 통보 목록</a>에서 분야·통보국별로 찾아볼 수 있습니다.</p>
      </div>
      <nav class="pager" aria-label="다른 호">
        ${(() => { const k = ISSUES.indexOf(x), older = ISSUES[k + 1], newer = ISSUES[k - 1];
          return (older ? `<a href="#${postId(older)}"><span>← 이전 호 · ${esc(older.badge)}</span><b>${esc(older.note.headline)}</b></a>` : '<span></span>') +
                 (newer ? `<a class="next" href="#${postId(newer)}"><span>다음 호 · ${esc(newer.badge)} →</span><b>${esc(newer.note.headline)}</b></a>` : '<span></span>'); })()}
      </nav>
      <p class="fine">국문 제목은 원제를 바탕으로 짧게 옮긴 참고용입니다. 규정의 법적 의미와 세부 기준은 원문으로 확인하세요. 출처: WTO ePing 통보 데이터(WTO API, ${fd(x.fetched)} 조회).</p>`;
    $('to-feed').onclick = () => { F = { q: '', group: '', member: '', open: false, marked: false, scope: x.id }; setTimeout(() => $('feed-top')?.scrollIntoView({ block: 'start' }), 40); };
  }

  function renderItem(x) {
    const home = x.issue, list = home.items, i = list.findIndex(y => y.sym === x.sym);
    const ins = issuesOf(x.sym);
    const prev = list[i - 1], next = list[i + 1];
    const fact = (k, v, full) => v ? `<div class="${full ? 'full' : ''}"><dt>${k}</dt><dd>${v}</dd></div>` : '';
    $('v-item').innerHTML = `
      <header class="post-head">
        <a class="back" href="#${postId(home)}">← ${esc(home.badge)}</a>
        <span class="kicker">${esc(x.member)} · ${esc(x.group)} · ${esc(x.topic)}</span>
        <h1 style="font-size:clamp(24px,5vw,32px)">${esc(x.ko)}</h1>
        <p class="subtitle" lang="en" style="font-size:15.5px">${esc(x.orig)}</p>
        <div class="byline"><span class="avatar" aria-hidden="true">${esc(x.area)}</span><div><b class="sym" style="font-size:13.5px">${esc(x.sym)}${x.more ? ' 외 ' + x.more + '건' : ''}</b><span class="num">배포 ${fd(x.date)} · ${esc(x.type)}</span></div><span class="sp"></span>
          <button type="button" class="ghost" id="it-mark" aria-pressed="${marks.has(x.sym)}">${BM_ICON}<span>${marks.has(x.sym) ? '저장됨' : '북마크'}</span></button></div>
      </header>
      <dl class="facts">
        ${fact('의견 제출 기한', x.deadline ? `${fd(x.deadline)}${left(x.deadline) >= 0 ? ` <span style="color:var(--${left(x.deadline) <= 14 ? 'warn' : 'ink-3'});font-size:13px">D-${left(x.deadline)}</span>` : ' (마감)'}` : '기재 없음')}
        ${fact('통보 유형', esc(x.type))}
        ${fact('실린 호', ins.map(j => `<a href="#${postId(j)}">${esc(j.badge)}</a>`).join(' · '))}
        ${fact('채택 예정', esc(x.adopt) || '기재 없음')}
        ${fact('시행 예정', esc(x.eif) || '기재 없음')}
        ${fact('대상 품목', esc(x.products) || '기재 없음', true)}
        ${x.hs ? fact('HS 코드', `<span class="num">${esc(x.hs)}</span>`, true) : ''}
        ${x.note ? fact('비고', esc(x.note), true) : ''}
      </dl>
      <section class="srcbox" aria-labelledby="h-src">
        <h2 id="h-src">통보 내용</h2>
        <span class="label">WTO ePing에 등록된 설명을 원문 그대로 옮겼습니다.</span>
        <blockquote lang="en">${esc(x.desc) || '설명이 등록되지 않았습니다.'}</blockquote>
      </section>
      <div class="actions"><a class="btn" href="${esc(x.link)}" target="_blank" rel="noopener">WTO 원문 열기</a></div>
      <nav class="pager" aria-label="다른 통보">
        ${prev ? `<a href="#${itemId(prev.sym)}"><span>← 이전 통보</span><b>${esc(prev.ko)}</b></a>` : '<span></span>'}
        ${next ? `<a class="next" href="#${itemId(next.sym)}"><span>다음 통보 →</span><b>${esc(next.ko)}</b></a>` : '<span></span>'}
      </nav>
      <p class="fine">국문 제목은 참고용입니다. 법적 의미와 세부 기준은 원문으로 확인하세요.</p>`;
    $('it-mark').onclick = () => { toggleMark(x.sym); renderItem(x); };
  }

  function syncBm() { $('bm-count').textContent = marks.size; $('bm-btn').setAttribute('aria-pressed', String(F.marked)); }
  $('bm-btn').onclick = () => { F.marked = !F.marked; if (location.hash && location.hash !== '#home') location.hash = 'home'; else { renderHome(); } syncBm(); setTimeout(() => $('feed')?.scrollIntoView({ block: 'start' }), 30); };

  function route() {
    const h = location.hash.slice(1);
    const post = ISSUES.find(i => postId(i) === h);
    const item = UNIQ.find(x => itemId(x.sym) === h);
    $('v-home').hidden = !!(post || item); $('v-post').hidden = !post; $('v-item').hidden = !item;
    if (post) { renderPost(post); document.title = post.note.headline + ' · WTO 식품 통보 브리프'; }
    else if (item) { renderItem(item); document.title = item.ko + ' · WTO 식품 통보 브리프'; }
    else { renderHome(); document.title = 'WTO 식품 통보 브리프'; if (F.scope !== ISSUE.id || F.q || F.group || F.member || F.open || F.marked) setTimeout(() => $('feed-top')?.scrollIntoView({ block: 'start' }), 30); }
    syncBm(); if (!(!post && !item && (F.scope !== ISSUE.id))) window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>

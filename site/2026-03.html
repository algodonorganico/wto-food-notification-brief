/* 레이아웃: 블로그형 통보 정리. 홈(발행물 소개 → 이번 호 글 → 통보 피드·필터) / 글(#issue-n) / 통보 상세(#n-…). 본문 680px, 피드 760px */
:root {
  --bg: #F4F6FA;
  --card: #FFFFFF;
  --ink: #171B33;
  --ink-2: #4A5170;
  --ink-3: #7A819B;
  --rule: #DDE2EC;
  --tint: #ECF0F7;
  --accent: #1F4AA8;
  --accent-soft: #E3EAF8;
  --warn: #8F5400;
  --warn-soft: #FBEFD9;
  --alert: #C8102E;
  --alert-soft: #FCE8EB;
  --focus: #1F4AA8;
  --wto-red: #E30613;
  --wto-blue: #1F4AA8;
  --wto-green: #1E9B4B;
  --eping-top: #8FB0E6;
  --eping-bot: #1D3E9A;
  --font: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0D1222; --card: #141A2E; --ink: #E8ECF7; --ink-2: #AAB2CC; --ink-3: #7B84A3; --rule: #252D47; --tint: #19203A; --accent: #8FB0F5; --accent-soft: #1C2A55; --warn: #E8AE57; --warn-soft: #33270F; --alert: #F4899A; --alert-soft: #3A1A24; --focus: #8FB0F5; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0D1222; --card: #141A2E; --ink: #E8ECF7; --ink-2: #AAB2CC; --ink-3: #7B84A3; --rule: #252D47; --tint: #19203A; --accent: #8FB0F5; --accent-soft: #1C2A55; --warn: #E8AE57; --warn-soft: #33270F; --alert: #F4899A; --alert-soft: #3A1A24; --focus: #8FB0F5; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 72px; }
a { color: inherit; }
h1, h2, h3 { word-break: keep-all; overflow-wrap: anywhere; }
a:focus-visible, button:focus-visible, summary:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
button { font: inherit; cursor: pointer; }
.col { max-width: 680px; margin: 0 auto; }
.wide { max-width: 760px; margin: 0 auto; }
.num { font-variant-numeric: tabular-nums; }
.sym { font-family: var(--mono); font-size: 12px; }

/* 상단 바 */
.pub { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--rule); margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.pub::before { content: ""; display: block; height: 4px; margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); background: linear-gradient(90deg, var(--wto-red) 0 33.3%, var(--wto-blue) 33.3% 66.6%, var(--wto-green) 66.6%); }
.pub .wide { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 12px; }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
.logo { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(160deg, var(--eping-top), var(--eping-bot)); color: #FFFFFF; display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.bar-actions { display: flex; align-items: center; gap: 8px; }
.ghost { font-size: 13.5px; color: var(--ink-2); background: transparent; border: 1px solid var(--rule); border-radius: 999px; padding: 6px 12px; display: inline-flex; gap: 6px; align-items: center; }
.ghost[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.ghost .n { font-weight: 700; font-variant-numeric: tabular-nums; }
.ghost { flex: none; white-space: nowrap; }
.btn { font-size: 14px; font-weight: 700; border-radius: 999px; padding: 7px 16px; border: 1px solid var(--accent); background: var(--accent); color: var(--card); }

/* 홈 */
.hero { text-align: center; padding: 48px 0 32px; display: grid; gap: 12px; justify-items: center; }
.hero .logo { width: 56px; height: 56px; border-radius: 14px; font-size: 26px; }
.hero h1 { margin: 0; font-size: clamp(30px, 6vw, 40px); font-weight: 800; letter-spacing: -0.03em; }
.hero p { margin: 0; color: var(--ink-2); font-size: 16.5px; line-height: 1.6; max-width: 32em; }
.hero small { color: var(--ink-3); font-size: 13px; }
.featured { display: grid; gap: 8px; padding: 22px 24px; background: var(--card); border: 1px solid var(--rule); border-radius: 14px; text-decoration: none; }
.featured:hover h2 { color: var(--accent); }
.featured .k { font-size: 12.5px; font-weight: 700; color: var(--accent); }
.featured h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.4; }
.featured p { margin: 0; color: var(--ink-2); font-size: 15px; line-height: 1.6; }
.meta { font-size: 13px; color: var(--ink-3); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.feed-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 40px 0 12px; flex-wrap: wrap; }
.feed-head h2 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.015em; }
.feed-head span { font-size: 13px; color: var(--ink-3); }
.toolbar { display: grid; gap: 10px; padding: 14px; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
.toolbar .row1 { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 8px; }
@media (max-width: 600px) { .toolbar .row1 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .toolbar .row1 input { grid-column: 1 / -1; } }
.toolbar input[type=search], .toolbar select { font: inherit; font-size: 14px; color: var(--ink); background: var(--tint); border: 1px solid var(--rule); border-radius: 8px; padding: 7px 10px; min-height: 36px; min-width: 0; }
.toolbar .row2 { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; color: var(--ink-2); }
.toolbar label.chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.toolbar label.chk input { width: 16px; height: 16px; accent-color: var(--accent); }
.toolbar .clear { margin-left: auto; background: none; border: 0; color: var(--accent); font-size: 13px; font-weight: 700; padding: 0; }
.feed { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 12px; }
.ncard { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 18px 20px; display: grid; gap: 8px; }
.ncard:hover { border-color: var(--ink-3); }
.nmeta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 12.5px; color: var(--ink-3); }
.nmeta b { color: var(--ink); font-weight: 700; font-size: 13px; }
.badge { font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 5px; background: var(--tint); color: var(--ink-2); }
.badge.alert { background: var(--alert-soft); color: var(--alert); }
.badge.accent { background: var(--accent-soft); color: var(--accent); }
.ncard h3 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.5; letter-spacing: -0.01em; }
.ncard h3 a { text-decoration: none; }
.ncard h3 a:hover { color: var(--accent); }
.ncard .orig { margin: 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.nfoot { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12.5px; color: var(--ink-3); border-top: 1px solid var(--rule); padding-top: 10px; margin-top: 2px; }
.nfoot .due { color: var(--ink-2); }
.nfoot .due.soon { color: var(--warn); font-weight: 700; }
.nfoot .sp { flex: 1; }
.mark { background: none; border: 0; color: var(--ink-3); font-size: 12.5px; padding: 2px 4px; display: inline-flex; gap: 4px; align-items: center; }
.mark[aria-pressed="true"] { color: var(--accent); font-weight: 700; }
.mark svg { width: 14px; height: 14px; }
.more { color: var(--ink); font-weight: 700; text-decoration: none; font-size: 12.5px; }
.more:hover { color: var(--accent); }
.empty { text-align: center; padding: 40px 16px; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; color: var(--ink-2); display: grid; gap: 8px; justify-items: center; }
.empty b { color: var(--ink); }
.about { padding: 36px 0 0; color: var(--ink-2); font-size: 14.5px; line-height: 1.75; display: grid; gap: 8px; }
.about h3 { margin: 0; color: var(--ink); font-size: 15px; }
.about p { margin: 0; }

/* 글·상세 공통 */
.back { font-size: 14px; color: var(--ink-3); text-decoration: none; width: fit-content; }
.back:hover { color: var(--accent); }
.post-head { padding: 40px 0 24px; display: grid; gap: 14px; }
.kicker { font-size: 13px; font-weight: 700; color: var(--accent); }
.post-head h1 { margin: 0; font-size: clamp(28px, 6vw, 40px); font-weight: 800; letter-spacing: -0.035em; line-height: 1.28; text-wrap: balance; }
.subtitle { margin: 0; font-size: 18.5px; color: var(--ink-2); line-height: 1.55; }
.byline { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin-top: 4px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }
.byline b { display: block; font-size: 14.5px; font-weight: 700; }
.byline span { font-size: 13px; color: var(--ink-3); }
.byline .sp { flex: 1; }

 the Brazilian Official Gazette (DOU - Diário Oficial da União).", "adopt": "To be determined after the end of the consultation period.", "eif": "To be determined after the end of the consultation period."}, {"sym": "G/SPS/N/KOR/840", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-03", "member": "한국", "type": "정규통보", "topic": "식품첨가물", "ko": "식품첨가물의 기준 및 규격 개정안(고시 2026-084) — 영양강화제 확대, 아황산류·감미료 사용기준 개정 등", "orig": "Proposed amendments to the “Standards and Specifications for Food Additives” (Notice No. 2026-084, 13 February 2026)", "products": "Food additives", "hs": "", "deadline": "2026-05-02", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NKOR840.docx", "note": "우리나라 통보", "desc": "The Republic of Korea is proposing to amend the \"Standards and Specifications for Food Additives\". The main points of the amendments are as follows: 1) The use of nutritional fortifiers, including new designations will be expanded; 2) Standards for the use of sulfites and other substances will be revised; 3) Ingredient specifications for phosphates and other substances will be revised; 4) Standards for the use of sweeteners will be revised; 5) Testing methods for ingredient specifications and specific gravity measurements for food additives will be revised.", "adopt": "To be determined.", "eif": "To be determined."}, {"sym": "G/SPS/N/KOR/841", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-03", "member": "한국", "type": "정규통보", "topic": "식품첨가물", "ko": "식품첨가물의 기준 및 규격 개정안(고시 2026-083) — 감미료 사용기준 개정, 향료 관리 강화", "orig": "Proposed amendments to the “Standards and Specifications for Food Additives” (Notice No. 2026-083, 13 February 2026)", "products": "Food additives", "hs": "", "deadline": "2026-05-02", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NKOR841.docx", "note": "우리나라 통보", "desc": "The Republic of Korea is proposing to amend the \"Standards and Specifications for Food Additives\". The main points of the amendments are as follows: 1) Standards for the use of sweeteners will be revised; 2) Managements standards for flavouring substances and other substances will be strengthened.", "adopt": "To be determined.", "eif": "To be determined."}, {"sym": "G/SPS/N/USA/3559", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-03", "member": "미국", "type": "정규통보", "topic": "농약 잔류허용기준", "ko": "재등록 평가에 따른 농약 잔류허용기준 일괄 조정 최종 규칙(말레산 하이드라자이드 등)", "orig": "Pesticide Tolerances; Implementing Registration Review Decisions for Certain Pesticides; Maleic Hydrazide, et al.", "products": "Multiple commodities", "hs": "", "deadline": "2026-05-02", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NUSA3559.docx", "note": "", "desc": "The Environmental Protection Agency (EPA or Agency) is finalizing several pesticide tolerance actions under the Federal Food, Drug, and Cosmetic Act (FFDCA) that the Agency previously determined were necessary or appropriate during the registration review conducted under the Federal Insecticide, Fungicide, and Rodenticide Act (FIFRA). During registration review, EPA reviews all aspects of a pesticide case, including existing tolerances, to ensure that the pesticide continues to meet the standard for registration under FIFRA. The Agency is also finalizing tolerance actions identified outside of registration review as housekeeping measures, such as removing expired tolerances from the Code of Federal Register (CFR). The pesticide tolerances and active ingredients addressed in this rulemaking are identified and discussed in detail in Unit III. of this document.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/USA/3560", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-03", "member": "미국", "type": "정규통보", "topic": "농약 잔류허용기준", "ko": "피리데이트 잔류허용기준 개정(박하 등)", "orig": "Pyridate; Pesticide Tolerances", "products": "Multiple commodities", "hs": "", "deadline": "2026-04-28", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NUSA3560.docx", "note": "", "desc": "This regulation revises a use of pyridate on mint (with tolerances on mint, fresh leaves and mint, dried leaves); a crop group expansion to field corn subgroup 15-22C; and a crop group conversion to vegetable, brassica, head and stem, group 5-16, which includes a tolerance on orphan crop kohlrabi. The Interregional Project Number 4 (IR-4) requested this tolerance under the Federal Food, Drug, and Cosmetic Act (FFDCA).", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/EU/923", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-04", "member": "유럽연합", "type": "정규통보", "topic": "기능성 원료", "ko": "홍국(붉은누룩쌀) 유래 모나콜린의 식품 사용 금지안", "orig": "DraftCommission Regulation amending Annex III to Regulation (EC) No 1925/2006 of the European Parliament and of the Council as regards monacolins from red yeast rice (Text with EEA relevance)", "products": "Food products", "hs": "", "deadline": "2026-05-03", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEU923.docx", "note": "", "desc": "This draft Commission Regulation aims to prohibit the use of monacolins from red yeast rice in food based on the scientific opinion of EFSA and following a period of Union scrutiny during which food business operators, or any other interested parties, may submit scientific data to demonstrate the safety of plant preparations in question.On 25 June 2018, EFSA adopted a scientific opinion on the safety of monacolins in red yeast rice. In that opinion, it considered that the available information on the adverse effects reported in humans was judged to be sufficient to conclude that monacolins from red yeast rice were of significant safety concern at intake levels as low as 3 mg/day. EFSA was unable to provide advice on a daily intake of monacolins from red yeast rice that does not give rise to concerns for human health. Considering the significant harmful effect on health associated with the use of monacolins at levels as low as 3 mg/day and that no safe daily intake level could be set, the use of the substance in food was restricted and at the same time placed under Union scrutiny by means of Regulation (EU) 2022/860 of 1 June 2022 for a period of four years from the entry into application of that Regulation. On 29 January 2025, EFSA adopted a scientific opinion on additional scientific data related to the safety of monacolins from red yeast rice submitted pursuant to Article 8(4) of Regulation (EC) No 1925/2006. In its opinion, EFSA concluded that the data submitted by interested parties during the Union scrutiny period do not allow establishing the safety of monacolins from red yeast rice at intake levels below 3 mg/day or identifying a safe daily intake of monacolins from red yeast rice. Therefore, pursuant to the procedure of Article 8(5) of Regulation (EC) No 1925/2006, monacolins from red yeast rice should be included in Part A of Annex III to Regulation (EC) No 1925/2006, which means that their use in food will be prohibited.", "adopt": "Q3 2026", "eif": "This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union . Foodstuffs containing monacolins from red yeast rice, which were lawfully placed on the market before the entry into force of this Regulation may remain on the market until [ entry into force + 12 months ]."}, {"sym": "G/SPS/N/EU/924", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-04", "member": "유럽연합", "type": "정규통보", "topic": "농약 잔류허용기준", "ko": "디페노코나졸 잔류허용기준 개정안", "orig": "Draft Commission Regulation amending Annexes II and III to Regulation (EC) No 396/2005 of the European Parliament and of the Council as regards maximum residue levels for difenoconazole in or on certain products (Text with EEA relevance)", "products": "Cereals (HS codes: 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008), foodstuffs of animal origin (HS codes: 0201, 0202, 0203, 0204, 0205, 0206, 0207, 0208, 0209, 0210) and certain products of plant origin, including fruit and vegetables", "hs": "10, 02, 0201, 0202, 0203, 0204, 0205, 0206, 0207, 0208, 0209, 0210, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008", "deadline": "2026-05-03", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEU924.docx", "note": "", "desc": "The proposed draft Regulation concerns the review of existing MRLs for difenoconazole in certain food commodities. Some MRLs for this substance are increased and some MRLs in certain commodities are lowered. Lower MRLs are set after deleting old uses which are not authorised any more in the European Union. The proposed draft Regulation also addresses import tolerances in various crops.", "adopt": "", "eif": "This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union, and apply six months thereafter."}, {"sym": "G/SPS/N/PAN/114", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-04", "member": "파나마", "type": "정규통보", "topic": "시험·검사", "ko": "유제품 시료채취·분석방법 기술지침", "orig": "Guía Técnica - Tecnología de los alimentos. Productos lácteos. Toma de muestra y métodos de análisis (Technical Guide - Food Technology. Milk products. Sampling and Analysis Methods).", "products": "Milk and milk products in general (ICS code: 67.100.01)", "hs": "04", "deadline": "2026-05-03", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NPAN114.docx", "note": "같은 지침을 TBT로도 통보(G/TBT/N/PAN/156)", "desc": "This Technical Guide establishes the technical guidelines for sampling and analysis methods applicable to milk and milk products that are produced in, imported into, distributed and marketed in the Republic of Panama, to ensure standardized procedures, guarantee the quality and safety of products, and support control and verification actions undertaken by the competent authorities.", "adopt": "To be determined", "eif": "To be determined"}, {"sym": "G/SPS/N/PAN/115", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-04", "member": "파나마", "type": "정규통보", "topic": "품질규격", "ko": "체다치즈 기술규정", "orig": "Reglamento Técnico - Tecnología de los alimentos. Productos lácteos. Cheddar. Especificaciones (Technical Regulations - Food technology. Milk products. Cheddar. Specifications).", "products": "Cheese (ICS code: 67.100.30)", "hs": "0406", "deadline": "2026-05-03", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NPAN115.docx", "note": "같은 기술규정을 TBT로도 통보(G/TBT/N/PAN/157)", "desc": "The notified Technical Regulations establish the technical and sanitary provisions for cheddar cheese. They apply to the manufacturing, handling, distribution and marketing of this product.", "adopt": "To be determined", "eif": "To be determined"}, {"sym": "G/SPS/N/PAN/116", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-04", "member": "파나마", "type": "정규통보", "topic": "품질규격", "ko": "모차렐라치즈 기술규정", "orig": "Reglamento Técnico - Tecnología de los alimentos. Productos lácteos. Mozarella. Especificaciones. (Technical Regulations: Food Technology. Dairy products. Mozzarella. Specifications.)", "products": "Cheese (ICS code: 67.100.30)", "hs": "0406", "deadline": "2026-05-03", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NPAN116.docx", "note": "같은 기술규정을 TBT로도 통보(G/TBT/N/PAN/158)", "desc": "The notified Technical Regulations establish the technical and sanitary, and quality provisions for mozzarella cheese. They apply to the manufacturing, handling, distribution and marketing of this product.", "adopt": "To be determined", "eif": "To be determined"}, {"sym": "G/SPS/N/EU/925", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-05", "member": "유럽연합", "type": "정규통보", "topic": "식품첨가물", "ko": "카라기난·로커스트콩검·구아검·아라비아검·잔탄검·펙틴 등 사용조건 개정 — 규정 (EU) 2026/196", "orig": "Commission Regulation (EU) 2026/196 of 28 January 2026 amending Regulation (EC) No 1333/2008 of the European Parliament and of the Council as regards the use of carrageenan (E 407), locust bean gum (E 410), guar gum (E 412), gum arabic (acacia gum) (E 414), xanthan gum (E 415), pectins (E 440) and starch sodium octenyl succinate (E 1450) and Commission Regulation (EU) No 231/2012 as regards specifications for locust bean gum (E 410), guar gum (E 412), gum arabic (acacia gum) (E 414), xanthan gum (E 415), pectins (E 440) and starch sodium octenyl succinate (E 1450) (Text with EEA relevance)", "products": "Food products", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEU925.docx", "note": "", "desc": "Commission Regulation (EU) 2026/196 amends Regulation (EC) No 1333/2008 as regards the use of carrageenan (E 407), locust bean gum (E 410), guar gum (E 412), gum arabic (acacia gum) (E 414), xanthan gum (E 415), pectins (E 440) and starch sodium octenyl succinate (E 1450), and Commission Regulation (EU) No 231/2012 as regards specifications for locust bean gum (E 410), guar gum (E 412), gum arabic (acacia gum) (E 414), xanthan gum (E 415), pectins (E 440) and starch sodium octenyl succinate (E 1450).The safety of the mentioned food additives was re-evaluated by the European Food Safety Authority (EFSA) in the context of the EU programme for the re-evaluation of approved food additives. In its scientific opinions on the follow-up to the re-evaluation of the above-mentioned food additives, EFSA recommended some modifications to the existing EU specifications. In line with the EFSA opinions, the draft measure proposes to lower or include maximum limits for toxic elements present as impurities, to include maximum limits for aluminium present as impurity, to include the maximum protein content and to harmonise the microbiological criteria among the different hydrocolloids. Since the submitted data for guar gum (E 412) are not sufficient to support the safe use in food for infants and young children, the draft measure proposes to withdraw the authorisation for guar gum in the relevant food categories. As regards the EFSA recommendation related to the need for an absence of a residual enzyme activity for xanthan gum (E 415), there must be step(s) in the production process where enzymes are removed or inactivated to avoid reacting with the foods to which E 415 is added.For locust bean gum (E 410), pectins (E 440) and starch sodium octenyl succinate (E 1450), the draft proposes to lower their maximum levels for food for infants and young children as the dietary exposure from those foods is too high in comparison to the identified reference point.", "adopt": "", "eif": "This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union. It shall apply from 18 August 2026 or 27 April 2027 depending on the food category."}, {"sym": "G/SPS/N/PAN/117", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-05", "member": "파나마", "type": "정규통보", "topic": "품질규격", "ko": "가향 액상우유 기술규정", "orig": "Reglamento Técnico. Tecnología de los alimentos. Productos lácteos. Leche líquida saborizada. Especificaciones (Technical Regulations: Food technology. Milk products. Flavoured liquid milk. Specifications).", "products": "Milk and processed milk products (ICS code: 67.100.10)", "hs": "0402", "deadline": "2026-05-04", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NPAN117.docx", "note": "같은 기술규정을 TBT로도 통보(G/TBT/N/PAN/159)", "desc": "The notified Technical Regulations establish the technical requirements that liquid milk with flavours must meet.", "adopt": "To be determined", "eif": "To be determined"}, {"sym": "G/SPS/N/ALB/216", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-06", "member": "알바니아", "type": "정규통보", "topic": "유기식품", "ko": "해조류·양식 수산물 유기 생산 세부 규칙", "orig": "Detailed rules for the organic production of algae and aquaculture species", "products": "Aquatic plant species and aquatic animal species", "hs": "03", "deadline": "2026-05-05", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NALB216.docx", "note": "", "desc": "This instruction defines the production rules for the organic production of aquatic plant species and aquatic animal species, and in particular for the species: fish, crustaceans (such as crabs, shrimps and lobsters), echinoderms and molluscs.Draft instruction \"On Detailed rules for the organic production of algae and aquaculture species\" is partially approximated with Part III, of Annex II, of Regulation (EU) 2018/848 of the European Parliament and of the Council of 30 May 2018 on organic production and labelling of organic products and repealing Council Regulation (EC) No 834/2007.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/TZA/498", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-06", "member": "탄자니아", "type": "정규통보", "topic": "품질규격", "ko": "견과·유지종자 버터 탄자니아 표준안", "orig": "AFDC 4 (3880) DTZS, Nut or oilseed butter — Specification First Edition", "products": "Other animal fats and oils and their fractions, whether or not refined, but not chemically modified (HS code(s): 1506); Oilseeds (ICS code(s): 67.200.20)", "hs": "1506", "deadline": "2026-05-05", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTZA498.docx", "note": "같은 표준안을 TBT로도 통보(G/TBT/N/TZA/1514)", "desc": "This Tanzania standard specifies the requirements, sampling and test methods for nut or oilseed butter intended for human consumption. This standard does not apply to nut or oilseed butters which are covered by specific standards such as peanut butter, cashew butter and almond butter.Note: This Draft Tanzania Standard was also notified under TBT Committee.", "adopt": "To be determined and notified.", "eif": "To be determined."}, {"sym": "G/SPS/N/TZA/499", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-06", "member": "탄자니아", "type": "정규통보", "topic": "품질규격", "ko": "조 팜핵유 탄자니아 표준안", "orig": "AFDC 04 (3877) DTZS, Crude palm kernel oil — Specificatio SPS/N/CAN/1635", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-09", "member": "캐나다", "type": "정규통보", "topic": "농약 잔류허용기준", "ko": "플루아자인돌리진 잔류허용기준안(PMRL2026-04)", "orig": "Proposed Maximum Residue Limit: Fluazaindolizine (PMRL2026-04)", "products": "Pesticide fluazaindolizine in or on various commodities (ICS codes: 65.020, 65.100, 67.040, 67.080)", "hs": "", "deadline": "2026-05-12", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCAN1635.docx", "note": "", "desc": "The objective of the notified document PMRL2026-04 is to consult on the listed maximum residue limits (MRLs) for fluazaindolizine that have been proposed by Health Canada’s Pest Management Regulatory Agency (PMRA).MRL (ppm)1 Raw Agricultural Commodity (RAC) and/or Processed Commodity 0.15 Low growing berries (crop subgroup 13-07G)2 0.04 Small fruits vine climbing, except fuzzy kiwifruit (crop subgroup 13-07F), tree nuts (crop group 14-11) 0.02 Leafy vegetables (crop group 4-13); Brassica head and stem vegetable group (crop group 5-13)3 0.01 Stone fruits (crop group 12-09) 1 ppm = parts per million2 This MRL is proposed to replace the currently established MRL of 0.01 ppm for Low growing berries (crop subgroup 13-07G).3 This MRL is proposed to replace the currently established MRL of 0.015 ppm for Leafy vegetables (crop group 4-13) and Brassica head and stem vegetable group (crop group 5-13).The commodities included in the listed crop groups/subgroups can be found on the Residue Chemistry Crop Groups webpage (https://www.canada.ca/en/health-canada/services/consumer-product-safety/pesticides-pest-management/public/protecting-your-health-environment/pesticides-food/residue-chemistry-crop-groups.html) in the Pesticides section of the Canada.ca website.", "adopt": "Normally within four to five months from the posting of the Proposed MRL document on the Health Canada website.", "eif": "On the date the measure is adopted."}, {"sym": "G/SPS/N/CAN/1636", "more": 0, "area": "SP nzania Standard was also notified under TBT Committee.", "adopt": "To be determined and notified.", "eif": "To be determined."}, {"sym": "G/SPS/N/CHE/101", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-11", "member": "스위스", "type": "긴급통보", "topic": "수입검사", "ko": "식품법 시행령 — 특정 국가산 비동물성 식품·사료 반입 검사 강화 및 곰팡이독소 특별 수입조건(긴급)", "orig": "Ordinance on the Implementation of Foodstuffs Legislation", "products": "Arachidonic Acid oil originating from China and multiple commodities", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCHE101.docx", "note": "", "desc": "The Ordinance on the Implementation of Foodstuffs Legislation lays down rules concerning the temporary increase of official controls upon entry into Switzerland on certain food and feed of non-animal origin from certain third countries (in Annex II); special import conditions for certain food and feed from certain third countries due to the contamination risk by mycotoxins, including aflatoxins, pesticide residues, and microbiological contamination (in Annex III - increased official border controls and official certificate accompanied by the results of sampling and analysis in the third country). This Implementing Regulation amends both Annexes by updating it to the modifications implemented by theCommission implementing regulation (EU) 2026/194 of 28 January 2026 amending Implementing Regulation (EU) 2019/1793 on the temporary increase of official controls and emergency measures governing the entry into the Union of certain goods from certain third countries implementing Regulations (EU) 2017/625; and Commission implemtening regulation EC No 178/2002 of the European Parliament and of the Counciland 2026/459 of 24 February 2026 amending Implementing Regulation (EU) 2019/1793 as regards the temporary increase of official controls and emergency measures governing the entry into the Union of arachidonic acid oil origination in China.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/EU/916/Corr.1", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-11", "member": "유럽연합", "type": "정정통보", "topic": "농약 잔류허용기준", "ko": "베노밀·카벤다짐·티오파네이트메틸 잔류허용기준안 통보 정정", "orig": "Maximum residue levels for benomyl, carbendazim and thiophanate-methyl in or on certain products", "products": "Cereals (HS codes: 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008), foodstuffs of animal origin (HS codes: 0201, 0202, 0203, 0204, 0205, 0206, 0207, 0208, 0209, 0210) and certain products of plant origin, including fruit and vegetables", "hs": "10, 02", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEU916C1.docx", "note": "", "desc": "This corrigendum corrects an error in Box 11 of notification G/SPS/N/EU/916 of 5 February 2026 (Draft Commission Regulation amending Annexes II, III and V to Regulation (EC) No 396/2005 of the European Parliament and of the Council as regards maximum residue levels for benomyl, carbendazim and thiophanate‐methyl in or on certain products (Text with EEA relevance)).“This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union and apply three months thereafter” should read “This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union, and apply six months thereafter”.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/EU/930", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-11", "member": "유럽연합", "type": "정규통보", "topic": "오염물질", "ko": "식품 중 광물유 방향족 탄화수소(MOAH) 최대기준 설정안", "orig": "Draft Commission Regulation (EU) amending Regulation (EU) 2023/915 as regards maximum levels of mineral oil aromatic hydrocarbons in food (Text with EEA relevance)", "products": "Oilseeds, oil fruits, animal and vegetable fats and oils, tree nuts, pulses, cereal grains and products derived from cereals, milk, dairy products, cocoa beans and cocoa products, confectionary, spices, dried herbs, tea and herbal infusions, foods for infants and young children, food supplements and food additives", "hs": "", "deadline": "2026-05-10", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEU930.docx", "note": "", "desc": "The draft Regulation establishes maximum levels for mineral oil aromatic hydrocarbons in tree nuts, vegetables, seaweed, pulses, oilseeds, cereals, cocoa and chocolate products, food for oilseeds, oil fruits, animal and vegetable fats and oils, tree nuts, pulses, cereal grains and products derived from cereals, milk, dairy products, cocoa beans and cocoa products, spices, dried herbs, tea and herbal infusions, foods for infants and young children, food supplements and food additives. Taking into account the outcome of the EFSA updated risk assessment of mineral oil hydrocarbons in food, the maximum levels for mineral oil aromatic hydrocarbons are established to ensure a high level of human health protection.", "adopt": "Estimated September 2026.", "eif": "This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union. It shall apply from 1 January 2027. The foodstuffs listed in the Annex, lawfully placed on the market before the entry into force of this Regulation, may remain on the market until the date of minimum durability or use-by-date."}, {"sym": "G/SPS/N/PAN/118", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-11", "member": "파나마", "type": "정규통보", "topic": "먹는물", "ko": "포장 먹는물 일반요건 기술규정", "orig": "Reglamento Técnico - Tecnología de los alimentos. Agua envasada. Requisitos generales. (Technical Regulations: Food Technology. Packaged water. General requirements.)", "products": "Non-alcoholic beverages (ICS code: 67.160.20)", "hs": "", "deadline": "2026-05-10", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NPAN118.docx", "note": "같은 기술규정을 TBT로도 통보(G/TBT/N/PAN/160, 161 parts intended for human consumption.Note: This Draft Tanzania Standard was also notified under TBT Committee.", "adopt": "To be determined and notified.", "eif": "To be determined."}, {"sym": "G/SPS/N/TZA/528", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-16", "member": "탄자니아", "type": "정규통보", "topic": "품질규격", "ko": "양 도체·부분육 탄자니아 표준안", "orig": "AFDC (4297) DTZS, Lamb and mutton carcasses and meat cuts — Specification, First Edition", "products": "Meat and edible meat offal (HS code(s): 02); Meat and meat products (ICS code(s): 67.120.10)", "hs": "02", "deadline": "2026-05-15", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTZA528.docx", "note": "같은 표준안을 TBT로도 통보(G/TBT/N/TZA/1543)", "desc": "This Tanzania Standard specifies the requirements, sampling and test methods for fresh, chilled and frozen lamb and mutton carcasses and meat cuts intended for human consumption.Note: This Draft Tanzania Standard was also notified under TBT Committee.", "adopt": "To be determined and notified.", "eif": "To be determined."}, {"sym": "G/SPS/N/TZA/529", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-16", "member": "탄자니아", "type": "정규통보", "topic": "품질규격", "ko": "카다멈 정유 탄자니아 표준안", "orig": "AFDC 7 (4025) DTZS, Essential oil of cardamom - Specification, First Edition", "products": "Essential oils other than those of citrus fruit: (HS code(s): 33012); Essential oils (ICS code(s): 71.100.60)", "hs": "33012", "deadline": "2026-05-15", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTZA529.docx", "note": "", "desc": "This Tanzania Standard specifies the requirements, methods of sampling and test for essential oil of cardamom intended for human consumption.Note: This Draft Tanzania Standard was also notified under TBT Committee.", "adopt": "To be determined and notified.", "eif": "To be determined."}, {"sym": "G/SPS/N/EU/888/Add.1", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-17", "member": "유럽연합", "type": "추가통보", "topic": "국경검사", "ko": "국경검사소 공식 검사 대상 동물성 제품·복합제품 목록 채택 — 시행규정 (EU) 2026/551", "orig": "Lists of products of animal origin, animal by-products and composite products subject to official controls at border control posts", "products": "Products of animal origin, animal by-products and composite products", "hs": "1301, 200819, 210690, 300213, 300214, 300215, 310590, 3821, 3823, 3824", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEU888A1.docx", "note": "", "desc": "The proposal notified in G/SPS/N/EU/888 (29 September 2025) is now adopted by Commission Implementing Regulation (EU) 2026/551 of 13 March 2026 amending the Annex to Implementing Regulation (EU) 2021/632 as regards the lists of products of animal origin, animal by-products and composite products subject to official controls at border control posts (Text with EEA relevance).This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union. It shall apply from 1 October 2026.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/NPL/50", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-17", "member": "네팔", "type": "정규통보", "topic": "품질규격", "ko": "냉동 디저트 네팔 표준안", "orig": "Proposed standard for frozen dessert", "products": "Frozen dessert", "hs": "", "deadline": "2026-05-16", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NNPL50.docx", "note": "", "desc": "The Department of Food Technology and Quality Control, Ministry of Agriculture and Livestock Development, Nepal, has proposed a standard for frozen dessert. This quality standard will apply to frozen desserts produced, processed, packaged, sold, and distributed for human consumption.", "adopt": "The proposed date of adoption shall be 181 days following the date of publication in the Nepal Gazette.", "eif": "181 days following the date of publication in the Nepal Gazette."}, {"sym": "G/SPS/N/NPL/51", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-17", "member": "네팔", "type": "정규통보", "topic": "품질규격", "ko": "아이스크림 네팔 표준안", "orig": "Proposed standard for ice cream", "products": "Ice cream", "hs": "210500", "deadline": "2026-05-16", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NNPL51.docx", "note": "", "desc": "The Department of Food Technology and Quality Control, Ministry of Agriculture and Livestock Development, Nepal, has proposed a standard for ice cream. This standard will apply to ice cream produced, processed, packaged, sold, and distributed for human consumption.", "adopt": "The proposed date of adoption shall be 181 days following the date of publication in the Nepal Gazette.", "eif": "181 days following the date of publication in the Nepal Gazette."}, {"sym": "G/SPS/N/AUS/631", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-19", "member": "호주", "type": "정규통보", "topic": "농약 잔류허용기준", "ko": "식품기준코드 부표 20 개정안 — 농약·동물용의약품 잔류허용기준 조정", "orig": "Proposal to amend Schedule 20 of the revised Australia New Zealand Food Standards Code (10 March 2026)", "products": "Foods in general", "hs": "", "deadline": "2026-05-18", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NAUS631.docx", "note": "", "desc": "This Proposal seeks to amend the Australia New Zealand Food Standards Code to align the following maximum residue limits (MRLs) for various agricultural and veterinary chemicals so that they are consistent with other national regulations relating to the safe and effective use of agricultural and veterinary chemicals:Azoxystrobin, Cyclaniliprole, Cyclobutrifluram, Cyprodinil, Fluopyram and Metarylpicoxamid in specified plant commodities;Cyclobutrifluram, Metarylpicoxamid and Tiafenacil in specified animal commodities.", "adopt": "Adoption anticipated May 2026.", "eif": "Entry into force anticipated May 2026."}, {"sym": "G/SPS/N/UKR/260", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-20", "member": "우크라이나", "type": "정규통보", "topic": "식품안전 일반", "ko": "SPS 분야 EU 법령 이행 법률안 — 식품안전·동물위생·식물검역 규제 정비", "orig": "Draft Law of Ukraine “On the Implementation of European Union Legislation on Enhancing Regulation in the Spheres of Sanitary and Phytosanitary Measures”", "products": "Food and food additives, animal by-products not intended for human consumption, feed and feed additives, veterinary medicines and animal welfare products, genetically modified organisms (GMOs)", "hs": "", "deadline": "2026-05-19", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NUKR260.docx", "note": "같은 법률안을 TBT로도 통보(G/TBT/N/UKR/374)", "desc": "The draft Law is developed to align the legislation of Ukraine with relevant provisions of EU law in the fields of sanitary and phytosanitary measures, in particular with regard to food safety, animal health and feed safety.Amendments to the Law of Ukraine \"On Basic Principles and Requirements for Food Safety and Quality\" introduce harmonised terminology and procedures for the authorization of food additives, flavourings, enzymes, novel foods and health claims in line with EU approaches. The amendments provide for the establishment of a unified state register of food additives, flavorings and enzymes with open public access, thereby enhancing transparency and predictability of state regulation. They also introduce requirements related to risk communication within the food chain, food safety culture, traceability, food irradiation and redistribution of food for charitable purposes, aimed at improving risk management in the food chain in accordance with a risk-based approach.Amendments to the Law of Ukraine \"On Animal By-products Not Intended for Human Consumption\" update and harmonise terminology and definitions, including those related to animals, catering waste and transmissible spongiform encephalopathies (TSEs). The amendments strengthen the classification of animal by-products by risk categories (Categories I, II and III), update the list of high-risk materials and establish restrictions on their circulation in case of veterinary and sanitary measures, in order to prevent risks to animal and public health.Amendments to the Law of Ukraine \"On the State Control over Compliance with Legislation on Food Products, Feed, Animal By-products, Animal Health and Welfare\" introduce specific import requirements for food treated with ionising radiation, including verification of compliance with applicable legislation and processing at facilities approved by the European Union, as well as certification requirements for certain consignments, in particular sprouts and seeds intended for production. The measure also strengthens official controls on specific food contact materials to ensure compliance with food safety requirements.Amendments to the Law of Ukraine “On Feed Safety and Hygiene” update terminology and establish requirements for the control and investigation of cases where maximum or threshold levels of undesirable substances in feed are exceeded. The amendments also improve procedures for the authorization, registration and operation of feed business operat", "adopt": "To be determined.", "eif": "This Law shall enter into force three months after the date of its official publication, except for: subparagraphs three to five of paragraph 11 of item 1 of Section I, which shall enter into force on the date of Ukraine’s membership in the European Union. The provisions of Articles 31-1, 31-2, 31-3, 31-4 and 31-5 of the Law of Ukraine \"On the Basic Principles and Requirements for the Safety and Quality of Foodstuffs\" shall become invalid on the date of Ukraine's membership in the European Union."}, {"sym": "G/SPS/N/IND/349", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-23", "member": "인도", "type": "정규통보", "topic": "식품용 기구·포장", "ko": "식품안전기준(포장) 개정 규정안 — 정의 추가", "orig": "Draft Food Safety and Standards (Packaging) Amendment Regulations, 2026", "products": "Food", "hs": "", "deadline": "2026-05-22", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NIND349.docx", "note": "", "desc": "Draft Food Safety and Standards (Packaging)Amendment Regulations, 2026 is related to the inclusion of additional definitions in the Regulation.", "adopt": "To be determined.", "eif": "To be determined."}, {"sym": "G/SPS/N/TPKM/651/Add.1", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-23", "member": "대만", "type": "추가통보", "topic": "수입관리", "ko": "5개 세번 식품·첨가물·기구·용기 관련 조치 공포(2026.3.24), 4.1 시행", "orig": "Those foods, food additives, food utensils, food containers or packaging classified under 5 specific CCC codes", "products": "Foods, food additives, food utensils, food containers or packaging", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NTPKM651A1.docx", "note": "", "desc": "The measure notified as G/SPS/N/TPKM/651 on 10 December 2025 will be promulgated on 24 March 2026 and will enter into force on 1 April 2026.Five categories of commodities classified under CCC codes, when intended for use as food, food additives, food utensils, food containers, or food packaging, shall follow the \"Regulations of Inspection of Imported Foods and Related Products\". Importers shall apply to the Food and Drug Administration, Ministry of Health and Welfare, for import inspection.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/IDN/138/Add.1", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-25", "member": "인도네시아", "type": "추가통보", "topic": "미생물 기준", "ko": "가공식품 미생물 최대기준 규정(BPOM 2019년 제13호) 추가통보", "orig": "Regulation of Indonesian National Food and Drug Agency Number 13 of 2019 on Maximum Limits of Microbial Contamination on Processed Food", "products": "Processed food products", "hs": "", "deadline": "2026-05-24", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NIDN138A1.docx", "note": "", "desc": "The maximum limits of microbial contaminants in processed foods are regulated under Regulation of the Indonesian FDA No. 13 of 2019 on the Maximum Limit of Microbial Contaminants in Processed Foods. This draft amendment has been developed due to advancements in science and technology, the emergence of new types of processed foods for which microbiological criteria have not yet been established, and the need to address implementation challenges of the existing regulation, including issues related to the application of microbiological criteria for certain commodities.The amendment to the regulation is limited to the following four food categories:06.4.3 Pre-cooked pasta and noodles and similar products, specifically ready-to-eat processed flour/starch-based foods;08.3.2 Meat, poultry meat, and game meat, comminuted and heat-treated, specifically sausages and meatballs subjected to pasteurization;14.1.4.3 Concentrates (liquid or solid) for flavoured water-based beverages, specifically flavoured powdered beverages containing milk or milk products, creamers, or chocolate;14.1.5 Coffee, coffee substitutes, tea, herbal infusions, and hot cereal- and grain-based beverages, excluding cocoa, specifically dry tea, powdered tea, and tea bags (including black tea, green tea, white tea, oolong tea, and scented/flavoured tea).", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/USA/3447/Add.2", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-25", "member": "미국", "type": "추가통보", "topic": "식품첨가물", "ko": "비인증 착색료 비트레드 등재 최종명령 시행일 연기", "orig": "Listing of Color Additive Exempt From Certification; Beetroot Red; Delay of Effective Date", "products": "Food technology (ICS code(s): 67)", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NUSA3447A2.docx", "note": "", "desc": "The Food and Drug Administration (FDA or we) is announcing a delay of the effective date of our 6 February 2026, final order to amend the color additive regulations to provide for the safe use of beetroot red for the coloring of human foods generally, at levels consistent with current good manufacturing practice, except in products under the jurisdiction of the United States Department of Agriculture (USDA), infant formula, or foods for which standards of identity have been issued under section 401 of the Federal Food, Drug, and Cosmetic Act (FD&C Act), unless the use of the added color is authorized by such standards. The delay of the effective date is required by law following the filing of timely objections on the final order. This announcement does not reflect a change in our determination that there is a reasonable certainty of no harm from the use of this color additive under the conditions of its intended use. In addition, this announcement does not constitute a determination that all of the issues raised in the relevant submission constitute objections or that a hearing is justified on any objections that have been filed.As of 20 March 2026, the effective date of the final order published 6 February 2026 (91 FR 5295) is delayed indefinitely. The Food and Drug Administration will publish a document in the Federal Register announcing a new effective date or other administrative action on the order.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/USA/3473/Add.2", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-25", "member": "미국", "type": "추가통보", "topic": "식품첨가물", "ko": "비인증 착색료 스피루리나 추출물 등재 최종명령 시행일 연기", "orig": "Listing of Color Additive Exempt From Certification; Spirulina Extract; Delay of Effective Date", "products": "Food technology (ICS code(s): 67)", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NUSA3473A2.docx", "note": "", "desc": "The Food and Drug Administration (FDA or we) is announcing a delay of the effective date of our 6 February 2026, final order to amend the color additive regulations to provide for the expanded safe use of spirulina (Arthrospira platensis) extract as a color additive in human foods generally (except for infant formula, certain foods subject to regulation by the US Department of Agriculture (USDA), and foods for which standards of identity have been issued under section 401 of the Federal Food, Drug, and Cosmetic Act (FD&C Act), unless the use of the added color is authorized by such standards) at levels consistent with good manufacturing practice (GMP); to lower the heavy metal specifications for lead, arsenic, and mercury; and to add a specification for cadmium. The delay of the effective date is required by law following the filing of timely objections and a request for a hearing on the final order. This announcement does not reflect a change in our determination that there is a reasonable certainty of no harm from the use of this color additive under the conditions of its intended use. In addition, this announcement does not constitute a determination that all of the issues raised in the submission constitute objections or that a hearing is justified on any objections or requests for a hearing that have been filed.As of 20 March 2026, the effective date of the final order published 6 February 2026 (91 FR 5291) is delayed indefinitely. The Food and Drug Administration will publish a document in the Federal Register announcing a new effective date or other administrative action on the order.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/EGY/162/Add.1", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-26", "member": "이집트", "type": "추가통보", "topic": "품질규격", "ko": "어류 통조림 이집트 표준 준수 6개월 경과기간 부여(장관령 57/2026)", "orig": "Canned Finfish", "products": "Fish and fishery products (ICS code: 67.120.30)", "hs": "1604", "deadline": "2026-05-25", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEGY162A1.docx", "note": "같은 표준을 TBT로도 통보(G/TBT/N/EGY/2/Add.38)", "desc": "This addendum concerns the notification of the Ministerial Decree No. 57/2026 (2 pages, in Arabic) that gives the producers and importers a six-month transitional period to abide by the Egyptian Standard ES 1521 for \"Canned Finfish\" (13 pages, in Arabic).Worth mentioning is that this standard complies with Codex Standard 119 – 1981 (CXS 119-1981) \"Canned finfish\", adopted in 1981, revised in 1995, amended in 2011, 2013, 2016, 2018 and 2024.Producers and importers are kept informed of any amendments in the Egyptian standards through the publication of administrative orders in the official gazette.Date of adoption: 22 February 2026Date of entry into force: The day following the date of publication in the official gazette.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/EGY/179", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-26", "member": "이집트", "type": "정규통보", "topic": "품질규격", "ko": "비가열 가공육 이집트 표준(ES 9238) 준수 6개월 경과기간 부여(장관령 57/2026)", "orig": "Ministerial Decree No. 57/2026", "products": "Meat and meat products (ICS code(s): 67.120.10)", "hs": "", "deadline": "2026-05-25", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEGY179.docx", "note": "같은 장관령을 TBT로도 통보(G/TBT/N/EGY/570)", "desc": "This decree gives the producers and importers a six-month transitional period to abide by the Egyptian standard ES 9238 for \"Non-heat-treated processed meat\".Worth mentioning is that this standard specifies the basic requirements and descriptive criteria for raw processed meat products that are not heat-treated, such as burgers and kofta, as well as seasoned minced meat mixtures, such as hawawshi minced meat mix and sausage minced meat mix, etc.) whether chilled or frozen.It should be noted that this standard cancels and supersedes the following standards:ES 1688/2005 for “frozen beef burger”;ES 1973/2005 for “frozen balls”;ES 1972/2005 for “frozen sausage”;ES 2097/2005 for “minced meat mixed with soya bean protein”;ES 2911/2005 for “frozen poultry sausage”.Worth mentioning is that this standard has been formulated according to National studies.", "adopt": "", "eif": "The day following the date of publication in the official gazette."}, {"sym": "G/SPS/N/EGY/78/Add.2", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-26", "member": "이집트", "type": "추가통보", "topic": "품질규격", "ko": "올리브유·올리브박유 이집트 표준 준수 6개월 경과기간 부여(장관령 57/2026)", "orig": "Olive Oils and Olive Pomace Oils", "products": "Animal and vegetable fats and oils", "hs": "1509, 1510", "deadline": "2026-05-25", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEGY78A2.docx", "note": "같은 표준을 TBT로도 통보(G/TBT/N/EGY/2/Add.39)", "desc": "This addendum concerns the notification of the Ministerial Decree No.57/2026 (2 pages, in Arabic) that gives the producers and importers a six-month transitional period to abide by the Egyptian Standard ES 49 for \"Olive Oils and Olive Pomace Oils\" (19 pages, in Arabic).It cancels and supersedes ES 49-2/2016 for \"vegetable edible oils part 2: olive oils and olive pomace oils\".It should be noted that the Ministerial Decree No. 256/2016, which was formerly notified in G/SPS/N/EGY/78 dated 16 August 2016, mandated among others the earlier version of this Egyptian Standard, and the draft of this Standard was formerly notified in G/SPS/N/EGY/78/Add.1.Worth mentioning is that this standard is technically identical to Codex Standard CXS 33 \"Olive Oils and Olive Pomace Oils\" adopted in 1981, revised in 1989, 2003, 2015, 2017 and 2024, amended in 2009, 2013 and 2021.Producers and importers are kept informed of any amendments in the Egyptian Standards through the publication of administrative orders in the official gazette.Date of adoption: 22 February 2026Date of entry into force: The day following the date of publication in the official gazette.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/GBR/123", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-26", "member": "영국", "type": "정규통보", "topic": "농약 잔류허용기준", "ko": "메펜트리플루코나졸 잔류허용기준 신설(GB MRL 등록부 개정)", "orig": "New GB MRLs for mefentrifluconazole amending the GB MRL Statutory Register", "products": "Blueberries (0154010), Currants (black, red and white) (0154030), Mulberries (black and white) (0154060) * For reference, the full list of GB commodity codes is set out in Part 1 of the GB pesticides Maximum Residue Level Statutory Register – see link", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NGBR123.docx", "note": "", "desc": "Mefentrifluconazole is an approved active substance in Great Britain (GB). An application was received by the Health and Safety Executive (HSE) requesting new Maximum Residue Levels (MRLs) for mefentrifluconazole in/on blueberries, currants (black, red and white) and mulberries (black and white). Following assessment, new MRLs have been introduced to accommodate new extensions of authorisations for minor use of plant protection products in Great Britain for: Blueberries from 0.01* mg/kg to 2 mg/kg, Mulberries (black and white) from 0.01 mg/kg to 2 mg/kg, Currants (black, red and white) from 2 mg/kg (temporary MRL) to 2 mg/kg. The Evaluation Report/Reasoned Opinion supporting the new MRLs is available at the following link: The evaluation of new MRLs for mefentrifluconazole in or on various commodities.The assessment/ reasoned opinion has concluded that the residue levels arising in food from the notified uses result in consumer exposures below the toxicological reference values.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/GBR/124", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-26", "member": "영국", "type": "정규통보", "topic": "농약 잔류허용기준", "ko": "코덱스 잔류허용기준(CCPR 56) 반영 GB MRL 신설", "orig": "New GB MRLs following on from CCPR 56 (2025) amending the GB MRL Statutory Register", "products": "Acetamiprid, azoxystrobin, cyclobutrifluram, etofenprox, fenpropidin, fipronil, flupyradifurone, difluoroacetic acid, folpet, pydiflumetofen, and tetraniliprole* For reference, the full list of GB commodity codes is set out in Part 1 of the GB pesticides Maximum Residue Level Statutory Register – see link", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NGBR124.docx", "note": "", "desc": "The measure adopts Codex Maximum Residue Levels (CXLs) endorsed as new international food standards by the 48th session of the Codex Alimentarius Commission. CXLs are being adopted for the following active substances for a range of commodities: acetamiprid, azoxystrobin, cyclobutrifluram, etofenprox, fenpropidin, fipronil, flupyradifurone, difluoroacetic acid, folpet, pydiflumetofen, and tetraniliprole. The Evaluation Report/ Reasoned Opinion supporting the new MRLs is available at the following link: Evaluation Report and Reasoned Opinion on the Assessment of Codex MRLs - 2025.pdfThe residue levels arising in food and feed from the notified uses result in consumer exposures below the toxicological reference values. As the residue levels exceed the current MRLs in force, new MRLs are being adopted.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/BRA/2479", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-27", "member": "브라질", "type": "정규통보", "topic": "농약(유효성분)", "ko": "농약 유효성분 M56(메트프록시사이클론) 모노그래프 신규 등재 결의안", "orig": "Draft Resolution 1389, 20 March 2025", "products": "Environment. Health protection. Safety (ICS code(s): 13)", "hs": "", "deadline": "2026-05-26", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NBRA2479.docx", "note": "", "desc": "This draft resolution proposes the inclusion of active ingredient M56 - METPROXIBICLONE on the Monograph List of Active Ingredients for Pesticides, Household Cleaning Products and Wood Preservatives, which was published by Normative Instruction 103 on 19 October 2021 in the Brazilian Official Gazette (DOU - Diário Oficial da União).", "adopt": "To be determined after the end of the consultation period.", "eif": "To be determined after the end of the consultation period."}, {"sym": "G/SPS/N/BRA/2480", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-27", "member": "브라질", "type": "정규통보", "topic": "농약(유효성분)", "ko": "농약 유효성분 A74(아스카로사이드 ascr#18) 모노그래프 신규 등재 결의안", "orig": "Draft Resolution 1387, 16 March 2026", "products": "Environment. Health protection. Safety (ICS code(s): 13)", "hs": "", "deadline": "2026-05-26", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NBRA2480.docx", "note": "", "desc": "This draft resolution proposes the inclusion of active ingredient A74 - ASCAROSÍDEO ASCR#18 on the Monograph List of Active Ingredients for Pesticides, Household Cleaning Products and Wood Preservatives, which was published by Normative Instruction 103 on 19 October 2021 in the Brazilian Official Gazette (DOU - Diário Oficial da União).", "adopt": "To be determined after the end of the consultation period.", "eif": "To be determined after the end of the consultation period."}, {"sym": "G/SPS/N/BRA/2481", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-27", "member": "브라질", "type": "정규통보", "topic": "농약(유효성분)", "ko": "노난산 모노그래프에 쌀·귀리·호밀·보리·기장·밀·트리티케일 추가 결의안", "orig": "Draft Resolution 1388, 16 March 2026", "products": "Environment. Health protection. Safety (ICS code(s): 13)", "hs": "1001, 1002, 1003, 1004, 1006, 10082", "deadline": "2026-05-26", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NBRA2481.docx", "note": "", "desc": "This draft resolution proposes the inclusion of rice, oats, rye, barley, millet, wheat, and triticale in Monograph A72 - NONANIC ACID, in the List of Monographs on Active Ingredients for Pesticides, Household Cleaning Products, and Wood Preservatives, published by Normative Instruction 103 on 19 October 2021, in the Official Gazette (DOU).", "adopt": "To be determined after the end of the consultation period.", "eif": "To be determined after the end of the consultation period."}, {"sym": "G/SPS/N/EU/933", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-27", "member": "유럽연합", "type": "정규통보", "topic": "오염물질", "ko": "식품 중 푸란류(푸란·2-메틸푸란·3-메틸푸란) 최대기준 설정안", "orig": "DraftCommission Regulation (EU) amending Regulation (EU) 2023/915 as regards maximum levels of the sum of furan, 2-methylfuran and 3-methylfuran in processed cereal-based food for infants and young children and in baby food (Text with EEA relevance)", "products": "Processed cereal-based foods for infants and young children and baby food", "hs": "190110", "deadline": "2026-05-26", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEU933.docx", "note": "", "desc": "The Scientific Panel on Contaminants in the Food Chain of the European Food Safety Authority (EFSA) concluded in 2017 in its scientific opinion on the risks that the presence of furan and methylfurans in food poses to public health. In 2024, there were several notifications in the Rapid Alert System for Food and Feed (RASFF) on the presence of furan, 2-methylfuran and 3-methylfuran in baby food that are of health concern. Therefore, this draft Regulation establishes maximum levels for the sum of furan, 2-methylfuran and 3-methylfuran in processed cereal-based food for infants and young children and in baby food to ensure a high level of public health protection.", "adopt": "Estimated July 2026.", "eif": "This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union . It shall apply from 1 January 2028. The foodstuffs listed in the Annex, lawfully placed on the market before the entry into force of this Regulation, may remain on the market until the date of minimum durability or use-by-date."}, {"sym": "G/SPS/N/EU/934", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-27", "member": "유럽연합", "type": "정규통보", "topic": "오염물질", "ko": "대마잎 침출차 중 델타-9-THC 최대기준 설정안", "orig": "Draft Commission Regulation (EU) amending Regulation (EU) 2023/915 as regards maximum levels of the sum of delta-9-tetrahydrocannabinol (Δ9-THC) in hemp leaves for water infusion and hemp leave infusions (Text with EEA relevance)", "products": "Hemp leaves for water infusion and ready to drink hemp leave infusions", "hs": "", "deadline": "2026-05-26", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEU934.docx", "note": "", "desc": "Exposure estimates to Δ9‐THC indicated that the Acute Reference Dose (ArfD) of 1 μg/kg bw established by the European Food Safety Authority (EFSA) was exceeded in certain acute exposure scenarios. Although the exposure estimates are expected to overestimate acute exposure to Δ9‐THC in the Union, the current exposure to Δ9-THC is considered a potential health concernTherefore, the draft Regulation establishes maximum levels for the sum of Δ9‐THC and Δ9-THCA, expressed in Δ9‐THC equivalents, in hemp leaves for water infusion and ready to drink hemp leave infusions to ensure a high level of human health protection.", "adopt": "Estimated July 2026.", "eif": "This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union . It shall apply from 1 January 2027. The foodstuffs listed in the Annex, lawfully placed on the market before the entry into force of this Regulation, may remain on the market until the date of minimum durability or use-by-date."}, {"sym": "G/SPS/N/EU/935", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-27", "member": "유럽연합", "type": "정규통보", "topic": "오염물질", "ko": "식품 중 3-MCPD·3-MCPD 지방산에스테르·글리시딜 지방산에스테르 최대기준 개정안", "orig": "Draft Commission Regulation (EU) amending Regulation (EU) 2023/915 as regards maximum levels of 3‐monochloropropanediol (3-MCPD), 3-MCPD fatty acid esters and glycidyl fatty acid esters in certain foods (Text with EEA relevance)", "products": "Baby food, processed cereal based food for infants and young children and compound food containing more than 5 % fat and containing added vegetable oils and fats and/or fish oils and/or oils from other marine organisms", "hs": "190110", "deadline": "2026-05-26", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NEU935.docx", "note": "", "desc": "The Scientific Panel on Contaminants in the Food Chain) of the European Food Safety Authority adopted in 2016 a scientific opinion on the risks for human health related to the presence of 3- and 2-monochloropropanediol (MCPD), and their fatty acid esters, and on glycidyl fatty acid esters in food. In 2017, the EFSA updated its risk assessment on 3-monochloropropanediol (‘3-MCPD’) and its fatty acid esters. The conclusion of these scientific opinions is that the presence of glycidyl esters in food is of health concern and the presence of 3-MCPD and its fatty acid esters is of health concern in certain exposure scenarios and population groups. Therefore, maximum levels for glycidyl fatty acid esters, expressed as glycidol, and for the sum of 3-MCPD and 3-MCPD fatty acid esters, expressed as 3-MCPD were already established in Commission Regulation (EU) 2023/915 (http://data.europa.eu/eli/reg/2023/915/2025-10-08) for vegetable oils and fats, fish oils and oils from other marine organisms, for infant formulae, follow-on formulae and food for special medical purposes intendedfor infants and young children and young child formulaeThis draft Commission Regulation foresees to establish in addition maximum levels for glycidyl fatty acid esters, expressed as glycidol, and for the sum of 3-MCPD and 3-MCPD fatty acid esters, expressed as 3-MCPD in baby food, processed cereal based food for infants and young children and compound food containing more than 5% fat and containing added vegetable oils and fats and/or fish oils and/or oils from other marine organisms to ensure a high level of human health protection.", "adopt": "Estimated July 2026.", "eif": "This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union . It shall apply from 1 January 2027. The foodstuffs listed in the Annex, lawfully placed on the market before the entry into force of this Regulation, may remain on the market until the date of minimum durability or use-by-date."}, {"sym": "G/SPS/N/GBR/125", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-27", "member": "영국", "type": "정규통보", "topic": "농약 잔류허용기준", "ko": "인독사카브 잔류허용기준안(GB MRL 등록부 개정)", "orig": "Proposed GB MRLs for indoxacarb amending the GB MRL Statutory Register", "products": "Almonds (0120010), brazil nuts (0120020), cashew nuts (0120030), chestnuts (0120040), coconuts (0120050), hazelnuts/cobnuts (0120060), macadamias (0120070), pecans (0120080), pine nut kernels (0120090), pistachios (0120100), walnuts (0120110), others – tree nuts (0120990), apples (0130010), pears (0130020), apricots (0140010), cherries (sweet) (0140020), peaches (0140030), plums (0140040), others ", "hs": "", "deadline": "2026-05-26", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NGBR125.docx", "note": "", "desc": "Indoxacarb is not an approved active substance in Great Britain (GB). Following the non-approval decision, the Health and Safety Executive carried out a review in line with the UK’s regulatory regime. Following assessment, new GB MRLs are proposed. For the full list of changes please refer to the draft Evaluation Report/Reasoned Opinion. The Evaluation Report/Reasoned Opinion supporting the new MRLs is available at the following link: The review of the existing MRLs for indoxacarb The assessment/ reasoned opinion has concluded that the current MRLs for the following commodities do not satisfy the UK’s appropriate level of protection and therefore new lowered MRLs are adopted: apples, pears, stone fruits, grapes, blackberries, blueberries, rose hips, bananas, tomatoes, sweet peppers/bell peppers, aubergines/egg plants, cucurbits with edible peel, cucurbits with inedible peel, flowering brassica, leafy brassica, lamb’s lettuce/corn salads, lettuces, escaroles/broad-leaved endives, roman rocket/rucola, baby leaf crops (including brassica species), spinaches, chards/beet leaves, basil and edible flowers, cardoons, celeries, florence fennels, rhubarbs, cotton seeds, and milk. Following assessment new raised MRLs are being adopted for tree nuts, potatoes, sweet corn, and maize/corn. All new MRLs result in consumer exposures below the toxicological reference values.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/GBR/126", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-27", "member": "영국", "type": "정규통보", "topic": "농약 잔류허용기준", "ko": "헥시티아족스 잔류허용기준안(GB MRL 등록부 개정)", "orig": "Proposed GB MRLs for hexythiazox amending the GB MRL Statutory Register", "products": "Grapefruits (0110010), oranges (0110020), lemons (0110030), limes (0110040), mandarins (0110050), others – citrus fruit (0110990), apples (0130010), pears (0130020), strawberries (0152000), blackberries (0153010), dewberries (0153020), raspberries (red and yellow) (0153030), others – cane fruit (0153990), teas (0610000), chicken – eggs (1030010), duck – eggs (1030020), geese – eggs (1030030), quai", "hs": "", "deadline": "2026-05-26", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NGBR126.docx", "note": "", "desc": "Hexythiazox is an approved active substance in Great Britain (GB). An application was received by the Health and Safety Executive (HSE) to set new Maximum Residue Levels (MRLs) for raspberries and blackberries. In light of chronic dietary intake concerns identified during the initial assessment, HSE also reviewed existing MRLs for additional commodities. Following assessment, new MRLs are being proposed for adoption to the commodities listed in Section 3. The draft Reasoned Opinion supporting the new MRLs is available at the following link: The evaluation of new MRLs and the review of MRLs for hexythiazox in or on various commoditiesThe assessment/ reasoned opinion has concluded that the current MRLs for citrus fruit, apples, and pears do not satisfy the UK's appropriate level of protection therefore new lowered MRLs are being adopted for these commodities. Following assessment new raised MRLs are being adopted for raspberries, blackberries, strawberries, dewberries, others-cane fruits, teas and eggs. All new MRLs result in consumer exposures below the toxicological reference values.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/SLV/150", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-27", "member": "엘살바도르", "type": "정규통보", "topic": "폐수", "ko": "특수 폐수 하수도 배출 기술규정(RTS 13.05.02:26) — 식품 관련성 낮음", "orig": "Reglamento Técnico Salvadoreño (RTS) 13.05.02:26 AGUA. AGUAS RESIDUALES DE TIPO ESPECIAL DESCARGADAS AL SISTEMA DE ALCANTARILLADO SANITARIO DE LA ADMINISTRACIÓN NACIONAL DE ACUEDUCTOS Y ALCANTARILLADOS -ANDA- (Salvadoran Technical Regulation (RTS) No. 13.05.02:26 Water. Non-domestic sewage water discharged into the sanitary sewer system of the National Authority for Water and Sewerage Systems (ANDA))", "products": "Liquid waste. Sludge (ICS code: 13.030.20); Sewage water (ICS code: 13.060.30)", "hs": "", "deadline": "2026-05-26", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NSLV150.docx", "note": "", "desc": "The notified Salvadoran Technical Regulation establishes the permissible limits for the quality parameters of non-domestic sewage water discharged, directly or indirectly, into the sanitary sewer system of ANDA or of private entities.It applies to any natural or legal person, public or private, titleholder of any activity, work or project that discharges non-domestic sewage water, directly or indirectly, into the sanitary sewer system of ANDA or of private entities, located in the national territory.The regulation does not apply to sewage water discharged into recipient water bodies covered by the current version of RTS AGUA. AGUAS RESIDUALES. PARÁMETROS DE CALIDAD DE AGUAS RESIDUALES PARA DESCARGA Y MANEJO DE LODOS RESIDUALES (RTS Water. Sewage Water. Quality parameters for the discharge of sewage water and management of sludge)", "adopt": "To be determined", "eif": "To be determined"}, {"sym": "G/SPS/N/CHN/1324/Add.2", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-30", "member": "중국", "type": "추가통보", "topic": "해외작업장 등록", "ko": "수입식품 해외생산기업 등록관리규정(해관총서령 제280호) 시행 세부사항 — 공식 추천 등록 대상 목록 등", "orig": "Implementation Notification about Regulations of the People's Republic of China on the Customs Administration of Registration of Overseas Manufacturers of Imported Food", "products": "Foods", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/SPS/NCHN1324A2.docx", "note": "같은 시행 통보를 TBT로도 통보(G/TBT/N/CHN/1964/Add.2)", "desc": "On 11 October 2025, the General Administration of Customs of the People's Republic of China (GACC) issued the revised \"Administrative Provisions on the Customs Registration of Overseas Manufacturers of Imported Food in the People's Republic of China\" (Decree No. 280), which shall take effect on 1 June 2026. To detail the supporting requirements for the Decree No. 280, based on risk assessment, GACC has issued the \"Catalog of Imported Food Requiring Official Recommendation for Registration\" and the list of food products not eligible for automatic registration renewal. It has clarified the scope of overseas storage enterprises for imported food subject to registration management, detailed the declaration requirements for imported food related to registration, and updated and published the website addresses for registration processing and common registration information inquiries, providing convenience for relevant parties to apply for registration online. The relevant content has been publicly released in the form of an announcement.", "adopt": "", "eif": ""}, {"sym": "G/SPS/N/JPN/1396", "more": 0, "area": "SPS", "group": "식품안전", "date": "2026-03-31", "member": "일본", "type": "정규통보", "topic": "농약 잔류허용기준", "ko": "아피도피로펜 잔류허용기준 개정안", "orig": "Revision of the Specifications and Standards for F ecember 2026Saccharides, edible fats and oils: effective from 31 December 2027", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/TZA/1516", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-03-06", "member": "탄자니아", "type": "정규통보", "topic": "품질규격", "ko": "아마씨 탄자니아 표준안", "orig": "AFDC 19(3883) DTZS, Flaxseed/Linseed — Specification, First edition", "products": "Linseed, whether or not broken. (HS code(s): 1204); Oilseeds (ICS code(s): 67.200.20)", "hs": "1204", "deadline": "2026-05-05", "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/TZA1516.docx", "note": "", "desc": "This Tanzania Standard specifies the requirements, sampling and test methods for raw and roasted flaxseed/linseed (Linum usitatissimum) intended for human consumption.Note: This Draft Tanzania Standard was also notified under SPS committee.", "adopt": "", "eif": ""}, {"sym": "G/TBT/N/CHE/301/Corr.1", "more": 0, "area": "TBT", "group": "식품 TBT", "date": "2026-03-09", "member": "스위스", "type": "정정통보", "topic": "식품용 기구·포장", "ko": "화학물질 위험저감 시행령(PFAS 등) 개정안 통보 정정 — 식품접촉재 포함", "orig": "Draft Ordinance of the Federal Council concerning amendments of the Ordinance on the Reduction of Risks relating to the Use of Certain Particularly Dangerous Substances, Preparations and Articles (Chemical Risk Reduction Ordinance, ORRChem, Fedlaw number: SR 814.81)", "products": "Food contact materials", "hs": "", "deadline": null, "link": "https://docs.wto.org/imrd/directdoc.asp?DDFDocuments/T/G/TBTN26/CHE301C1.docx", "note": "", "desc": "The notified draft ordinance does not only cover food contact materials, but also 1) Firefighting foams containing per- and polyfluoroalkyl substances (PFASs), including ready-to-use portable fire extinguishers.2) Packaging and labelling for partially halogenated unsaturated hydrofluorocarbons, 3) Substances, articles and preparations containing perfluorooctane sulfonic acid and its derivatives,4) Substances, articles and preparations containing perfluorocarboxyl
